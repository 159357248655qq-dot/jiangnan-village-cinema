<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>江南古村 · 一键生成</title>
<style>
:root{
  --paper:#f5f0e4;
  --paper2:rgba(246,241,230,.90);
  --ink:#25251f;
  --ink2:#6a6555;
  --red:#a23a2a;
  --gold:#a98a4e;
  --line:rgba(58,52,38,.18);
  --shadow:0 10px 34px rgba(48,42,28,.13), 0 1px 0 rgba(255,255,255,.7) inset;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e7e2d5}
body{
  font-family:"Songti SC","STSong","SimSun","宋体",serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block}

/* 纸纹 + 暗角 */
#stage::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(120% 100% at 50% 45%, rgba(255,255,255,0) 46%, rgba(74,66,46,.18) 100%),
    repeating-linear-gradient(0deg, rgba(120,110,86,.020) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}

/* ---------- 品牌：竖排 ---------- */
.brand{
  position:fixed;left:38px;top:34px;z-index:6;
  display:flex;gap:14px;align-items:flex-start;
  opacity:0;transform:translateY(-8px);transition:.9s cubic-bezier(.2,.8,.2,1);
}
.brand.show{opacity:1;transform:none}
.brand h1{
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:"KaiTi","STKaiti","楷体","Songti SC",serif;
  font-size:30px;letter-spacing:.30em;font-weight:600;margin:0;
  color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.85);
}
.brand h1::after{
  content:"";display:block;width:1px;height:56px;margin:12px auto 0;
  background:linear-gradient(var(--line),transparent);
}
.seal{
  width:44px;height:44px;border:1.5px solid var(--red);border-radius:3px;
  color:var(--red);font-family:"KaiTi","楷体",serif;font-size:13px;line-height:1.05;
  display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:3px;
  letter-spacing:0;opacity:.92;margin-top:2px;
  box-shadow:0 0 0 2px rgba(162,58,42,.10);
}
.seal span{display:block;transform:scale(.94)}

/* ---------- 视角 ---------- */
.views{
  position:fixed;right:34px;top:34px;z-index:6;display:flex;flex-direction:column;gap:8px;
  opacity:0;transform:translateY(-8px);transition:.9s .12s cubic-bezier(.2,.8,.2,1);
}
.views.show{opacity:1;transform:none}
.views button{
  font-family:inherit;font-size:12.5px;letter-spacing:.16em;color:var(--ink2);
  background:var(--paper2);border:1px solid var(--line);border-radius:2px;
  padding:7px 13px 7px 15px;cursor:pointer;backdrop-filter:blur(6px);
  transition:.25s;box-shadow:0 2px 8px rgba(60,52,34,.06);
}
.views button:hover{color:var(--ink);border-color:rgba(58,52,38,.4)}
.views button.act{color:var(--red);border-color:rgba(162,58,42,.55);background:rgba(250,244,232,.96)}

/* ---------- 规则面板 ---------- */
#panel{
  position:fixed;right:34px;top:50%;transform:translateY(-50%) translateX(0);
  width:272px;z-index:6;
  background:var(--paper2);border:1px solid var(--line);border-radius:2px;
  box-shadow:var(--shadow);backdrop-filter:blur(9px);
  padding:16px 16px 12px;transition:.5s cubic-bezier(.2,.8,.2,1),opacity .5s;
  opacity:0;
}
#panel.show{opacity:1}
#panel.fold{transform:translateY(-50%) translateX(calc(100% + 34px))}
#panel h2{
  font-size:12px;font-weight:600;letter-spacing:.28em;color:var(--ink2);
  margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;
}
#panel h2 i{font-style:normal;font-size:10.5px;letter-spacing:.1em;color:#9a9482}
#rulesToggle{
  position:absolute;left:-30px;top:50%;transform:translateY(-50%);
  width:30px;height:74px;border:1px solid var(--line);border-right:none;
  background:var(--paper2);cursor:pointer;color:var(--ink2);font-size:11px;
  writing-mode:vertical-rl;letter-spacing:.22em;border-radius:2px 0 0 2px;
  font-family:inherit;padding:8px 0;backdrop-filter:blur(9px);
}
#panel.fold #rulesToggle{left:-30px}
#rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
#rules li{display:grid;grid-template-columns:16px 1fr;gap:2px 7px;font-size:12.5px;line-height:1.45}
#rules li i{
  grid-row:1/3;font-style:normal;font-size:11px;width:15px;height:15px;border-radius:50%;
  display:grid;place-items:center;color:#fff;margin-top:2px;
}
#rules li.ok i{background:#6d8456}
#rules li.bad i{background:var(--red)}
#rules em{font-style:normal;color:var(--ink);letter-spacing:.06em}
#rules u{text-decoration:none;color:#8d8876;font-size:11px;letter-spacing:.02em}

/* ---------- 底部 ---------- */
.hud{
  position:fixed;left:38px;bottom:34px;z-index:6;
  opacity:0;transform:translateY(10px);transition:.9s .2s cubic-bezier(.2,.8,.2,1);
}
.hud.show{opacity:1;transform:none}
.vname{
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:34px;letter-spacing:.12em;
  margin:0 0 2px;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.vseed{font-size:11px;letter-spacing:.22em;color:#8e8a78;margin:0 0 14px}
#stats{display:flex;gap:0;border-top:1px solid var(--line);padding-top:11px}
.stat{display:flex;flex-direction:column;gap:1px;padding-right:13px;margin-right:13px;border-right:1px solid var(--line)}
.stat:last-child{border:none;margin:0;padding:0}
.stat b{font-family:"KaiTi","楷体",serif;font-size:20px;font-weight:500;letter-spacing:.02em;line-height:1}
.stat span{font-size:10.5px;letter-spacing:.18em;color:#928d7b}
.stat b.moodb{font-size:14.5px;letter-spacing:.08em;padding-top:3px;color:#6d6a58}

/* 生成按钮 */
#regen{
  position:fixed;left:50%;bottom:38px;transform:translateX(-50%);z-index:7;
  font-family:"KaiTi","STKaiti","楷体",serif;font-size:16px;letter-spacing:.30em;
  color:var(--paper);background:var(--red);
  border:none;border-radius:2px;padding:13px 30px 13px 34px;cursor:pointer;
  box-shadow:0 8px 22px rgba(140,48,34,.32), 0 0 0 1px rgba(255,255,255,.14) inset;
  transition:.25s;
}
#regen:hover{background:#8f3123;transform:translateX(-50%) translateY(-2px);
  box-shadow:0 12px 26px rgba(140,48,34,.38)}
#regen:active{transform:translateX(-50%) translateY(0)}
#regen.spin{animation:spin .5s ease}
@keyframes spin{0%{letter-spacing:.30em}50%{letter-spacing:.5em;opacity:.6}100%{letter-spacing:.30em}}

#hint{
  position:fixed;right:36px;bottom:38px;z-index:6;font-size:11px;letter-spacing:.14em;
  color:#847f6d;text-align:right;line-height:1.9;transition:opacity 1.4s;
}
#hint.fade{opacity:0}
#hint kbd{
  font-family:inherit;border:1px solid var(--line);border-radius:2px;padding:1px 5px;
  background:rgba(255,255,255,.4);margin:0 2px;font-size:10px;
}

/* 载入 */
#loading{
  position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  background:rgba(240,235,222,.86);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:.45s;
}
#loading.on{opacity:1;pointer-events:all}
#loading .box{text-align:center}
#loading .ink{
  width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
  border:1px solid rgba(58,52,38,.22);border-top-color:var(--red);
  animation:rot 1s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}
#loadTxt{font-family:"KaiTi","楷体",serif;font-size:15px;letter-spacing:.34em;color:var(--ink2)}

body.noui .brand,body.noui #panel,body.noui .hud,body.noui #regen,body.noui #hint,body.noui .views{display:none!important}
body.noui #stage::after{display:none}

@media (max-width:900px){
  .brand{left:20px;top:20px}
  .brand h1{font-size:22px}
  #panel{display:none}
  .hud{left:20px;bottom:22px}
  .vname{font-size:26px}
  #stats .stat:nth-child(n+5){display:none}
  #regen{bottom:22px;font-size:14px;padding:11px 22px}
  #hint{display:none}
  .views{right:20px;top:20px}
}

</style>
</head>
<body>
<div id="stage"></div>

<header class="brand" id="brand">
  <h1>江南古村</h1>
  <div class="seal"><span>江</span><span>南</span><span>古</span><span>村</span></div>
</header>

<div class="views" id="views">
  <button data-view="wide" class="act">环 看</button>
  <button data-view="over">俯 瞰</button>
  <button data-view="water">临 水</button>
  <button data-view="close">近 观</button>
</div>

<aside id="panel">
  <button id="rulesToggle">规 制</button>
  <h2>规制校验 <i>八条皆守</i></h2>
  <ul id="rules"></ul>
</aside>

<div class="hud" id="hud">
  <h2 class="vname" id="vname">—</h2>
  <p class="vseed" id="vseed">—</p>
  <div id="stats"></div>
</div>

<button id="regen">另择吉地</button>

<div id="hint">拖动旋转 · 滚轮远近 · 右键平移<br><kbd>空格</kbd> 另择一地</div>

<div id="loading">
  <div class="box">
    <div class="ink"></div>
    <div id="loadTxt">正在相地…</div>
  </div>
</div>

<script>
/* ==== js/geo.js ==== */
/* ============================================================
   GEO —— 江南古村 · 公共几何基石
   所有模型必须基于此库构建，保证风格统一 + 可合并为极少 draw call
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- 调色板：江南 · 雨后黛瓦白墙 ---------- */
  const C = {
    // 墙体（徽派白墙是冷白，带石灰的灰，不是米黄）
    wall:        0xe7e7e2,
    wallDirty:   0xd0d3ce,
    wallShadow:  0xb8bbb6,
    wallWarm:    0xeeeee6,
    // 瓦
    tile:        0x4c545e,
    tileDark:    0x30363d,
    tileLight:   0x525b64,
    tileGreen:   0x3d4a44,
    // 木
    wood:        0x6b4d38,
    woodDark:    0x4e3728,
    woodLight:   0x8a6748,
    woodRed:     0x8f3b2c,
    lacquer:     0x9c3a2b,
    // 石
    stone:       0x9b988d,
    stoneDark:   0x76746b,
    stoneLight:  0xb3b0a4,
    stoneWet:    0x82837a,
    // 植被
    leaf:        0x51663f,
    leafDark:    0x35462c,
    leafLight:   0x738752,
    leafAutumn:  0x8b7c46,
    bamboo:      0x5d6e42,
    trunk:       0x5c4a3a,
    // 田地
    soil:        0x7d6a52,
    soilWet:     0x655441,
    rice:        0x8c9a5e,
    riceYoung:   0x9aa66c,
    veg:         0x6d8450,
    // 水与天
    water:       0x436762,
    gold:        0xc9a24b,
    white:       0xf2efe6,
    ink:         0x2a2a28,
    paper:       0xf3ece0,
  };

  /* ---------- 确定性随机 ---------- */
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t = Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- 共享材质：按表面类型分档，粗糙度/金属度各异 ---------- */
  const MAT = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.94, metalness: 0.0, flatShading: false
  });
  const MAT_GLOW = new THREE.MeshBasicMaterial({ vertexColors: true });
  const MAT_FLAT = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1.0, metalness: 0.0, flatShading: true

  const SURF = {
    plaster: { r: 0.97, m: 0.00, e: 0.30 },
    tile:    { r: 0.55, m: 0.10, e: 0.85 },   // 黛瓦：有釉光
    wood:    { r: 0.66, m: 0.00, e: 0.36 },
    stone:   { r: 0.84, m: 0.00, e: 0.48 },
    leaf:    { r: 0.90, m: 0.00, e: 0.34 },
    gold:    { r: 0.30, m: 0.90, e: 1.10 },
    dark:    { r: 0.88, m: 0.00, e: 0.22 }
  };
  const surfCache = {};
  function surfMat(k) {
    if (surfCache[k]) return surfCache[k];
    const c = SURF[k] || SURF.stone;
    const m = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: c.r, metalness: c.m
    });
    m.envMapIntensity = c.e;
    m.onBeforeCompile = makeDetail(k);
    surfCache[k] = m;
    return m;
  }

  /* ---------- 程序化表面细节（无贴图）：世界坐标三平面噪声 ----------
     反照率斑驳 + 法线浮雕 + 粗糙度起伏，全部按材质类型分支。 */

      pos[o] = x; pos[o + 1] = y; pos[o + 2] = z;
      nor[o] = nx; nor[o + 1] = ny; nor[o + 2] = nz;

      o += 3;
    };
    const jf = function (i) {
      if (jit <= 0) return 1;
      return 1 + (((Math.sin(i * 7.77 + rTop * 31.1 + rBot * 17.3) * 43758.5453) % 1) - 0.5) * jit * 2;
    };

    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const x0b = c0 * rBot, z0b = s0 * rBot, x1b = c1 * rBot, z1b = s1 * rBot;
      const x0t = c0 * rTop, z0t = s0 * rTop, x1t = c1 * rTop, z1t = s1 * rTop;
      const j = jf(i);
      // 侧面两三角：(p0,p2,p1) + (p0,p3,p2)
      put(x0b, -hy, z0b, c0, 0, s0, j);
      put(x1t, hy, z1t, c1, 0, s1, j);
      put(x1b, -hy, z1b, c1, 0, s1, j);
      put(x0b, -hy, z0b, c0, 0, s0, j);
      put(x0t, hy, z0t, c0, 0, s0, j);
      put(x1t, hy, z1t, c1, 0, s1, j);

    if (!open) {
      // 顶盖 / 底盖
      for (let i = 0; i < n; i++) {
        const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
        const j = jf(i + 100);
        put(0, hy, 0, 0, 1, 0, j);
        put(Math.cos(a0) * rTop, hy, Math.sin(a0) * rTop, 0, 1, 0, j);
        put(Math.cos(a1) * rTop, hy, Math.sin(a1) * rTop, 0, 1, 0, j);
        put(0, -hy, 0, 0, -1, 0, j);
        put(Math.cos(a1) * rBot, -hy, Math.sin(a1) * rBot, 0, -1, 0, j);
        put(Math.cos(a0) * rBot, -hy, Math.sin(a0) * rBot, 0, -1, 0, j);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = opt.glow ? MAT_GLOW : (opt.flat ? MAT_FLAT : MAT);
    const m = new THREE.Mesh(g, mat);
    m.userData.glow = !!opt.glow;
    m.position.set(opt.x || 0, opt.y !== undefined ? opt.y : h / 2, opt.z || 0);
    if (opt.rx) m.rotation.x = opt.rx;
    if (opt.ry) m.rotation.y = opt.ry;
    if (opt.rz) m.rotation.z = opt.rz;

    m.receiveShadow = opt.glow ? false : (opt.receive !== false);

  }

  /* 平面（默认水平，XZ 面） */
  function slab(w, d, color, opt) {
    opt = opt || {};
    const g = new THREE.PlaneGeometry(w, d, opt.sx || 1, opt.sz || 1);
    g.rotateX(-Math.PI / 2);
    const m = mesh(g, color, opt);
    m.position.set(opt.x || 0, opt.y !== undefined ? opt.y : 0, opt.z || 0);
    if (opt.ry) m.rotation.y = opt.ry;
    return m;
  }

  /* 两点之间的方梁 */
  function beam(ax, ay, az, bx, by, bz, thick, color, opt) {
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const g = new THREE.BoxGeometry(thick, len, thick, 1, 1, 1);
    g.translate(0, len / 2, 0);
    const m = mesh(g, color, opt || {});
    m.position.set(ax, ay, az);
    const up = new THREE.Vector3(0, 1, 0);
    const dir = new THREE.Vector3(dx, dy, dz).normalize();
    m.quaternion.setFromUnitVectors(up, dir);
    return m;
  }

  /* 四边形面片（自定义四点，用于飞檐等） */
  function quad(p0, p1, p2, p3, color, opt) {
    const g = new THREE.BufferGeometry();
    const v = new Float32Array([
      p0[0], p0[1], p0[2], p1[0], p1[1], p1[2], p2[0], p2[1], p2[2],
      p0[0], p0[1], p0[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2],
    ]);
    g.setAttribute('position', new THREE.BufferAttribute(v, 3));
    g.computeVertexNormals();
    return mesh(g, color, opt || {});
  }

  /* ---------- 中式屋顶 ---------- */
  /* 双坡屋顶（硬山/悬山），沿 X 为脊向，向 ±Z 落坡
     o: {w, d, h, over, concave, color, ridge(w?), ridgeColor, tilt, y} */
  function roof(o) {
    const w = o.w, d = o.d, h = o.h !== undefined ? o.h : d * 0.34;
    const over = o.over !== undefined ? o.over : 0.55;
    const con = o.concave !== undefined ? o.concave : 1.7;
    const col = o.color !== undefined ? o.color : C.tile;
    const ridgeCol = o.ridgeColor !== undefined ? o.ridgeColor : C.tileDark;
    const g = new THREE.Group();
    const halfD = d / 2 + over;
    const eaveY = o.eaveY !== undefined ? o.eaveY : 0;
    const segs = 4;
    const thick = o.thick || 0.16;

    for (const s of [1, -1]) {
      // 坡面：从脊(u=1)到檐(u=0)
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;              // 0 脊 -> 1 檐
        const u = 1 - t;
        const z = s * halfD * t;
        const y = eaveY + h * Math.pow(u, con);
        pts.push([z, y]);
      }
      // 上表面：带 UV 的瓦片贴图
      for (let i = 0; i < segs; i++) {
        const a = pts[i], b = pts[i + 1];
        const z0 = a[0], y0 = a[1], z1 = b[0], y1 = b[1];
        quadUV(g,
          [-w / 2, y0 + 0.012, z0], [w / 2, y0 + 0.012, z0],
          [w / 2, y1 + 0.012, z1], [-w / 2, y1 + 0.012, z1],
          col, 0.55, 1.15);
      }
      // 檐口封边（瓦当条）
      const ey = eaveY + 0.02, ez = s * halfD;
      const eg = new THREE.BoxGeometry(w + 0.06, 0.11, 0.1);
      const em = mesh(eg, C.tileDark, { jitter: 0.02 });
      em.position.set(0, ey, ez);
      g.add(em);
      // 檐下阴影板
      const sg = new THREE.BoxGeometry(w, thick, 0.5);
      const sm = mesh(sg, C.woodDark, { jitter: 0.03 });
      sm.position.set(0, ey - 0.1, ez - s * 0.28);
      sm.rotation.x = s * 0.12;
      g.add(sm);
    }

    // 正脊
    const rg = new THREE.BoxGeometry(w + 0.12, 0.16, 0.26);
    const rm = mesh(rg, ridgeCol, { jitter: 0.02 });
    rm.position.set(0, eaveY + h + 0.04, 0);
    g.add(rm);
    // 脊端起翘
    for (const sx of [1, -1]) {
      const t = new THREE.BoxGeometry(0.3, 0.13, 0.2);
      const tm = mesh(t, ridgeCol, { jitter: 0.02 });
      tm.position.set(sx * (w / 2 + 0.05), eaveY + h + 0.13, 0);
      tm.rotation.z = -sx * 0.35;
      g.add(tm);
    }
    if (o.ridgeOrn) {
      const og = new THREE.BoxGeometry(0.14, 0.28, 0.14);
      const om = mesh(og, ridgeCol, {});
      om.position.set(0, eaveY + h + 0.2, 0);
      g.add(om);
    }
    g.position.y = o.y || 0;
    return g;
  }

  /* 四坡 / 攒尖顶：sides=4 或 8，带飞檐起翘
     o: {r, h, sides, over, color, eaveY, curl, glow} */
  function pyramidRoof(o) {
    const sides = o.sides || 4;
    const r = o.r, h = o.h || r * 0.55;
    const over = o.over !== undefined ? o.over : r * 0.42;
    const eaveY = o.eaveY || 0;
    const curl = o.curl !== undefined ? o.curl : h * 0.42;
    const col = o.color !== undefined ? o.color : C.tile;
    const g = new THREE.Group();
    const steps = 6;
    const rot0 = o.rot || 0;

    // 每一面：从檐口到塔尖，檐角起翘
    for (let i = 0; i < sides; i++) {
      const a0 = rot0 + (i / sides) * Math.PI * 2;

      const apex = [Math.cos(am) * r * 0.06, eaveY + h, Math.sin(am) * r * 0.06];

            Math.cos(ang) * rr,

          p0[0] + (apex[0] - p0[0]) * t0 * 0.72,
          p0[1] + (apex[1] - p0[1]) * t0 * 0.78,
          p0[2] + (apex[2] - p0[2]) * t0 * 0.72

        const q1 = [
          p1[0] + (apex[0] - p1[0]) * t1 * 0.72,
          p1[1] + (apex[1] - p1[1]) * t1 * 0.78,
          p1[2] + (apex[2] - p1[2]) * t1 * 0.72

        quad(p0, p1, q1, q0, col, { jitter: 0.04 });

      beam(c0[0], c0[1] - 0.02, c0[2], apex[0], apex[1], apex[2], 0.09, C.tileDark, { jitter: 0.02 });
      // 檐角上挑的戗脊端
      const tipDir = [Math.cos(a0), 0, Math.sin(a0)];
      beam(c0[0], c0[1] - 0.02, c0[2],
        c0[0] + tipDir[0] * 0.16, c0[1] + 0.16, c0[2] + tipDir[2] * 0.16,
        0.07, C.tileDark, { jitter: 0.02 });

    const fin = cyl(r * 0.03, r * 0.09, h * 0.1, 8, o.gold ? C.gold : C.tileDark, { y: eaveY + h });
    g.add(fin);
    return g;
  }

  /* 马头墙：阶梯状山墙，沿 Z 分段升高
     o: {d, h, thick, color, capColor, steps} */
  function matouWall(o) {

    const segD = d / 2 / steps;
    for (const s of [1, -1]) {

        const hh = h * (1 - i * (0.85 / steps));

        const z1 = s * (i === 0 ? segD : (i + 1) * segD);

      }
    }
    return g;
  }

  /* 窗棂：木格窗 */
  function lattice(o) {
    const w = o.w || 0.9, h = o.h || 0.9;
    const col = o.color !== undefined ? o.color : C.woodDark;
    const g = new THREE.Group();
    const fr = 0.07;
    g.add(box(w, fr, 0.09, col, { y: 0 }));
    g.add(box(w, fr, 0.09, col, { y: h - fr }));
    g.add(box(fr, h, 0.09, col, { x: -w / 2 + fr / 2, y: 0 }));
    g.add(box(fr, h, 0.09, col, { x: w / 2 - fr / 2, y: 0 }));
    const nx = Math.max(2, Math.round(w / 0.19)), ny = Math.max(2, Math.round(h / 0.19));
    for (let i = 1; i < nx; i++) g.add(box(0.028, h - fr * 2, 0.05, col, { x: -w / 2 + (w / nx) * i, y: fr }));
    for (let j = 1; j < ny; j++) g.add(box(w - fr * 2, 0.028, 0.05, col, { y: fr + ((h - fr * 2) / ny) * j }));

    const back = box(w - 0.02, h - 0.02, 0.02, 0x1b1e20, { y: fr, cast: false });
    g.add(back);
    return g;
  }

  /* 石阶 */
  function stairs(o) {
    const w = o.w, n = o.n || 3, rise = o.rise || 0.12, run = o.run || 0.22;
    const col = o.color !== undefined ? o.color : C.stone;
    const g = new THREE.Group();
    for (let i = 0; i < n; i++) {
      g.add(box(w, rise * (n - i), run, col, {
        y: 0, z: (i - n / 2) * run, jitter: 0.04
      }));
    }
    return g;
  }

  /* 栏杆（沿 X 方向，长度 w） */
  function railing(o) {
    const w = o.w, h = o.h || 0.45;
    const col = o.color !== undefined ? o.color : C.stone;
    const g = new THREE.Group();
    g.add(box(w, 0.075, 0.1, col, { y: h - 0.05 }));
    const n = Math.max(2, Math.round(w / 0.5));
    for (let i = 0; i <= n; i++) {
      g.add(box(0.07, h, 0.07, col, { x: -w / 2 + (w / n) * i, y: 0 }));
    }
    g.add(box(w, 0.06, 0.06, col, { y: h * 0.45 }));
    return g;
  }

  /* ---------- 合并静态几何（分类材质 + 烘焙假 AO + 预分配直写） ---------- */
  function mergeStatic(root, opts) {
    opts = opts || {};

    const buckets = new Map();

    root.traverse(obj => {
      if (!obj.isMesh) return;
      let p = obj.parent, skip = false;
      while (p) { if (p.userData && p.userData.noMerge) { skip = true; break; } p = p.parent; }
      if (skip) return;
      let mat = obj.material;
      let cls = 'default';
      if (mat === MAT || mat === MAT_FLAT) {
        if (opts.mat) { mat = opts.mat; }        // 生命体：整只一个材质，避免按颜色拆成 2-3 个 draw call
        else {
          const ca = obj.geometry.attributes.color;

          mat = surfMat(cls);
        }

      let b = buckets.get(mat.uuid);
      if (!b) { b = { mat, list: [], verts: 0 }; buckets.set(mat.uuid, b); }
      const g = obj.geometry;
      const needAO = obj.matrixWorld.elements[13] < 3.5;
      b.list.push({ g, m: obj.matrixWorld, count: g.index ? g.index.count : g.attributes.position.count, ao: needAO });
      b.verts += (g.index ? g.index.count : g.attributes.position.count);

    const out = new THREE.Group();
    const _m3 = new THREE.Matrix3();
    const bakeAO = opts.ao !== false;
    // 贴地暗化查表（-1 ~ 14.75，步长 0.25），避免逐顶点算 exp
    const AOLUT = new Float32Array(64);
    for (let i = 0; i < 64; i++) {
      const yy = -1 + i * 0.25;
      AOLUT[i] = 1 - 0.40 * Math.exp(-Math.max(0, yy + 0.45) / 1.05);
    }

    for (const [, b] of buckets) {
      const total = b.verts;
      const pos = new Float32Array(total * 3);
      const nor = new Float32Array(total * 3);
      const col = new Float32Array(total * 3);
      const needUV = !!b.mat.map;
      const uvs = needUV ? new Float32Array(total * 2) : null;
      let o = 0;

      for (const item of b.list) {
        const g = item.g;
        const mp = g.attributes.position;
        const mn = g.attributes.normal;
        const mc = g.attributes.color;
        const mu = g.attributes.uv;
        const mw = item.m.elements;
        _m3.getNormalMatrix(item.m);
        const nm = _m3.elements;
        const idxArr = g.index ? g.index.array : null;
        const n = item.count;

        for (let i = 0; i < n; i++) {
          const vi = idxArr ? idxArr[i] : i;
          const x = mp.getX(vi), y = mp.getY(vi), z = mp.getZ(vi);
          const k = (o + i) * 3;
          const wy = mw[1] * x + mw[5] * y + mw[9] * z + mw[13];
          pos[k] = mw[0] * x + mw[4] * y + mw[8] * z + mw[12];
          pos[k + 1] = wy;
          pos[k + 2] = mw[2] * x + mw[6] * y + mw[10] * z + mw[14];

          let ny = 1;
          if (mn) {
            const nx0 = mn.getX(vi), ny0 = mn.getY(vi), nz0 = mn.getZ(vi);
            const ox = nm[0] * nx0 + nm[3] * ny0 + nm[6] * nz0;
            const oy = nm[1] * nx0 + nm[4] * ny0 + nm[7] * nz0;
            const oz = nm[2] * nx0 + nm[5] * ny0 + nm[8] * nz0;
            const l = Math.sqrt(ox * ox + oy * oy + oz * oz) || 1;
            nor[k] = ox / l; nor[k + 1] = oy / l; nor[k + 2] = oz / l;
            ny = oy / l;
          }

          let r = 1, gg = 1, bb2 = 1;
          if (mc) { r = mc.getX(vi); gg = mc.getY(vi); bb2 = mc.getZ(vi); }

          if (bakeAO && item.ao) {
            // 贴地接触暗化 + 朝下表面压暗 + 朝上表面提亮
            let ai = ((wy + 1) * 4) | 0;
            if (ai < 0) ai = 0; else if (ai > 63) ai = 63;
            const hFade = AOLUT[ai];
            const upFac = 0.87 + 0.13 * Math.max(0, ny);
            const dnFac = ny < 0 ? (1 + 0.40 * ny) : 1;
            const ao = hFade * upFac * dnFac;
            r *= ao; gg *= ao; bb2 *= ao;
          }
          col[k] = r; col[k + 1] = gg; col[k + 2] = bb2;
          if (uvs) {
            const j = (o + i) * 2;
            if (mu) { uvs[j] = mu.getX(vi); uvs[j + 1] = mu.getY(vi); }
            else { uvs[j] = 0; uvs[j + 1] = 0; }

        }
        o += n;
      }
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      merged.setAttribute('color', new THREE.BufferAttribute(col, 3));
      if (uvs) merged.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      merged.computeBoundingSphere();
      const m = new THREE.Mesh(merged, b.mat);
      m.castShadow = b.mat !== MAT_GLOW;
      m.receiveShadow = b.mat !== MAT_GLOW;
      if (b.mat.userData && b.mat.userData.alphaDepth && b.mat.map) {
        if (!GEO._alphaDepthMat) {
          GEO._alphaDepthMat = new THREE.MeshDepthMaterial({
            depthPacking: THREE.RGBADepthPacking,
            map: b.mat.map, alphaTest: b.mat.alphaTest
          });
        }
        m.customDepthMaterial = GEO._alphaDepthMat;
      }
      out.add(m);
    }
    return out;
  }

  /* 阴影用的低模代理（可选，暂不使用） */

  global.GEO = {
    C, MAT, MAT_GLOW, MAT_FLAT, MAT_LEAF, mesh, box, cyl, slab, beam, quad,
    roof, pyramidRoof, matouWall, lattice, stairs, railing,
    paint, mergeStatic, surfMat, setTint, detail, rng: mulberry32, leafCard, leafMaterial, leafTexture, MAT_ROOF, roofTexture, quadUV

})(window);

<script>
/* ==== js/models/house.js ==== */
/* ============================================================
   MODELS.house —— 徽派 / 江南民居
   依赖：js/geo.js（GEO / C）+ three.js
   坐标：地面 y=0，原点在占地矩形中心，正面(+Z)为大门方向
   约束：只用 GEO.* 造几何；随机数只用外部传入的 rnd
   ============================================================ */
(function () {
  'use strict';

  window.MODELS = window.MODELS || {};

  /* ---------- 局部三角/四边面工具（补 GEO 未直接覆盖的面片） ---------- */
  function faceTri(G, p0, p1, p2, color, out) {
    var ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
    var vx = p2[0] - p0[0], vy = p2[1] - p0[1], vz = p2[2] - p0[2];
    var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    var a = p0, b = p1, c = p2;
    if (out && (nx * out[0] + ny * out[1] + nz * out[2]) < 0) { b = p2; c = p1; }
    var geo = new THREE.BufferGeometry();
    var arr = new Float32Array(9);
    arr[0] = a[0]; arr[1] = a[1]; arr[2] = a[2];
    arr[3] = b[0]; arr[4] = b[1]; arr[5] = b[2];
    arr[6] = c[0]; arr[7] = c[1]; arr[8] = c[2];
    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    geo.computeVertexNormals();
    return G.mesh(geo, color, { jitter: 0.03 });
  }

  function faceQuad(G, p0, p1, p2, p3, color, out, jit) {
    var ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
    var vx = p2[0] - p0[0], vy = p2[1] - p0[1], vz = p2[2] - p0[2];
    var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    var j = (jit === undefined) ? 0.04 : jit;
    if (nx * out[0] + ny * out[1] + nz * out[2] < 0) {
      return G.quad(p0, p3, p2, p1, color, { jitter: j });
    }
    return G.quad(p0, p1, p2, p3, color, { jitter: j });
  }

  window.MODELS.house = function (opt, rnd) {
    opt = opt || {};
    var G = window.GEO;
    var C = window.C;
    var R = (typeof rnd === 'function') ? rnd : function () { return 0.5; };
    var g = new THREE.Group();

    function fr(a, b) { return a + (b - a) * R(); }

    function bx(p, w, h, d, col, x, y, z, jit) {
      var m = G.box(w, h, d, col, { x: x, y: y, z: z, jitter: jit === undefined ? 0.04 : jit });
      p.add(m);
      return m;
    }

    /* ===================== 尺寸参数 ===================== */
    var TYPES = {
      small: { w: 5.6, d: 5.0, h1: 4.00, h2: 0.0 },
      mid:   { w: 7.0, d: 6.4, h1: 4.15, h2: 0.0 },
      tall:  { w: 6.7, d: 6.7, h1: 3.95, h2: 3.15 },
      shop:  { w: 8.6, d: 6.2, h1: 4.40, h2: 0.0 }
    };
    var type = 'mid';
    if (opt.type === 'small' || opt.type === 'mid' || opt.type === 'tall' || opt.type === 'shop') type = opt.type;
    var cfg = TYPES[type];

    var w = (opt.w && opt.w > 0) ? opt.w : cfg.w * fr(0.94, 1.07);
    var d = (opt.d && opt.d > 0) ? opt.d : cfg.d * fr(0.94, 1.07);
    w = Math.max(4.6, Math.min(w, 13.0));
    d = Math.max(4.4, Math.min(d, 13.0));
    if (type === 'tall') { w = Math.max(w, 5.9); d = Math.max(d, 5.7); }
    if (type === 'shop') { w = Math.max(w, 6.9); }

    var podH = fr(0.56, 0.84);       /* 石砌勒脚高 */
    var tw = 0.36;                   /* 墙厚 */
    var bodyW = w - 0.74;            /* 两侧山墙中线间距（含压顶出挑余量） */
    var bodyD = d - 0.70;
    var hw = bodyW / 2;
    var hd = bodyD / 2;
    var eaveY = cfg.h1 + fr(-0.10, 0.10);
    var rOver = fr(0.44, 0.52);      /* 檐口外挑，< 0.55 */
    var doorW = Math.min(1.56, bodyW * 0.36);
    var doorH = Math.min(2.16, eaveY - podH - 0.94);

    /* ===================== 台基 / 勒脚 ===================== */
    var plW = bodyW + 0.46;
    var plD = bodyD + 0.22;
    bx(g, plW, podH, plD, C.stone, 0, podH / 2, 0, 0.03);
    bx(g, plW + 0.012, 0.028, plD + 0.012, C.stoneDark, 0, podH - 0.09, 0, 0.02);
    bx(g, plW + 0.012, 0.028, plD + 0.012, C.stoneDark, 0, podH * 0.52, 0, 0.02);
    var nJ = Math.max(3, Math.round(plW / 0.64));
    for (var ji = 1; ji < nJ; ji++) {
      var jx = -plW / 2 + (plW * ji) / nJ;
      bx(g, 0.026, podH - 0.10, 0.018, C.stoneDark, jx, podH / 2, plD / 2 + 0.008, 0.01);
      bx(g, 0.026, podH - 0.10, 0.018, C.stoneDark, jx, podH / 2, -plD / 2 - 0.008, 0.01);
    }
    /* 墙脚青苔（薄板贴地） */
    var mossCols = [C.leafDark, C.tileGreen, C.leafDark, C.tileGreen];
    for (var mi = 0; mi < 5; mi++) {
      var mMx = fr(-plW / 2 + 0.35, plW / 2 - 0.35);
      var mMw = fr(0.34, 0.88);
      var mMh = fr(0.10, 0.20);
      bx(g, mMw, mMh, 0.018, mossCols[mi % 4], mMx, mMh / 2 + 0.004, plD / 2 + 0.010, 0.08);
    }
    for (var mi2 = 0; mi2 < 2; mi2++) {
      bx(g, 0.018, fr(0.10, 0.18), fr(0.30, 0.70), mossCols[mi2],
        -plW / 2 - 0.010, 0.09, fr(-plD / 2 + 0.4, plD / 2 - 0.4), 0.08);
    }

    /* ===================== 墙体（带洞口） ===================== */
    function wallSeg(x0, x1, y0, y1, zc) {
      if (x1 - x0 < 0.015 || y1 - y0 < 0.015) return;
      bx(g, x1 - x0, y1 - y0, tw, C.wall, (x0 + x1) / 2, (y0 + y1) / 2, zc, 0.03);
    }

    /* 按 X 切条、逐条按 Y 填充，得到真实的门窗洞口 */
    function wallWithOpenings(x0, x1, yb, yt, ops, zc) {
      var xs = [x0, x1], i, j;
      for (i = 0; i < ops.length; i++) { xs.push(ops[i].x0); xs.push(ops[i].x1); }
      xs.sort(function (a, b) { return a - b; });
      var ux = [];
      for (j = 0; j < xs.length; j++) {
        if (j === 0 || xs[j] - ux[ux.length - 1] > 0.0015) ux.push(xs[j]);
      }
      for (i = 0; i < ux.length - 1; i++) {
        var a = ux[i], b = ux[i + 1], mid = (a + b) / 2;
        var hit = null;
        for (j = 0; j < ops.length; j++) {
          if (mid > ops[j].x0 && mid < ops[j].x1) { hit = ops[j]; break; }
        }
        if (!hit) {
          wallSeg(a, b, yb, yt, zc);
        } else {
          wallSeg(a, b, yb, hit.y0, zc);
          wallSeg(a, b, hit.y1, yt, zc);
        }
      }
    }

    function backWall(bw, bd, bottom, top) {
      bx(g, bw - 0.34, top - bottom, tw, C.wall, 0, (bottom + top) / 2, -(bd / 2 - tw / 2), 0.03);
    }

    /* ===================== 马头墙 ===================== */
    /* GEO.matouWall 各级高度 = y0 + h*(1 - i*0.85/n)，末级 = y0 + h*(0.15+0.85/n)
       反解 h / y0，使末级压顶恰好探出檐口、最高一级高于正脊 */
    function gable(bw, bd, eave, rh, baseY) {
      var ridgeY = eave + rh;
      var nS = (bd > 6.35) ? 6 : 5;
      var f = 0.15 + 0.85 / nS;
      var H = (rh + 0.26 - 0.22) / (1 - f);
      var y0 = ridgeY + 0.26 - H;
      if (y0 < baseY) { y0 = baseY; H = ridgeY + 0.26 - y0; }
      if (H < 0.6) H = 0.6;

      if (y0 - baseY > 0.05) {
        bx(g, tw, y0 - baseY, bd, C.wall, bw / 2, (baseY + y0) / 2, 0, 0.03);
        bx(g, tw, y0 - baseY, bd, C.wall, -bw / 2, (baseY + y0) / 2, 0, 0.03);
      }
      var mA = G.matouWall({ d: bd, h: H, thick: tw, color: C.wall, capColor: C.tileDark, steps: nS });
      mA.position.set(bw / 2, y0, 0);
      g.add(mA);
      var mB = G.matouWall({ d: bd, h: H, thick: tw, color: C.wall, capColor: C.tileDark, steps: nS });
      mB.position.set(-bw / 2, y0, 0);
      g.add(mB);
    }

    /* ===================== 屋面 ===================== */
    /* GEO.roof 的坡面 quad 未挂入场景，这里按同一曲线补一层瓦面 skin */
    function roofSkin(rw, bd, eave, rh, conc, col) {
      var halfD = bd / 2 + rOver;
      var w2 = rw / 2;
      var segs = 4;
      for (var s = -1; s <= 1; s += 2) {
        for (var i = 0; i < segs; i++) {
          var t0 = i / segs, t1 = (i + 1) / segs;
          var z0 = s * halfD * t0, z1 = s * halfD * t1;
          var y0 = eave + rh * Math.pow(1 - t0, conc);
          var y1 = eave + rh * Math.pow(1 - t1, conc);
          g.add(faceQuad(G,
            [-w2, y0 - 0.006, z0], [w2, y0 - 0.006, z0],
            [w2, y1 - 0.006, z1], [-w2, y1 - 0.006, z1],
            col, [0, 1, 0], 0.045));
        }
      }
    }

    /* GEO.roof 内瓦垄 box 的 rotation.x 写反（竖成梳齿），按坡面切线重校 */
    function fixRoofTiles(rf, bd, eave, rh, conc) {
      var halfD = bd / 2 + rOver;
      var list = [];
      rf.traverse(function (o) { if (o.isMesh && Math.abs(o.scale.z - 1) > 0.02) list.push(o); });
      for (var i = 0; i < list.length; i++) {
        var m = list[i];
        var z = m.position.z;
        var s = (z >= 0) ? 1 : -1;
        var u = Math.max(0.0001, 1 - Math.abs(z) / halfD);
        var dydz = -s * rh * conc * Math.pow(u, conc - 1) / halfD;
        m.rotation.x = Math.atan2(-s * dydz, s);
        /* 直条瓦垄压在曲面上会两端扎出，略缩短并上抬 */
        m.scale.z *= 0.90;
        m.position.y += 0.028;
      }
    }

    function roofSet(bw, bd, eave, rh, conc) {
      var rw = bw + 0.26;
      roofSkin(rw, bd, eave, rh, conc, C.tile);
      var rf = G.roof({
        w: rw, d: bd, h: rh, over: rOver, concave: conc,
        color: C.tile, ridgeColor: C.tileDark, eaveY: eave, y: 0,
        ridgeOrn: R() < 0.45, thick: 0.14
      });
      fixRoofTiles(rf, bd, eave, rh, conc);
      g.add(rf);

      var halfD = bd / 2 + rOver;
      var s, sz, i;
      /* 屋顶与山墙交接处：泛水小瓦 */
      var zs = 5;
      for (s = -1; s <= 1; s += 2) {
        for (sz = -1; sz <= 1; sz += 2) {
          for (i = 0; i < zs; i++) {
            var z0 = sz * (halfD * i) / zs * 0.97;
            var z1 = sz * (halfD * (i + 1)) / zs * 0.97;
            var y0 = eave + rh * Math.pow(Math.max(0, 1 - Math.abs(z0) / halfD), conc);
            var y1 = eave + rh * Math.pow(Math.max(0, 1 - Math.abs(z1) / halfD), conc);
            var len = Math.sqrt((z1 - z0) * (z1 - z0) + (y1 - y0) * (y1 - y0)) + 0.03;
            var mm = G.box(0.20, 0.07, len, C.tileLight, {
              x: s * (bw / 2 - 0.09), y: (y0 + y1) / 2 + 0.055, z: (z0 + z1) / 2, jitter: 0.03
            });
            mm.rotation.x = Math.atan2(-(y1 - y0), (z1 - z0));
            g.add(mm);
          }
        }
      }
      /* 屋角滴水瓦：檐口每 0.5 一枚小三角 */
      var nD = Math.max(4, Math.round(bw / 0.5));
      for (sz = -1; sz <= 1; sz += 2) {
        var ez = sz * halfD;
        for (i = 0; i <= nD; i++) {
          var dx = -bw / 2 + (bw * i) / nD;
          g.add(faceTri(G,
            [dx - 0.048, eave + 0.046, ez],
            [dx + 0.048, eave + 0.046, ez],
            [dx, eave - 0.118, ez + sz * 0.050],
            C.tileDark, [0, 0, sz]));
        }
      }
    }

    /* ===================== 檐下 ===================== */
    function eaveDetail(bw, bd, eave, rich) {
      var zf = bd / 2;
      bx(g, bw - 0.30, 0.16, 0.16, C.wood, 0, eave - 0.20, zf + 0.05, 0.03);
      bx(g, bw - 0.30, 0.14, 0.14, C.wood, 0, eave - 0.18, -zf - 0.05, 0.03);
      if (!rich) return;
      var nR = Math.max(4, Math.round(bw / 0.62));
      for (var i = 0; i <= nR; i++) {
        var x = -bw / 2 + 0.18 + ((bw - 0.36) * i) / nR;
        bx(g, 0.10, 0.13, 0.26, C.woodDark, x, eave - 0.055, zf + 0.10, 0.03);
      }
      bx(g, bw - 0.52, 0.05, 0.10, C.woodLight, 0, eave - 0.33, zf + 0.035, 0.03);
      var nG = Math.max(3, Math.round((bw - 0.8) / 0.9));
      for (var k = 0; k <= nG; k++) {
        var gx = -(bw - 0.8) / 2 + ((bw - 0.8) * k) / nG;
        bx(g, 0.035, 0.13, 0.07, C.woodLight, gx, eave - 0.395, zf + 0.035, 0.02);
      }
    }

    /* ===================== 窗 ===================== */
    /* 石框（局部，原点在窗洞中心底部，+Z 朝外） */
    function stoneFrame(grp, ww, wh) {
      grp.add(G.box(ww + 0.16, 0.075, 0.14, C.stoneLight, { y: wh + 0.037, z: 0.035, jitter: 0.02 }));
      grp.add(G.box(ww + 0.26, 0.085, 0.19, C.stoneLight, { y: -0.045, z: 0.035, jitter: 0.02 }));
      grp.add(G.box(0.075, wh + 0.075, 0.14, C.stoneLight, { x: -ww / 2 - 0.037, y: wh / 2, z: 0.035, jitter: 0.02 }));
      grp.add(G.box(0.075, wh + 0.075, 0.14, C.stoneLight, { x: ww / 2 + 0.037, y: wh / 2, z: 0.035, jitter: 0.02 }));
    }

    /* 前檐木格窗：墙体已开洞，格心嵌入洞内 */
    function latticeWindow(cx, cy, czFace, ww, wh) {
      var grp = new THREE.Group();
      var L = G.lattice({ w: ww, h: wh, color: C.woodDark });
      /* GEO.lattice 各构件以中心定位、但纵档按底边偏移，故整体上移半窗后回补 */
      grp.position.set(cx, cy + wh / 2 - 0.07, czFace - 0.125);
      // 窗纸：格心后垫一层米白，否则窗洞是纯黑洞
      grp.add(G.box(ww - 0.06, wh - 0.06, 0.028, 0xd7d0bc, { x: 0, y: 0, z: -0.03, jitter: 0.03, cast: false }));
      grp.add(L);
      g.add(grp);

      var fg = new THREE.Group();
      fg.position.set(cx, cy, czFace);
      stoneFrame(fg, ww, wh);
      g.add(fg);
    }

    /* 侧背通风高窗：山墙不可开洞，做暗板 + 木直棂 + 石框 */
    function ventWin(cx, cy, cz, ww, wh, dir) {
      var grp = new THREE.Group();
      grp.add(G.box(ww, wh, 0.02, 0x2a2622, { y: wh / 2, z: -0.012, jitter: 0.02, cast: false }));
      var nb = Math.max(2, Math.round(ww / 0.14));
      for (var i = 1; i < nb; i++) {
        grp.add(G.box(0.028, wh - 0.015, 0.032, C.woodDark, {
          x: -ww / 2 + (ww / nb) * i, y: wh / 2, z: 0.012, jitter: 0.02
        }));
      }
      grp.add(G.box(ww, 0.030, 0.042, C.woodDark, { y: wh * 0.46, z: 0.014, jitter: 0.02 }));
      stoneFrame(grp, ww, wh);

      if (dir === 'back') grp.rotation.y = Math.PI;
      else if (dir === 'right') grp.rotation.y = Math.PI / 2;
      else if (dir === 'left') grp.rotation.y = -Math.PI / 2;
      grp.position.set(cx, cy, cz);
      g.add(grp);
    }

    /* 窗楣（木眉） */
    function windowHood(cx, cy, czFace, ww, wh) {
      bx(g, ww + 0.46, 0.075, 0.22, C.woodDark, cx, cy + wh + 0.115, czFace + 0.095, 0.03);
      bx(g, ww + 0.34, 0.05, 0.15, C.wood, cx, cy + wh + 0.178, czFace + 0.065, 0.03);
    }

    /* ===================== 大门 ===================== */
    function doorSet(cx, base, dw, dh, zf) {
      bx(g, dw + 0.10, dh + 0.08, 0.05, 0x141618, cx, base + dh / 2, zf - 0.29, 0.02);
      bx(g, dw + 0.34, 0.13, 0.30, C.stoneLight, cx, base + 0.065, zf + 0.05, 0.03);
      bx(g, 0.15, dh + 0.10, 0.24, C.woodDark, cx - dw / 2 - 0.075, base + dh / 2, zf + 0.02, 0.02);
      bx(g, 0.15, dh + 0.10, 0.24, C.woodDark, cx + dw / 2 + 0.075, base + dh / 2, zf + 0.02, 0.02);
      bx(g, dw + 0.46, 0.17, 0.28, C.woodDark, cx, base + dh + 0.085, zf + 0.03, 0.02);
      bx(g, dw / 2 - 0.02, dh - 0.03, 0.09, C.wood, cx - dw / 4, base + dh / 2, zf - 0.10, 0.05);
      bx(g, dw / 2 - 0.02, dh - 0.03, 0.09, C.wood, cx + dw / 4, base + dh / 2, zf - 0.10, 0.05);
      bx(g, 0.05, dh - 0.03, 0.10, C.woodDark, cx, base + dh / 2, zf - 0.09, 0.02);
      /* 门环：铺首 + 八段小环 */
      var s, k;
      for (s = -1; s <= 1; s += 2) {
        var rx0 = cx + s * 0.19;
        var ry0 = base + 1.28;
        g.add(G.cyl(0.052, 0.052, 0.030, 8, C.gold, { x: rx0, y: ry0, z: zf - 0.045, rx: Math.PI / 2 }));
        for (k = 0; k < 8; k++) {
          var a = (k / 8) * Math.PI * 2;
          var q = G.box(0.042, 0.026, 0.024, C.gold, {
            x: rx0 + Math.cos(a) * 0.082,
            y: ry0 + Math.sin(a) * 0.082 - 0.032,
            z: zf - 0.050, jitter: 0.02
          });
          q.rotation.z = a;
          g.add(q);
        }
      }
      /* 匾额：C.ink 底 + C.gold 细边 */
      var pH = 0.40;
      var py = base + dh + 0.17 + pH / 2 + 0.035;
      bx(g, 1.40, pH, 0.09, C.ink, cx, py, zf + 0.11, 0.02);
      bx(g, 1.48, 0.042, 0.055, C.gold, cx, py + pH / 2 + 0.021, zf + 0.115, 0.02);
      bx(g, 1.48, 0.042, 0.055, C.gold, cx, py - pH / 2 - 0.021, zf + 0.115, 0.02);
      bx(g, 0.042, pH + 0.084, 0.055, C.gold, cx - 0.719, py, zf + 0.115, 0.02);
      bx(g, 0.042, pH + 0.084, 0.055, C.gold, cx + 0.719, py, zf + 0.115, 0.02);
      for (var t = -1; t <= 1; t++) {
        bx(g, 0.075, pH * 0.52, 0.028, C.gold, cx + t * 0.32, py, zf + 0.160, 0.01);
      }
      /* 门墩：石座 + 抱鼓石 */
      for (s = -1; s <= 1; s += 2) {
        var px = cx + s * (dw / 2 + 0.34);
        bx(g, 0.30, 0.42, 0.48, C.stoneLight, px, 0.21, zf + 0.20, 0.03);
        g.add(G.cyl(0.155, 0.155, 0.30, 10, C.stone, { x: px, y: 0.53, z: zf + 0.20, rz: Math.PI / 2 }));
      }
      /* 门前石阶 2~3 级（stairs 以 y=0 居中，rise 取 2*podH/n 正好落台面） */
      var sn = (R() < 0.7) ? 3 : 2;
      var rise = (2 * podH) / sn;
      var run = 0.30;
      var st = G.stairs({ w: dw + 1.02, n: sn, rise: rise, run: run, color: C.stoneLight });
      st.position.set(cx, 0, zf + (sn * run) / 2 - 0.04);
      g.add(st);
    }

    /* ===================== 做旧 ===================== */
    function agePatches(bw, bd) {
      for (var i = 0; i < 3; i++) {
        bx(g, fr(0.7, 1.9), fr(0.9, 1.7), 0.016,
          (i % 2 === 0) ? C.wallDirty : C.wallShadow,
          fr(-bw * 0.32, bw * 0.32), fr(0.85, 1.55), -bd / 2 - 0.016, 0.05);
      }
      for (var k = 0; k < 2; k++) {
        var sgn = (k === 0) ? 1 : -1;
        bx(g, 0.020, fr(1.0, 1.8), fr(0.8, 1.7),
          (k === 0 ? C.wallDirty : C.wallShadow),
          sgn * (bw / 2 + 0.200), fr(1.1, 1.8), fr(-bd * 0.30, bd * 0.05), 0.05);
      }
    }

    function sideBackWindows(bw, bd) {
      ventWin(-bw * 0.24, 2.52, -bd / 2 - 0.005, Math.min(0.62, bw * 0.13), 0.52, 'back');

      bx(g, 2.30, 0.46, 0.09, C.ink, scx, shopLint - 0.37, hd + 0.10, 0.02);

      doorSet(sdc, podH, sDoorW, doorH, hd);

      var fw = bodyW - 0.34, fwh = fw / 2;

/* ============================================================

  var SIN8 = Math.sin(OCT);

       这里用 GEO.paint 的返回值补回，保证颜色生效；已有则跳过。 */
    function fix(m, col, jit) {

    }
    /* 棱柱（y 为中心） */
    function CY(p, rt, rb, h, seg, col, x, yc, z, o) {
      o = o || {};
      var m = GEO.cyl(rt, rb, h, seg, col, {
        x: x || 0, y: yc, z: z || 0, ry: o.ry || 0, open: !!o.open
      });
      fix(m, col, o.jit === undefined ? 0.04 : o.jit);
      p.add(m);

    function BM(p, ax, ay, az, bx, by, bz, th, col) {
      var m = GEO.beam(ax, ay, az, bx, by, bz, th, col, { jitter: 0.03 });
      fix(m, col, 0.03);

       eaveR 檐口外接半径 / topR 檐顶外接半径 / y0 檐口高 / y1 檐顶高

    var CV = [];

            [b1[0], b1[1] - 0.11 - dY, b1[2]], [b0[0], b0[1] - 0.11 - dY, b0[2]],

    var tiers = [
      { w: 9.40 * kf, h: 0.32 * ks },
      { w: 8.62 * kf, h: 0.38 * ks },
      { w: 8.02 * kf, h: 0.46 * ks }
    ];
    var platTop = 0;
    for (var i = 0; i < tiers.length; i++) platTop += tiers[i].h;

    var py = 0;
    for (var ti = 0; ti < tiers.length; ti++) {
      var T = tiers[ti];
      B(G, T.w, T.h, T.w, ti === 1 ? C.stone : C.stoneLight, 0, py + T.h / 2, 0, 0.055);
      B(G, T.w + 0.16 * kf, 0.08 * ks, T.w + 0.16 * kf, C.stoneLight,
        0, py + T.h - 0.03 * ks, 0, 0.04);
      B(G, T.w + 0.02 * kf, 0.09 * ks, T.w + 0.02 * kf, C.stoneDark,
        0, py + T.h * 0.42, 0, 0.03);
      py += T.h;
    }

    /* 正面踏跺 4 级（逐级实心落地）+ 垂带石 */
    var stN = 4;
    var stRun = 0.30 * kf;
    var stW = 2.30 * kf;
    var stRise = platTop / stN;
    var stairFront = tiers[0].w / 2 + stRun * stN;
    for (var si = 0; si < stN; si++) {
      var sh = platTop - si * stRise;
      B(G, stW, sh, stRun, si === 0 ? C.stoneLight : C.stone,
        0, sh / 2, tiers[0].w / 2 + stRun * (si + 0.5), 0.05);
      B(G, stW * 1.01, 0.055 * ks, stRun * 0.9, C.stoneLight,
        0, sh - 0.028 * ks, tiers[0].w / 2 + stRun * (si + 0.5), 0.04);
    }
    for (var sd = -1; sd <= 1; sd += 2) {
      BM(G, sd * (stW / 2 + 0.09 * kf), platTop + 0.05 * ks, tiers[0].w / 2,
        sd * (stW / 2 + 0.09 * kf), 0.05 * ks, stairFront,
        0.13 * kf, C.stoneLight);
    }
    B(G, stW + 0.34 * kf, 0.065 * ks, 0.20 * kf, C.stoneLight,
      0, 0.033 * ks, stairFront - 0.08 * kf, 0.04);

    /* ============================================================
       二、塔体参数
       ============================================================ */
    var rBase = 3.10 * kf;
    var overBase = 1.12 * kf;
    var brH = 0.16 * ks;              // 斗拱层高
    var midRoofH = 0.58 * ks;         // 腰檐举高
    var topRoofH = 1.62 * ks;
    var finialH = 1.95 * ks;
    var plinthH = 0.20 * ks;          // 首层台明

    var fixedH = platTop + plinthH + FN * brH + midRoofH * (FN - 1) + topRoofH + finialH;
    var availH = H - fixedH;
    if (availH < FN * 0.78 * ks) availH = FN * 0.78 * ks;

    var wsum = 0, wts = [], fi;
    for (fi = 0; fi < FN; fi++) {
      var wv = Math.pow(0.955, fi);
      wts.push(wv); wsum += wv;
    }
    var bodies = [];
    for (fi = 0; fi < FN; fi++) bodies.push(availH * wts[fi] / wsum);

    var taper = 0.918 + rnd() * 0.016;     // 0.918 ~ 0.934 逐层收分

    /* 首层台明（八角石座） */
    CY(G, rBase + 0.30 * kf, rBase + 0.36 * kf, plinthH, 8, C.stoneLight,
      0, platTop + plinthH / 2, 0, { ry: OCT, jit: 0.05 });

    /* ============================================================
       三、逐层塔身
       ============================================================ */
    var y = platTop + plinthH;
    var r = rBase;
    var apexY = 0, topEaveR = 0, topEaveY = 0;

    for (fi = 0; fi < FN; fi++) {
      var bh = bodies[fi];
      var over = overBase + fi * 0.042 * kf;
      var R = r;
      var a = R * COS8;
      var sl = 2 * R * SIN8;
      var tw = 0.21 * kf;
      var deckY = y;
      var wallTop = deckY + bh;
      var eaveY = wallTop + brH;
      var isTop = (fi === FN - 1);
      var roofH = isTop ? topRoofH : midRoofH;
      var curl = (isTop ? 0.30 : 0.26) * ks;
      var Rnext = R * taper;

      /* ---- 平座楼板 + 栏杆（上一层地面） ---- */
      if (fi > 0) {
        var Rd = R + 0.40 * kf;
        CY(G, Rd, Rd, 0.13 * ks, 8, C.woodDark, 0, deckY - 0.03 * ks, 0, { ry: OCT, jit: 0.03 });
        if (dense) CY(G, Rd * 0.985, Rd * 0.985, 0.07 * ks, 8, C.ink, 0, deckY - 0.12 * ks, 0, { ry: OCT, jit: 0.01 });
        CY(G, Rd, Rd, 0.055 * ks, 8, C.woodRed, 0, deckY + 0.40 * ks, 0, { ry: OCT, open: true, jit: 0.03 });
        CY(G, Rd * 0.995, Rd * 0.995, 0.035 * ks, 8, C.woodRed, 0, deckY + 0.17 * ks, 0, { ry: OCT, open: true, jit: 0.03 });
        var np = dense ? 16 : 8;
        for (var pk = 0; pk < np; pk++) {
          var pa = OCT + pk * (2 * Math.PI / np);
          var pr = (pk % 2 === 0) ? Rd : Rd * COS8;
          B(G, 0.065 * kf, 0.44 * ks, 0.065 * kf, C.woodRed,
            Math.cos(pa) * pr, deckY + 0.22 * ks, Math.sin(pa) * pr, 0.03);
        }
      }

      /* ---- 八面墙身 ---- */
      for (var fk = 0; fk < 8; fk++) {
        var fg = new THREE.Group();
        fg.rotation.y = Math.PI / 2 - fk * PI4;
        G.add(fg);
        var zW = a;

        if (fk % 2 === 0) {
          /* 正向面：门洞 */
          var dw = sl * 0.42;
          var dh = bh * 0.72;
          var sw = (sl - dw) / 2;
          B(fg, sw, bh, tw, C.wall, -(dw + sw) / 2, deckY + bh / 2, zW, 0.045);
          B(fg, sw, bh, tw, C.wall, (dw + sw) / 2, deckY + bh / 2, zW, 0.045);
          B(fg, dw, bh - dh, tw, C.wall, 0, deckY + dh + (bh - dh) / 2, zW, 0.045);
          // 门洞（深色内凹）
          B(fg, dw * 0.99, dh * 0.99, 0.05, C.ink, 0, deckY + dh / 2, zW - tw / 2 - 0.01, 0.01);
          if (dense) B(fg, dw * 0.84, dh * 0.86, 0.03, 0x1b1e20, 0, deckY + dh / 2, zW - tw / 2 + 0.04, 0.0);
          // 门框 + 门额
          B(fg, 0.085 * kf, dh, 0.10 * kf, C.woodDark, -dw / 2, deckY + dh / 2, zW + tw / 2, 0.03);
          B(fg, 0.085 * kf, dh, 0.10 * kf, C.woodDark, dw / 2, deckY + dh / 2, zW + tw / 2, 0.03);
          B(fg, dw + 0.15 * kf, 0.10 * ks, 0.12 * kf, C.woodDark,
            0, deckY + dh + 0.03 * ks, zW + tw / 2, 0.03);
          // 门槛石
          B(fg, dw * 0.96, 0.05 * ks, tw * 1.15, C.stoneLight,
            0, deckY + 0.025 * ks, zW + 0.02 * kf, 0.03);
          // 墙脚湿痕（避开门洞）
          B(fg, sw * 0.98, 0.18 * ks, tw + 0.03, C.stoneDark,
            -(dw + sw) / 2, deckY + 0.09 * ks, zW, 0.03);
          B(fg, sw * 0.98, 0.18 * ks, tw + 0.03, C.stoneDark,
            (dw + sw) / 2, deckY + 0.09 * ks, zW, 0.03);
        } else {
          /* 斜向面：实墙 + 木格窗 */
          B(fg, sl, bh, tw, C.wall, 0, deckY + bh / 2, zW, 0.045);
          var ww = sl * 0.34;
          var wh = Math.min(bh * 0.44, 0.80 * ks);
          var wy = deckY + bh * 0.32;
          var lat = GEO.lattice({ w: ww, h: wh, color: C.woodDark });
          var lk = lat.children;
          for (var li = 0; li < lk.length; li++) {
            fix(lk[li], li === lk.length - 1 ? C.ink : C.woodDark, 0.02);
          }
          lat.position.set(0, wy, zW + tw / 2 - 0.015);
          fg.add(lat);
          // 窗套 + 窗台石
          B(fg, ww + 0.13 * kf, 0.055 * ks, 0.10 * kf, C.wood,
            0, wy + wh + 0.045 * ks, zW + tw / 2 + 0.02, 0.03);
          B(fg, ww + 0.22 * kf, 0.07 * ks, 0.15 * kf, C.stoneLight,
            0, wy - 0.028 * ks, zW + tw / 2 + 0.03, 0.03);
          // 墙脚湿痕
          B(fg, sl * 0.99, 0.20 * ks, tw + 0.03, C.stoneDark, 0, deckY + 0.10 * ks, zW, 0.03);
          B(fg, sl * 0.66, 0.09 * ks, 0.02, C.stoneDark, 0, deckY + bh * 0.26, zW + tw / 2, 0.02);
        }

        // 额枋 + 平板枋
        B(fg, sl * 1.02, 0.13 * ks, 0.20 * kf, C.wood, 0, wallTop - 0.055 * ks, zW + 0.01, 0.03);
        B(fg, sl * 1.04, 0.05 * ks, 0.24 * kf, C.woodDark, 0, wallTop + 0.02 * ks, zW + 0.02, 0.03);

        // 斗拱：每面 2 攒（斗 + 拱 + 升）
        for (var bk = -1; bk <= 1; bk += (dense ? 2 : 4)) {
          var bxx = bk * sl * 0.215;
          B(fg, 0.13 * kf, 0.075 * ks, 0.13 * kf, C.woodRed, bxx, wallTop + 0.042 * ks, zW + 0.11 * kf, 0.03);
          B(fg, 0.36 * kf, 0.05 * ks, 0.10 * kf, C.woodDark, bxx, wallTop + 0.105 * ks, zW + 0.13 * kf, 0.03);
          if (dense) {
            B(fg, 0.10 * kf, 0.045 * ks, 0.10 * kf, C.woodRed, bxx, wallTop + 0.15 * ks, zW + 0.13 * kf, 0.03);
          }
        }

        // 首层正面匾额
        if (fi === 0 && fk === 2) {
          B(fg, 0.60 * kf, 0.32 * ks, 0.05, C.gold, 0, wallTop - 0.42 * ks, zW + 0.11 * kf, 0.03);
          B(fg, 0.52 * kf, 0.25 * ks, 0.04, C.ink, 0, wallTop - 0.42 * ks, zW + 0.13 * kf, 0.02);
        }
      }

      /* ---- 檐柱 8 根（柱础 + 朱红柱身 + 柱头） ---- */
      for (var ck = 0; ck < 8; ck++) {
        var ca = OCT + ck * PI4;
        var cx = Math.cos(ca) * R * 0.995;
        var cz = Math.sin(ca) * R * 0.995;
        var colH = bh - 0.04 * ks;
        B(G, 0.26 * kf, 0.09 * ks, 0.26 * kf, C.stone, cx, deckY + 0.045 * ks, cz, 0.04);
        CY(G, 0.098 * kf, 0.112 * kf, colH, 6, C.woodRed, cx, deckY + 0.09 * ks + colH / 2, cz, { jit: 0.05 });
        B(G, 0.235 * kf, 0.08 * ks, 0.235 * kf, C.lacquer, cx, deckY + bh + 0.015 * ks, cz, 0.03);
      }

      /* ---- 出檐 ---- */
      var topR, topY;
      if (isTop) {
        topR = R * 0.20;
        topY = eaveY + roofH;
        apexY = topY;
        topEaveR = R + over;
        topEaveY = eaveY + curl;
      } else {
        topR = Rnext + 0.42 * kf;
        topY = eaveY + roofH;
      }

      // 主屋面（本项目 GEO.pyramidRoof 只输出宝顶，瓦面由此重建）
      var pr = GEO.pyramidRoof({
        r: R, h: topY - eaveY, sides: 8, over: over, color: C.tile,
        eaveY: eaveY, curl: curl, rot: OCT, gold: isTop
      });
      pr.traverse(function (o) { fix(o, C.tileDark, 0.03); });
      G.add(pr);
      G.add(eaveRoof(R + over, topR, eaveY, topY, curl, dense ? 4 : 3));

      // 檐下一圈深色椽头（八棱环，暗示椽头列）
      CY(G, (R + over * 0.86) * 0.995, (R + over * 0.86) * 0.995, 0.07 * ks, 8, C.tileDark,
        0, eaveY - 0.19 * ks, 0, { ry: OCT, open: true, jit: 0.03 });

      /* ---- 檐角风铃：最上 3 层实体，其余小米粒 ---- */
      var fullBell = (fi >= FN - 3);
      for (var bk2 = 0; bk2 < 8; bk2++) {
        var ba = OCT + bk2 * PI4;
        var bx0 = Math.cos(ba) * (R + over) * 0.985;
        var bz0 = Math.sin(ba) * (R + over) * 0.985;
        var by0 = eaveY + curl;
        if (fullBell) {
          B(G, 0.016 * kf, 0.12 * ks, 0.016 * kf, C.ink, bx0, by0 - 0.06 * ks, bz0, 0.0);
          B(G, 0.095 * kf, 0.10 * ks, 0.095 * kf, C.gold, bx0, by0 - 0.175 * ks, bz0, 0.02);
          if (isTop) {
            B(G, 0.04 * kf, 0.045 * ks, 0.04 * kf, C.stoneDark, bx0, by0 - 0.245 * ks, bz0, 0.0);
          }
        } else {
          B(G, 0.048 * kf, 0.065 * ks, 0.048 * kf, C.gold, bx0, by0 - 0.05 * ks, bz0, 0.02);
        }
      }

      /* ---- 递进 ---- */
      y = topY;
      r = Rnext;
    }

    /* ============================================================
       四、塔刹：刹座 + 覆钵 + 相轮 + 宝盖 + 宝珠
       ============================================================ */
    var ay = apexY;
    // 刹杆（贯通相轮）
    CY(G, 0.030 * kf, 0.048 * kf, finialH * 0.94, 6, C.tileDark, 0, ay + finialH * 0.47, 0, { jit: 0.02 });
    // 刹座
    CY(G, 0.34 * kf, 0.52 * kf, 0.14 * ks, 8, C.stoneDark, 0, ay + 0.07 * ks, 0, { ry: OCT, jit: 0.03 });
    // 覆钵
    CY(G, 0.25 * kf, 0.38 * kf, 0.22 * ks, 8, C.tile, 0, ay + 0.25 * ks, 0, { ry: OCT, jit: 0.03 });
    // 相轮：七重金环，自下而上递减
    var ringR = [0.38, 0.345, 0.31, 0.275, 0.24, 0.205, 0.17];
    for (var qi = 0; qi < ringR.length; qi++) {
      CY(G, ringR[qi] * kf, ringR[qi] * kf, 0.052 * ks, 8, C.gold,
        0, ay + (0.44 + qi * 0.145) * ks, 0, { ry: OCT, jit: 0.03 });
    }
    // 宝盖
    CY(G, 0.15 * kf, 0.32 * kf, 0.09 * ks, 8, C.gold, 0, ay + 1.39 * ks, 0, { ry: OCT, jit: 0.03 });
    // 宝珠：上下对锥 + 束腰
    CY(G, 0.03 * kf, 0.20 * kf, 0.16 * ks, 8, C.gold, 0, ay + 1.52 * ks, 0, { ry: OCT, jit: 0.02 });
    CY(G, 0.20 * kf, 0.20 * kf, 0.06 * ks, 8, C.gold, 0, ay + 1.63 * ks, 0, { ry: OCT, jit: 0.02 });
    CY(G, 0.20 * kf, 0.018 * kf, 0.15 * ks, 8, C.gold, 0, ay + 1.735 * ks, 0, { ry: OCT, jit: 0.02 });
    // 刹尖
    CY(G, 0.005, 0.026 * kf, 0.09 * ks, 6, C.gold, 0, ay + 1.855 * ks, 0, { jit: 0.02 });

    /* ---- 四条细链：塔刹 → 顶层檐角 ---- */
    for (var ci = 0; ci < 4; ci++) {
      var cang = OCT + ci * PI4 * 2;
      BM(G,
        Math.cos(cang) * 0.16 * kf, ay + 1.34 * ks, Math.sin(cang) * 0.16 * kf,
        Math.cos(cang) * topEaveR * 0.975, topEaveY - 0.02 * ks, Math.sin(cang) * topEaveR * 0.975,
        0.028 * kf, C.tileDark);
    }

    return G;
  };
})();

</script>
<script>
/* ==== js/models/paifang.js ==== */
/* ============================================================
   石牌坊 · 四柱三间三楼（江南古村）
   ------------------------------------------------------------
   坐标系：地面 y = 0，原点在牌坊中心
           牌坊横跨 X 轴；通行方向为 ±Z（正面朝 +Z）
           占地：X = w，Z ≤ 2.2
   依赖：GEO / C（js/geo.js）
   ============================================================ */
(function () {
  'use strict';

  window.MODELS = window.MODELS || {};

  window.MODELS.paifang = function (opt, rnd) {
    opt = opt || {};
    rnd = (typeof rnd === 'function') ? rnd : function () { return 0.5; };

    var C = window.C;
    var GEO = window.GEO;

    var W = opt.w || 7;
    var H = opt.h || 6.5;
    var isWood = opt.type === 'wood';

    var g = new THREE.Group();

    /* ---------------- 配色（石 / 木 两套） ---------------- */
    var P = isWood ? {
      shaft: C.lacquer, grime: C.woodDark, base: C.stone, trim: C.stoneLight,
      beam: C.lacquer, brk: C.woodRed, brk2: C.woodLight,
      plate: C.woodDark, joint: C.woodDark, drum: C.stoneLight, drumBase: C.stone
    } : {
      shaft: C.stone, grime: C.stoneDark, base: C.stone, trim: C.stoneLight,
      beam: C.stone, brk: C.stoneLight, brk2: C.stone,
      plate: C.stoneLight, joint: C.stoneDark, drum: C.stoneLight, drumBase: C.stone
    };

    /* ---------------- 通用小工具 ---------------- */
    function A(m) { g.add(m); return m; }

    function B(w, h, d, col, x, y, z, jit) {
      return A(GEO.box(w, h, d, col, {
        x: x || 0, y: y, z: z || 0,
        jitter: jit === undefined ? 0.04 : jit
      }));
    }
    /* 按“底标高 / 顶标高”放一块横石 */
    function band(w, d, col, y0, y1, x, z, jit) {
      return B(w, y1 - y0, d, col, x, y0 + (y1 - y0) * 0.5, z, jit);
    }
    function CYL(rt, rb, h, seg, col, x, y, z, rx) {
      return A(GEO.cyl(rt, rb, h, seg, col, {
        x: x || 0, y: y, z: z || 0, rx: rx || 0,
        ry: rx ? 0 : (seg === 4 ? Math.PI / 4 : 0),
        jitter: 0.04
      }));
    }

    /* ---------------- 主体尺寸 ---------------- */
    var colW = 0.44;                                   // 方柱边长（柱脚）
    var rShaft = isWood ? colW * 0.5 : colW * 0.70711; // 四棱柱外接半径
    var segShaft = isWood ? 10 : 4;

    var baseY = 0.38;                      // 柱础顶 = 柱脚
    var topIn = 5.00;                      // 明间内柱顶
    var topOut = 4.20;                     // 次间外柱顶
    var eaveIn = topIn + 0.35;             // 明间檐口 5.35
    var eaveOut = topOut + 0.35;           // 次间檐口 4.55

    var xOut = W * 0.5 - 0.50;                      // 外柱中心（留出柱础/斗拱）
    var u = (xOut * 2 - colW * 3) / 10;             // 明间 4 : 次间 3 : 次间 3
    var gMid = 4 * u;                               // 明间净宽
    var gSide = 3 * u;                              // 次间净宽
    var xIn = gMid * 0.5 + colW * 0.5;              // 内柱中心

    /* =========================================================
       一、屋面：补望板 + 装配
       ========================================================= */
    function addDeck(grp, w, d, h, over, con) {
      var halfD = d * 0.5 + over;
      var segs = 4;
      for (var s = -1; s <= 1; s += 2) {
        var pts = [];
        for (var i = 0; i <= segs; i++) {
          var t = i / segs;
          pts.push([s * halfD * t, h * Math.pow(1 - t, con)]);
        }
        for (var k = 0; k < segs; k++) {
          var a = pts[k], b = pts[k + 1];
          var p0 = [-w * 0.5 + 0.002, a[1] + 0.004, a[0]];
          var p1 = [w * 0.5 - 0.002, a[1] + 0.004, a[0]];
          var p2 = [w * 0.5 - 0.002, b[1] + 0.004, b[0]];
          var p3 = [-w * 0.5 + 0.002, b[1] + 0.004, b[0]];
          grp.add((s > 0)
            ? GEO.quad(p0, p3, p2, p1, C.tile, { jitter: 0.045 })
            : GEO.quad(p0, p1, p2, p3, C.tile, { jitter: 0.045 }));
        }
      }
    }

    function makeRoof(px, y, w, d, h, over, con) {
      var rg = new THREE.Group();
      rg.position.set(px || 0, y, 0);
      addDeck(rg, w, d, h, over, con);
      rg.add(GEO.roof({
        w: w, d: d, h: h, over: over, concave: con,
        color: C.tile, ridgeColor: C.tileDark,
        eaveY: 0, y: 0, thick: 0.14
      }));
      g.add(rg);
      return rg;
    }

    /* =========================================================
       二、柱础 / 柱身 / 做旧 / 抱鼓石
       ========================================================= */
    function plinth(px) {
      band(0.76, 0.76, P.base, 0.00, 0.13, px, 0, 0.05);   // 下层叠涩
      band(0.66, 0.66, P.trim, 0.13, 0.25, px, 0, 0.04);   // 上层叠涩
      CYL(0.28, 0.34, 0.13, isWood ? 10 : 8, P.base, px, 0.315, 0); // 覆盆
    }

    function shaft(px, topY) {
      var h = topY - baseY;
      A(GEO.cyl(rShaft * 0.90, rShaft, h, segShaft, P.shaft, {
        x: px, y: baseY + h * 0.5, z: 0,
        ry: isWood ? 0 : Math.PI / 4, jitter: 0.03
      }));
      band(colW * 1.07, colW * 1.07, P.trim, topY - 0.07, topY, px, 0, 0.03); // 柱头箍
    }

    /* 每 0.6 一道石缝（四面，沿收分贴合柱面） */
    function joints(px, topY) {
      if (isWood) return;
      var h = topY - baseY;
      var y = baseY + 0.58 + rnd() * 0.06;
      while (y < topY - 0.32) {
        var t = (y - baseY) / h;
        var hw = colW * 0.5 * (1 - 0.10 * t);
        var len = colW * 0.84;
        B(len, 0.014, 0.03, P.joint, px, y, hw, 0.02);
        B(len, 0.014, 0.03, P.joint, px, y, -hw, 0.02);
        B(0.03, 0.014, len, P.joint, px + hw, y, 0, 0.02);
        B(0.03, 0.014, len, P.joint, px - hw, y, 0, 0.02);
        y += 0.60;
      }
    }

    /* 柱脚 1.2 高水渍 + 苔痕 */
    function grime(px, topY) {
      var h = Math.min(1.20, topY - baseY - 0.25);
      var t1 = h / (topY - baseY);
      A(GEO.cyl(rShaft * (1 - 0.10 * t1) * 1.035, rShaft * 1.035, h, segShaft, P.grime, {
        x: px, y: baseY + h * 0.5, z: 0,
        ry: isWood ? 0 : Math.PI / 4, jitter: 0.10
      }));

      var n = 2 + Math.floor(rnd() * 2);
      for (var i = 0; i < n; i++) {
        var py = baseY + 0.10 + rnd() * (h - 0.30);
        var t = (py - baseY) / (topY - baseY);
        var hw = colW * 0.5 * (1 - 0.10 * t) * 1.035 + 0.008;
        var pw = 0.09 + rnd() * 0.13;
        var ph = 0.09 + rnd() * 0.18;
        B(pw, ph, 0.02, C.leafDark, px + (rnd() - 0.5) * 0.22, py, hw, 0.10);
        B(pw * 0.8, ph * 0.7, 0.02, C.leafDark, px + (rnd() - 0.5) * 0.22, py + 0.04, -hw, 0.10);
      }
    }

    /* 抱鼓石：柱前后各一，鼓身半嵌柱侧 */
    function drums(px) {
      for (var s = -1; s <= 1; s += 2) {
        var z0 = s * (colW * 0.5 + 0.12);
        band(0.60, 0.34, P.drumBase, 0.00, 0.15, px, z0, 0.04);            // 鼓座
        CYL(0.26, 0.26, 0.17, 12, P.drum, px, 0.42, z0, Math.PI / 2);      // 鼓身
        CYL(0.08, 0.08, 0.19, 8, P.drumBase, px, 0.42, z0, Math.PI / 2);   // 鼓钉
        band(0.24, 0.13, P.drum, 0.60, 0.68, px, z0, 0.05);                // 鼓托
        band(0.17, 0.15, P.drum, 0.68, 0.94, px, z0, 0.05);                // 云头
      }
    }

    var posts = [
      { x: -xOut, top: topOut }, { x: -xIn, top: topIn },
      { x: xIn, top: topIn }, { x: xOut, top: topOut }
    ];
    for (var i = 0; i < posts.length; i++) {
      plinth(posts[i].x); shaft(posts[i].x, posts[i].top);
      joints(posts[i].x, posts[i].top); grime(posts[i].x, posts[i].top);
      drums(posts[i].x);
    }

    /* =========================================================
       三、斗拱
       ========================================================= */
    /* 柱头斗拱：平板枋 + 大斗 + 两层横拱（含散斗），高 0.35 */
    function bracketSet(px, y0, sc) {
      sc = sc || 1;
      B(0.86 * sc, 0.07, 0.66 * sc, P.brk, px, y0 + 0.035, 0, 0.03);            // 平板枋
      B(0.34 * sc, 0.09, 0.34 * sc, P.brk, px, y0 + 0.115, 0, 0.03);            // 大斗
      B(1.04 * sc, 0.065, 0.15, P.brk2, px, y0 + 0.1925, 0, 0.03);              // 一跳拱 X
      B(0.15, 0.065, 0.60 * sc, P.brk2, px, y0 + 0.1925, 0, 0.03);              // 一跳拱 Z
      B(0.11 * sc, 0.06, 0.11 * sc, P.brk, px - 0.30 * sc, y0 + 0.255, 0, 0.03);// 散斗
      B(0.11 * sc, 0.06, 0.11 * sc, P.brk, px + 0.30 * sc, y0 + 0.255, 0, 0.03);
      B(1.22 * sc, 0.06, 0.13, P.brk2, px, y0 + 0.315, 0, 0.03);                // 二跳挑檐拱
    }

    /* 次间小斗拱（单攒，高 0.37） */
    function smallBracket(x, y0) {
      B(0.26, 0.12, 0.26, P.brk, x, y0 + 0.06, 0, 0.03);         // 大斗
      B(0.52, 0.09, 0.14, P.brk2, x, y0 + 0.165, 0, 0.03);       // 拱
      B(0.10, 0.08, 0.11, P.brk, x - 0.19, y0 + 0.25, 0, 0.03);  // 散斗
      B(0.10, 0.08, 0.11, P.brk, x + 0.19, y0 + 0.25, 0, 0.03);
      B(0.64, 0.08, 0.12, P.brk2, x, y0 + 0.33, 0, 0.03);        // 上拱
    }

    /* 雀替（枋下承托） */
    function corbel(x, yTop, dir) {
      B(0.42, 0.15, 0.30, P.trim, x, yTop - 0.075, 0, 0.04);
      B(0.28, 0.13, 0.26, P.trim, x + dir * 0.14, yTop - 0.20, 0, 0.04);
    }

    /* =========================================================
       四、明间：下枋 / 匾额 / 上枋
       ========================================================= */
    var midW = gMid + colW;
    var yLow0 = 3.16, yLow1 = 3.48;
    var yUp0 = 4.74, yUp1 = topIn;

    band(midW, 0.36, P.beam, yLow0, yLow1, 0, 0, 0.04);
    band(midW + 0.05, 0.055, P.trim, yLow1 - 0.055, yLow1, 0, 0, 0.03);  // 石线脚
    band(midW, 0.38, P.beam, yUp0, yUp1, 0, 0, 0.04);
    band(midW + 0.05, 0.055, P.trim, yUp0, yUp0 + 0.055, 0, 0, 0.03);

    corbel(-(gMid * 0.5 - 0.16), yLow0, 1);
    corbel(gMid * 0.5 - 0.16, yLow0, -1);

    /* 匾额：石框体 + 墨底 + 金边 + 四字（双面可视） */
    (function plaque() {
      var cy = (yLow1 + yUp0) * 0.5;
      var pw = Math.min(1.98, gMid + 0.10);      // 顺应明间净宽
      var iw = pw * 0.899;
      var sc = pw / 1.98;
      B(pw, yUp0 - yLow1, 0.30, P.trim, 0, cy, 0, 0.03);        // 石框（四周留 0.10 边框）
      B(iw, 0.88, 0.315, C.ink, 0, cy, 0, 0.02);                // 墨底
      B(iw, 0.028, 0.33, C.gold, 0, cy + 0.44, 0, 0.01);        // 金边
      B(iw, 0.028, 0.33, C.gold, 0, cy - 0.44, 0, 0.01);
      B(0.028, 0.88, 0.33, C.gold, -iw * 0.5, cy, 0, 0.01);
      B(0.028, 0.88, 0.33, C.gold, iw * 0.5, cy, 0, 0.01);
      for (var k = 0; k < 4; k++) {
        var cx = (k - 1.5) * iw * 0.2247;
        B(0.24 * sc, 0.30, 0.04, C.gold, cx, cy + 0.02, 0.17, 0.02);   // 字（凸起）
        B(0.24 * sc, 0.30, 0.04, C.gold, cx, cy + 0.02, -0.17, 0.02);
        B(0.15 * sc, 0.028, 0.045, C.ink, cx, cy - 0.05, 0.185, 0.01);// 笔画暗示
        B(0.15 * sc, 0.028, 0.045, C.ink, cx, cy - 0.05, -0.185, 0.01);
      }
    })();

    /* =========================================================
       五、次间
       ========================================================= */
    function sideBay(sgn) {
      var cx = sgn * (xIn + gSide * 0.5 + colW * 0.5);
      var bw = gSide + colW;

      /* 枋下挂小华板 + 两条竖缝 */
      band(bw - 0.10, 0.07, P.plate, 2.24, 2.56, cx, 0, 0.04);
      band(bw - 0.02, 0.06, P.trim, 2.24, 2.30, cx, 0, 0.03);
      band(bw - 0.02, 0.06, P.trim, 2.50, 2.56, cx, 0, 0.03);
      B(0.05, 0.22, 0.11, C.ink, cx - 0.26, 2.40, 0, 0.02);
      B(0.05, 0.22, 0.11, C.ink, cx + 0.26, 2.40, 0, 0.02);

      /* 下枋 */
      band(bw, 0.34, P.beam, 2.56, 2.82, cx, 0, 0.04);
      band(bw + 0.05, 0.05, P.trim, 2.77, 2.82, cx, 0, 0.03);

      /* 三攒小斗拱 + 背板 */
      band(bw - 0.12, 0.07, P.plate, 2.82, 3.30, cx, 0, 0.04);
      for (var i = -1; i <= 1; i++) smallBracket(cx + i * 0.56, 2.82);

      /* 中枋 */
      band(bw, 0.24, P.beam, 3.30, 3.54, cx, 0, 0.04);

      /* 花窗带 */
      band(bw - 0.10, 0.08, P.plate, 3.54, 3.86, cx, 0, 0.04);
      B(0.05, 0.32, 0.11, P.trim, cx - 0.50, 3.70, 0, 0.03);
      B(0.05, 0.32, 0.11, P.trim, cx + 0.50, 3.70, 0, 0.03);
      B(1.30, 0.032, 0.11, C.ink, cx, 3.62, 0, 0.02);
      B(1.30, 0.032, 0.11, C.ink, cx, 3.70, 0, 0.02);
      B(1.30, 0.032, 0.11, C.ink, cx, 3.78, 0, 0.02);

      /* 上枋 */
      band(bw, 0.34, P.beam, 3.86, topOut, cx, 0, 0.04);
      band(bw + 0.05, 0.05, P.trim, topOut - 0.05, topOut, cx, 0, 0.03);

      /* 次间补间一攒 */
      bracketSet(cx, topOut, 0.70);
    }
    sideBay(-1);
    sideBay(1);

    /* 四根柱头斗拱 + 明间补间一攒 */
    bracketSet(-xOut, topOut, 0.80);
    bracketSet(xOut, topOut, 0.80);
    bracketSet(-xIn, topIn, 0.80);
    bracketSet(xIn, topIn, 0.80);
    bracketSet(0, topIn, 0.75);

    /* =========================================================
       六、屋顶（三楼）+ 正脊脊饰
       ========================================================= */
    var bayCx = xIn + gSide * 0.5 + colW * 0.5;

    makeRoof(0, eaveIn, gMid + 1.20, 1.05, 0.72, 0.50, 1.65);   // 明间主楼
    makeRoof(-bayCx, eaveOut, gSide + 0.62, 0.86, 0.58, 0.44, 1.65);
    makeRoof(bayCx, eaveOut, gSide + 0.62, 0.86, 0.58, 0.44, 1.65);

    /* 正脊脊饰（宝珠），仅主楼 */
    var ridgeY = eaveIn + 0.72 + 0.12;                 // 6.19
    band(0.36, 0.30, C.tileDark, ridgeY - 0.02, ridgeY + 0.06, 0, 0, 0.02);
    CYL(0.10, 0.15, 0.13, 8, C.gold, 0, ridgeY + 0.125, 0);
    A(GEO.box(0.15, 0.12, 0.15, C.tileDark, { x: 0, y: ridgeY + 0.25, z: 0, ry: Math.PI / 4 }));

    /* =========================================================
       七、整体缩放（保证 w / h，进深收在 2.2 内）
       ========================================================= */
    var sx = W / 7;
    var sy = H / 6.5;
    var sz = Math.min(sx, sy);
    var depthBase = 2.05;
    if (depthBase * sz > 2.2) sz = 2.2 / depthBase;
    g.scale.set(sx, sy, sz);

    return g;
  };
})();

<script>
/* ==== js/models/bridge.js ==== */
/* 江南石拱桥 / 石板平桥 —— 重写版
   通行方向 +Z，桥宽沿 X，岸面 y=0，水面约 y=-0.30 */
(function () {
  'use strict';
  window.MODELS = window.MODELS || {};

  const G = GEO, C = GEO.C;

  function bx(g, w, h, d, col, x, y, z, jit) {
    return g.add(G.box(w, h, d, col, { x: x, y: y, z: z, jitter: jit === undefined ? 0.04 : jit }));
  }

  /* 四点面（保证法线朝向 outward） */
  function quad(g, p0, p1, p2, p3, col, jit) {
    const geo = new THREE.BufferGeometry();
    const v = new Float32Array([].concat(p0, p1, p2, p0, p2, p3));
    geo.setAttribute('position', new THREE.BufferAttribute(v, 3));
    geo.computeVertexNormals();
    g.add(G.mesh(geo, col, { jitter: jit === undefined ? 0.05 : jit }));
  }

  G.bridgeArch = function (o) {
    const span = o.span || 6;
    const W = o.width || 2.6;
    const rnd = o.rnd || Math.random;
    const g = new THREE.Group();

    const Rz = span / 2;                   // 拱跨半径
    const Ry = span * 0.44;                // 拱高（坦拱而非半圆）
    const springY = -0.95;                 // 拱脚（水下）
    const half = span / 2 + 0.65;          // 桥总长的一半（两端搭在岸上）
    const crownY = springY + Ry;
    const deckTopY = crownY + 0.36;        // 桥面最高点
    const deckT = 0.26;
    const hw = W / 2;

    function deckY(z) {
      const t = Math.min(1, Math.abs(z) / half);
      return deckTopY * (1 - t * t);
    }
    function archY(z) {
      const t = Math.min(1, Math.abs(z) / Rz);
      return springY + Ry * Math.sqrt(Math.max(0, 1 - t * t));
    }

    const SEG = 14;

    /* ---------- 拱券（楔形券石） ---------- */
    const N = Math.max(11, Math.round(span * 2.4) | 1);
    const thick = 0.55;
    for (let i = 0; i < N; i++) {
      const a0 = Math.PI * (i / N), a1 = Math.PI * ((i + 1) / N);
      const am = (a0 + a1) / 2;
      const z0 = Rz * Math.cos(a0), y0 = springY + Ry * Math.sin(a0);
      const z1 = Rz * Math.cos(a1), y1 = springY + Ry * Math.sin(a1);
      const len = Math.hypot(z1 - z0, y1 - y0) * 1.05;
      const ang = Math.atan2(y1 - y0, z1 - z0);
      const stone = G.box(W + 0.10, thick, len, i % 2 ? C.stone : C.stoneLight, {
        x: 0, y: (y0 + y1) / 2, z: (z0 + z1) / 2, jitter: 0.05
      });
      stone.rotation.x = -ang;
      g.add(stone);
    }
    // 拱眉（两道凸出的券边）
    for (const s of [-1, 1]) {
      for (let i = 0; i < N; i++) {
        const a0 = Math.PI * (i / N), a1 = Math.PI * ((i + 1) / N);
        const z0 = Rz * Math.cos(a0), y0 = springY + Ry * Math.sin(a0);
        const z1 = Rz * Math.cos(a1), y1 = springY + Ry * Math.sin(a1);
        const len = Math.hypot(z1 - z0, y1 - y0) * 1.02;
        const ang = Math.atan2(y1 - y0, z1 - z0);
        const m = G.box(0.11, 0.14, len, C.stoneLight, {
          x: s * (hw + 0.07), y: (y0 + y1) / 2, z: (z0 + z1) / 2, jitter: 0.03
        });
        m.rotation.x = -ang;
        g.add(m);
      }
    }

    /* ---------- 桥身侧立面（拱背到桥面） ---------- */
    for (const s of [-1, 1]) {
      const x = s * hw;
      for (let i = 0; i < SEG; i++) {
        const z0 = -half + (2 * half) * (i / SEG);
        const z1 = -half + (2 * half) * ((i + 1) / SEG);
        const yb0 = Math.max(springY - 0.7, archY(z0) - 0.10);
        const yb1 = Math.max(springY - 0.7, archY(z1) - 0.10);
        const yt0 = deckY(z0);
        const yt1 = deckY(z1);
        // 该段：下缘随拱、上缘随桥面
        quad(g,
          [s > 0 ? x : x, yb0, z0], [x, yb1, z1], [x, yt1, z1], [x, yt0, z0],
          i % 2 ? C.stone : C.stoneLight, 0.05);
        // 石缝
        if (i > 0) {
          bx(g, 0.05, Math.max(0.2, yt0 - yb0), 0.06, C.stoneDark, x + s * 0.01, (yt0 + yb0) / 2, z0, 0.02);
        }
      }
      // 侧立面顶部压檐石
      for (let i = 0; i < SEG; i++) {
        const z0 = -half + (2 * half) * (i / SEG);
        const z1 = -half + (2 * half) * ((i + 1) / SEG);
        const zm = (z0 + z1) / 2;
        const y0 = deckY(z0), y1 = deckY(z1);
        const ang = Math.atan2(y1 - y0, z1 - z0);
        const len = Math.hypot(y1 - y0, z1 - z0) * 1.08;
        const m = G.box(0.20, 0.12, len, C.stoneLight, { x: s * (hw + 0.06), y: (y0 + y1) / 2 + 0.02, z: zm, jitter: 0.03 });
        m.rotation.x = -ang;
        g.add(m);
      }
    }

    /* ---------- 桥面 ---------- */
    for (let i = 0; i < SEG; i++) {
      const z0 = -half + (2 * half) * (i / SEG);
      const z1 = -half + (2 * half) * ((i + 1) / SEG);
      const y0 = deckY(z0), y1 = deckY(z1);
      // 桥面板（上表面）
      quad(g, [-hw, y0, z0], [hw, y0, z0], [hw, y1, z1], [-hw, y1, z1], i % 2 ? C.stone : C.stoneLight, 0.055);
      // 中心车辙石
      quad(g, [-0.28, y0 + 0.012, z0], [0.28, y0 + 0.012, z0],
        [0.28, y1 + 0.012, z1], [-0.28, y1 + 0.012, z1], C.stoneDark, 0.03);
      // 台阶线（横向浅槽）
      bx(g, W - 0.30, 0.02, 0.055, C.stoneDark, 0, (y0 + y1) / 2 + 0.005, (z0 + z1) / 2, 0.02);
      // 板厚侧面
      const zm = (z0 + z1) / 2;
      quad(g, [-hw, y0 - deckT, z0], [hw, y0 - deckT, z0], [hw, y0, z0], [-hw, y0, z0], C.stoneDark, 0.03);
    }
    // 桥端封头
    for (const s of [-1, 1]) {
      const z = s * half;
      bx(g, W + 0.1, 0.5, 0.24, C.stone, 0, -0.24, z, 0.04);
    }

    /* ---------- 栏板与望柱（实心石栏板） ---------- */
    const NP = 6;
    for (const s of [-1, 1]) {
      const x = s * (hw - 0.065);
      let prev = null;
      for (let i = 0; i <= NP; i++) {
        const z = -half + (2 * half) * (i / NP);
        const y = deckY(z);
        if (prev) {
          const zm = (prev.z + z) / 2, ym = (prev.y + y) / 2;
          const len = Math.hypot(z - prev.z, y - prev.y);
          const ang = Math.atan2(y - prev.y, z - prev.z);
          // 实心栏板
          const panel = G.box(0.15, 0.34, len * 0.96, C.stoneLight, { x: x, y: ym + 0.20, z: zm, jitter: 0.03 });
          panel.rotation.x = -ang;
          g.add(panel);
          // 压顶扶手
          const rail = G.box(0.22, 0.09, len * 1.0, C.stone, { x: x, y: ym + 0.42, z: zm, jitter: 0.02 });
          rail.rotation.x = -ang;
          g.add(rail);
        }
        // 望柱
        if (i > 0 && i < NP) {
          bx(g, 0.20, 0.50, 0.20, C.stone, x, y + 0.25, z, 0.03);
          bx(g, 0.24, 0.08, 0.24, C.stoneLight, x, y + 0.53, z, 0.02);
        }
        prev = { z: z, y: y };
      }
      // 端头抱鼓石
      for (const e of [-1, 1]) {
        const z = e * (half - 0.12);
        bx(g, 0.26, 0.34, 0.36, C.stone, x, deckY(z) + 0.14, z, 0.03);
        const drum = G.cyl(0.17, 0.17, 0.14, 10, C.stoneLight, { x: x, y: deckY(z) + 0.36, z: z });
        drum.rotation.z = Math.PI / 2;
        drum.rotation.y = Math.PI / 2;
        g.add(drum);
      }
    }

    /* ---------- 两端驳岸 ---------- */
    for (const s of [-1, 1]) {
      const z = s * (half - 0.35);
      bx(g, W + 0.5, 0.55, 0.7, C.stone, 0, -0.28, z, 0.05);
      bx(g, W + 0.6, 0.1, 0.78, C.stoneLight, 0, 0.02, z, 0.03);
    }

    /* ---------- 青苔与水痕 ---------- */
    for (let i = 0; i < 6; i++) {
      const s = rnd() < 0.5 ? -1 : 1;
      const z = (rnd() * 1.7 - 0.85) * Rz;
      const yb = archY(z) - 0.06 - rnd() * 0.25;
      if (yb < springY - 0.5) continue;
      bx(g, 0.03, 0.10 + rnd() * 0.14, 0.22 + rnd() * 0.30, C.leafDark,
        s * (hw + 0.008), yb, z, 0.02);
    }
    // 拱脚水痕
    for (const s of [-1, 1]) {
      bx(g, W + 0.03, 0.26, 0.05, C.stoneWet, 0, springY + 0.12, s * (Rz * 0.94), 0.03);
    }

    return g;
  };

  /* 石板平桥 */
  G.bridgeFlat = function (o) {
    const span = o.span || 5;
    const W = o.width || 2.4;
    const rnd = o.rnd || Math.random;
    const g = new THREE.Group();
    const half = span / 2 + 1.0;
    const hw = W / 2;

    const nSlab = 3;
    for (let i = 0; i < nSlab; i++) {
      const w = (W - 0.12) / nSlab;
      const x = -hw + 0.06 + w * (i + 0.5);
      // 长条石板，分 2 段错缝
      for (let k = 0; k < 2; k++) {
        const z0 = -half + (2 * half) * (k / 2);
        const z1 = -half + (2 * half) * ((k + 1) / 2);
        bx(g, w - 0.05, 0.16, (z1 - z0) - 0.06, i % 2 ? C.stone : C.stoneLight, x, -0.08, (z0 + z1) / 2, 0.05);
      }
    }
    // 石墩
    const nPier = Math.max(3, Math.round(span / 1.2));
    for (const s of [-1, 1]) {
      const x = s * (hw - 0.16);
      for (let i = 0; i <= nPier; i++) {
        const z = -half + (2 * half) * (i / nPier);
        bx(g, 0.20, 1.0, 0.20, C.stone, x, -0.58, z, 0.04);
        bx(g, 0.26, 0.10, 0.26, C.stoneLight, x, -0.10, z, 0.02);
        // 水下湿段
        bx(g, 0.21, 0.22, 0.21, C.stoneWet, x, -0.78, z, 0.02);
      }
      // 横档石
      for (let i = 0; i < nPier; i++) {
        const z0 = -half + (2 * half) * (i / nPier);
        const z1 = -half + (2 * half) * ((i + 1) / nPier);
        bx(g, 0.10, 0.09, (z1 - z0) * 0.98, C.stone, x, -0.20, (z0 + z1) / 2, 0.02);
      }
    }
    return g;
  };

  window.MODELS.bridge = function (opt, rnd) {
    opt = opt || {};
    rnd = rnd || Math.random;
    if (opt.type === 'flat') return G.bridgeFlat({ span: opt.span, width: opt.width, rnd: rnd });
    return G.bridgeArch({
      span: opt.span || 6, width: opt.width || 2.6,
      rise: opt.rise, rnd: rnd
    });
  };
})();
