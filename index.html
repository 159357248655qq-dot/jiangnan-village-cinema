      sunC: 0xffe9d8, sunI: 1.58, sunPos: [-78, 38, 30], hemiS: 0xd6d6cf, hemiG: 0x6a6448, hemiI: 0.46,
      fillC: 0xa9bed0, fillI: 0.34, deep: 0x2c403e, shallow: 0x6b7864, wSky: 0xe2cdb2, exp: 0.86
    },
    {
      name: '烟雨', skyTop: 0xa7b3b1, skyBot: 0xd8ddda, fog: 0xc7d0cc, fogNear: 260, fogFar: 700,
      sunC: 0xe4ecee, sunI: 1.05, sunPos: [-44, 62, 36], hemiS: 0xc6d6d8, hemiG: 0x646a55, hemiI: 0.50,
      fillC: 0xb9c8cc, fillI: 0.40, deep: 0x2a4341, shallow: 0x55716c, wSky: 0xc3d1d0, exp: 0.82
    }
  ];

  let curMood = 1;

  function setMood(i) {
    const idx = ((i % MOODS.length) + MOODS.length) % MOODS.length;
    const m = MOODS[idx];
    curMood = idx;
    scene.fog.color.setHex(m.fog).convertSRGBToLinear();
    scene.fog.near = m.fogNear;
    scene.fog.far = m.fogFar;
    if (skyMat) {
      skyMat.uniforms.top.value.setHex(m.skyTop).convertSRGBToLinear();
      skyMat.uniforms.bot.value.setHex(m.skyBot).convertSRGBToLinear();
      skyMat.uniforms.sun.value.set(m.sunPos[0], m.sunPos[1], m.sunPos[2]).normalize();
    }
    if (sun) {
      sun.color.setHex(m.sunC).convertSRGBToLinear();
      sun.intensity = m.sunI;
      sun.position.set(m.sunPos[0], m.sunPos[1], m.sunPos[2]);
    }
    if (hemiLight) {
      hemiLight.color.setHex(m.hemiS).convertSRGBToLinear();
      hemiLight.groundColor.setHex(m.hemiG).convertSRGBToLinear();
      hemiLight.intensity = m.hemiI;
    }
    if (fillLight) {
      fillLight.color.setHex(m.fillC).convertSRGBToLinear();
      fillLight.intensity = m.fillI;
    }
    if (rimLight) {
      rimLight.color.setHex(m.sunC).convertSRGBToLinear();
      rimLight.position.set(-m.sunPos[0] * 0.6, 26, -m.sunPos[2] * 0.8);
      rimLight.intensity = m.sunI * 0.14;
    }
    if (waterMat) {
      waterMat.uniforms.uDeep.value.setHex(m.deep).convertSRGBToLinear();
      waterMat.uniforms.uShallow.value.setHex(m.shallow).convertSRGBToLinear();
      waterMat.uniforms.uSky.value.setHex(m.wSky).convertSRGBToLinear();
      waterMat.uniforms.uFogC.value.setHex(m.fog).convertSRGBToLinear();
      waterMat.uniforms.uFogNear.value = m.fogNear;
      waterMat.uniforms.uFogFar.value = m.fogFar;
      waterMat.uniforms.uHasCube.value = 0;
      waterMat.uniforms.uSun.value.set(m.sunPos[0], m.sunPos[1], m.sunPos[2]).normalize();
    }
    if (postMat) postMat.uniforms.uExposure.value = m.exp;
    buildEnvMap(idx, m);
    return m.name;
  }

  /* 由天穹生成环境贴图：材质才有真实的环境反射，而不是一片死白 */
  function buildEnvMap(idx, m) {
    if (!pmrem) pmrem = new THREE.PMREMGenerator(renderer);
    if (envMood === idx) return;
    envMood = idx;
    if (envRT) { envRT.dispose(); envRT = null; }
    const s = new THREE.Scene();
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        top: { value: new THREE.Color(m.skyTop).convertSRGBToLinear() },
        bot: { value: new THREE.Color(m.skyBot).convertSRGBToLinear() },
        sun: { value: new THREE.Vector3(m.sunPos[0], m.sunPos[1], m.sunPos[2]).normalize() }
      },
      vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 top,bot,sun; varying vec3 vP;
        void main(){
          vec3 d = normalize(vP);
          float h = clamp(d.y*1.15+0.06, 0.0, 1.0);
          vec3 col = mix(bot, top, pow(h,0.72));
          float s = max(dot(d, normalize(sun)), 0.0);
          col += vec3(1.0,0.93,0.78) * pow(s, 6.0) * 0.55;
          col = mix(col, vec3(0.20,0.19,0.14), smoothstep(0.0,-0.35,d.y)*0.85);
          gl_FragColor = vec4(col,1.0);
        }`
    });
    const sph = new THREE.Mesh(new THREE.SphereGeometry(30, 32, 20), mat);
    s.add(sph);
    envRT = pmrem.fromScene(s, 0.03, 0.1, 120);
    scene.environment = envRT.texture;
    sph.geometry.dispose();
    mat.dispose();
  }

  /* ---------------- 后期：SSAO + ACES 调色 ---------------- */
  function initPost() {
    const size = renderer.getDrawingBufferSize(new THREE.Vector2());
    const w = Math.max(2, size.x | 0), h = Math.max(2, size.y | 0);
    const isGL2 = renderer.capabilities.isWebGL2;
    const type = isGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType;

    if (rtMain) { rtMain.dispose(); if (rtMain.depthTexture) rtMain.depthTexture.dispose(); }
    if (rtAO) rtAO.dispose();

    rtMain = new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: type, format: THREE.RGBAFormat, stencilBuffer: false
    });
    rtMain.depthTexture = new THREE.DepthTexture(w, h);
    rtMain.depthTexture.type = isGL2 ? THREE.UnsignedIntType : THREE.UnsignedShortType;

    rtAO = new THREE.WebGLRenderTarget(w >> 1, h >> 1, {
      minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      type: THREE.UnsignedByteType, format: THREE.RGBAFormat, depthBuffer: false
    });

    if (!quadScene) {
      quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      quadScene = new THREE.Scene();
      quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
      quadMesh.frustumCulled = false;
      quadScene.add(quadMesh);

      aoMat = new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false,
        uniforms: {
          tDepth: { value: null },
          uRes: { value: new THREE.Vector2(w, h) },
          uNear: { value: camera.near },
          uFar: { value: camera.far },
          uTan: { value: Math.tan(camera.fov * Math.PI / 360) },
          uAspect: { value: camera.aspect },
          uProj: { value: new THREE.Matrix4() },
          uRadius: { value: 1.2 }
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform sampler2D tDepth;
          uniform vec2 uRes;
          uniform float uNear,uFar,uTan,uAspect,uRadius;
          uniform mat4 uProj;

          float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

          float viewZ(vec2 uv){
            float d = texture2D(tDepth, uv).x;
            float z = d*2.0-1.0;
            return (2.0*uNear*uFar)/(uFar+uNear - z*(uFar-uNear));
          }
          vec3 vpos(vec2 uv){
            float vz = viewZ(uv);
            vec2 ndc = uv*2.0-1.0;
            return vec3(ndc.x*uTan*uAspect*vz, ndc.y*uTan*vz, -vz);
          }

          void main(){
            float d0 = texture2D(tDepth, vUv).x;
            if (d0 >= 0.99999) { gl_FragColor = vec4(1.0); return; }

            vec2 px = 1.0/uRes;
            vec3 P = vpos(vUv);
            vec3 p0 = vpos(vUv + vec2(px.x,0.0));
            vec3 p1 = vpos(vUv - vec2(px.x,0.0));
            vec3 p2 = vpos(vUv + vec2(0.0,px.y));
            vec3 p3 = vpos(vUv - vec2(0.0,px.y));
            vec3 N = normalize(cross(p1-p0, p3-p2));
            if (N.z < 0.0) N = -N;

            vec3 T = normalize(abs(N.x) > 0.9 ? cross(N, vec3(0.0,1.0,0.0)) : cross(N, vec3(1.0,0.0,0.0)));
            vec3 B = cross(N, T);

            float ang = hash(vUv*uRes) * 6.28318;
            float ca = cos(ang), sa = sin(ang);
            mat3 rot = mat3(ca, sa, 0.0, -sa, ca, 0.0, 0.0, 0.0, 1.0);

            float occ = 0.0;
            for (int i = 0; i < 12; i++){
              float fi = float(i);
              float r1 = hash(vUv*uRes + fi*7.13);
              float r2 = hash(vUv*uRes + fi*3.71 + 11.0);
              float a = r1 * 6.28318;
              float rad = sqrt(r2);
              vec3 k = vec3(cos(a)*rad, sin(a)*rad, sqrt(max(0.0, 1.0 - rad*rad)));
              vec3 dir = rot * k;
              vec3 S = P + (T*dir.x + B*dir.y + N*dir.z) * uRadius * (0.55 + 0.45*r2);

              vec4 clip = uProj * vec4(S,1.0);
              vec2 suv = clip.xy/clip.w * 0.5 + 0.5;
              if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) continue;
              float sz = viewZ(suv);
              float diff = -S.z - sz;
              if (diff > 0.05 && diff < uRadius*1.9) occ += 1.0;
            }
            float ao = 1.0 - occ / 12.0;
            gl_FragColor = vec4(ao, ao, ao, 1.0);
          }`
      });

      postMat = new THREE.ShaderMaterial({
        depthTest: false, depthWrite: false,
        uniforms: {
          tColor: { value: null },
          tAO: { value: null },
          uRes: { value: new THREE.Vector2(w, h) },
          uExposure: { value: 1.0 },
          uAO: { value: 0.9 },
          uTime: { value: 0 },
          uFade: { value: 0 }
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
        fragmentShader: `
          precision highp float;
          varying vec2 vUv;
          uniform sampler2D tColor, tAO;
          uniform vec2 uRes;
          uniform float uExposure, uAO, uTime, uFade;

          float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
          vec3 aces(vec3 x){
            float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
            return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);
          }
          void main(){
            vec3 c = texture2D(tColor, vUv).rgb;

            vec2 px = 1.0/uRes;
            float ao = 0.0;
            ao += texture2D(tAO, vUv).r * 0.40;
            ao += texture2D(tAO, vUv + vec2( px.x*1.5, 0.0)).r * 0.15;
            ao += texture2D(tAO, vUv + vec2(-px.x*1.5, 0.0)).r * 0.15;
            ao += texture2D(tAO, vUv + vec2(0.0,  px.y*1.5)).r * 0.15;
            ao += texture2D(tAO, vUv + vec2(0.0, -px.y*1.5)).r * 0.15;
            c *= mix(1.0, ao, uAO);

            c *= uExposure;
            c = aces(c);

            float lum = dot(c, vec3(0.2126,0.7152,0.0722));
            c = mix(c * vec3(0.93, 0.98, 1.08), c, smoothstep(0.0, 0.62, lum));
            c = mix(c, c * vec3(1.06, 1.0, 0.93), smoothstep(0.55, 1.0, lum) * 0.55);
            c = mix(vec3(lum), c, 1.05);

            float v = length(vUv - 0.5) * 1.35;
            c *= mix(1.0, 0.80, smoothstep(0.45, 1.05, v));

            c += (hash(vUv * uRes + uTime) - 0.5) * 0.014;

            c = pow(max(c, 0.0), vec3(1.0/2.2));
            gl_FragColor = vec4(c, 1.0);
          }`
      });
    }
    aoMat.uniforms.uRes.value.set(w, h);
    postMat.uniforms.uRes.value.set(w, h);
    aoMat.uniforms.uNear.value = camera.near;
    aoMat.uniforms.uFar.value = camera.far;
    aoMat.uniforms.uTan.value = Math.tan(camera.fov * Math.PI / 360);
    aoMat.uniforms.uAspect.value = camera.aspect;
  }

  /* ---------------- 初始化 ---------------- */
  function init(dom) {
    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.LinearEncoding;
    renderer.toneMapping = THREE.NoToneMapping;
    dom.appendChild(renderer.domElement);
    renderer.domElement.style.display = 'block';
    renderer.domElement.style.touchAction = 'none';

    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(FOG_C, 120, 330);

    buildSky();

    hemiLight = new THREE.HemisphereLight(0xdcecf2, 0x6a7052, 0.40);
    scene.add(hemiLight);

    sun = new THREE.DirectionalLight(0xfff0d8, 2.5);
    sun.position.set(-58, 82, 46);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    const sc = sun.shadow.camera;
    sc.left = -54; sc.right = 54; sc.top = 54; sc.bottom = -54; sc.near = 1; sc.far = 300;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.028;
    scene.add(sun);
    scene.add(sun.target);

    fillLight = new THREE.DirectionalLight(0xbfd6dd, 0.28);
    fillLight.position.set(60, 40, -55);
    scene.add(fillLight);

    rimLight = new THREE.DirectionalLight(0xfff0d8, 0.4);
    rimLight.position.set(40, 26, -50);
    scene.add(rimLight);

    initCamera(renderer.domElement);
    clock = new THREE.Clock();

    initPost();
    aoMat.uniforms.uProj.value.copy(camera.projectionMatrix);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      initPost();
    });
  }

  function clearWorld() {
    for (const m of [terrainMesh, waterMesh]) {
      if (m) { scene.remove(m); m.geometry.dispose(); }
    }
    while (extra.length) {
      const m = extra.pop();
      scene.remove(m);
      m.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
    }
    terrainMesh = waterMesh = null;
    const old = scene.getObjectByName('village-merged');
    if (old) { scene.remove(old); old.traverse(o => { if (o.isMesh) o.geometry.dispose(); }); }
  }

  let fadeIn = 0;

  function renderFrame() {
    camera.updateProjectionMatrix();
    aoMat.uniforms.uProj.value.copy(camera.projectionMatrix);
    aoMat.uniforms.uAspect.value = camera.aspect;

    renderer.setRenderTarget(rtMain);
    renderer.clear();
    renderer.render(scene, camera);

    aoMat.uniforms.tDepth.value = rtMain.depthTexture;
    quadMesh.material = aoMat;
    renderer.setRenderTarget(rtAO);
    renderer.clear();
    renderer.render(quadScene, quadCam);

    postMat.uniforms.tColor.value = rtMain.texture;
    postMat.uniforms.tAO.value = rtAO.texture;
    postMat.uniforms.uFade.value = fadeIn;
    quadMesh.material = postMat;
    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCam);
  }

  function loop(fn) {
    fadeIn = 0;
    function tick() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (waterMat) waterMat.uniforms.uTime.value += dt;
      if (postMat) postMat.uniforms.uTime.value += dt;
      fadeIn = Math.min(1, fadeIn + dt * 1.6);
      updateCamera(dt);
      fn && fn(dt);
      if (global.CINE && global.CINE.frame) global.CINE.frame(); else renderFrame();
      frameCount++;
      if (reflPending && frameCount > 3) { reflPending = false; captureReflection(); }
      requestAnimationFrame(tick);
    }
    tick();
  }

  global.RENDER = {
    init, loop, clearWorld, buildTerrain, buildWater, buildRoads, buildBanks, buildSkirt,
    buildContactShadow, setView, setMood, requestReflection,
    get scene() { return scene; }, get camera() { return camera; }, get renderer() { return renderer; },
    cam
  };
})(window);

</script>
<script>
/* ==== js/main.js ==== */
/* ============================================================
   MAIN —— 启动、UI、重生成
   ============================================================ */
(function () {
  'use strict';

  let busy = false;
  let meta = null;

  const $ = s => document.querySelector(s);
  const el = {
    stage: document.getElementById('stage'),
    name: document.getElementById('vname'),
    seed: document.getElementById('vseed'),
    stats: document.getElementById('stats'),
    rules: document.getElementById('rules'),
    regen: document.getElementById('regen'),
    loading: document.getElementById('loading'),
    loadTxt: document.getElementById('loadTxt'),
    views: document.querySelectorAll('[data-view]'),
    panel: document.getElementById('panel'),
    toggle: document.getElementById('rulesToggle'),
    hint: document.getElementById('hint')
  };

  function setLoading(on, txt) {
    el.loading.classList.toggle('on', on);
    if (txt) el.loadTxt.textContent = txt;
  }

  function randomSeed() {
    return (Math.random() * 0x7fffffff) | 0;
  }

  async function build(seed) {
    if (busy) return;
    busy = true;
    setLoading(true, '正在相地…');
    ['brand', 'hud', 'panel'].forEach(id => {
      const n = document.getElementById(id);
      if (n) n.classList.remove('show');
    });
    await new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

    try {
      const t0 = performance.now();
      meta = WORLD.generate(seed);
      RENDER.clearWorld();
      RENDER.buildSkirt(meta);
      RENDER.buildContactShadow(meta);
      RENDER.buildTerrain(meta);
      RENDER.buildRoads(meta);
      RENDER.buildBanks(meta);
      RENDER.buildWater(meta);
      meta.mood = RENDER.setMood((seed >> 7) % 4);
      await WORLD.build(meta, RENDER.scene, (name, p) => {
        el.loadTxt.textContent = name + '…';
      });
      RENDER.requestReflection();
      updateUI(meta);
      console.log('[village] seed', seed, 'built in', Math.round(performance.now() - t0), 'ms');
    } catch (e) {
      console.error(e);
      el.loadTxt.textContent = '生成出错：' + e.message;
      setTimeout(() => setLoading(false), 2200);
      busy = false;
      return;
    }

    setLoading(false);
    requestAnimationFrame(() => {
      ['brand', 'hud', 'panel'].forEach(id => {
        const n = document.getElementById(id);
        if (n) n.classList.add('show');
      });
    });
    busy = false;
  }

  function updateUI(m) {
    el.name.textContent = m.name;
    el.seed.textContent = '第 ' + m.seed + ' 号地 · ' + (m.mood || '');
    if (history.replaceState) history.replaceState(null, '', '#' + m.seed);

    const houses = m.houses.length;
    const tall = m.houses.filter(h => h.type === 'tall').length;
    const shops = m.houses.filter(h => h.type === 'shop').length;
    const fields = m.fields.length;
    const trees = m.trees.filter(t => t.type !== 'reed' && t.type !== 'shrub').length;
    const bridges = m.bridges.length;
    const gates = m.gates.filter(g => g.planted).length;

    el.stats.innerHTML = `
      <div class="stat"><b>${houses}</b><span>民居</span></div>
      <div class="stat"><b>${fields}</b><span>田亩</span></div>
      <div class="stat"><b>${bridges}</b><span>石桥</span></div>
      <div class="stat"><b>${gates}</b><span>牌坊</span></div>
      <div class="stat"><b>${trees}</b><span>林木</span></div>
      <div class="stat"><b>${m.pagoda ? m.pagoda.floors : 0}</b><span>塔层</span></div>
      <div class="stat"><b class="moodb">${m.mood || '—'}</b><span>天光</span></div>`;

    const list = m.validate();
    el.rules.innerHTML = list.map(r => `
      <li class="${r.ok ? 'ok' : 'bad'}">
        <i>${r.ok ? '✓' : '!'}</i>
        <em>${r.name}</em>
        <u>${r.detail}</u>
      </li>`).join('');
  }

  function boot() {
    const q = new URLSearchParams(location.search);
    if (q.get('ui') === '0') document.body.classList.add('noui');

    RENDER.init(el.stage);
    RENDER.setView(q.get('view') || 'wide');

    let seed = parseInt((location.hash || '').replace('#', ''), 10);
    if (!seed || isNaN(seed)) seed = parseInt(q.get('seed'), 10) || randomSeed();
    build(seed);

    el.regen.addEventListener('click', () => {
      if (busy) return;
      el.regen.classList.add('spin');
      setTimeout(() => el.regen.classList.remove('spin'), 500);
      build(randomSeed());
    });

    el.views.forEach(b => b.addEventListener('click', () => {
      el.views.forEach(x => x.classList.remove('act'));
      b.classList.add('act');
      RENDER.setView(b.dataset.view);
    }));

    el.toggle.addEventListener('click', () => {
      el.panel.classList.toggle('fold');
    });

    // 键盘：空格换一座
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); el.regen.click(); }
      if (e.key === '1') el.views[0] && el.views[0].click();
      if (e.key === '2') el.views[1] && el.views[1].click();
      if (e.key === '3') el.views[2] && el.views[2].click();
      if (e.key === '4') el.views[3] && el.views[3].click();
    });

    setTimeout(() => el.hint.classList.add('fade'), 9000);

    RENDER.loop();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>

<script>
/* ==== js/cinema.js ==== */
/* ==== cinema overlay: film-grade rendering pass ==== */
/* 由 build.mjs 追加为第 15 段脚本，接管 RENDER 的逐帧渲染。 */
(function (global) {
  'use strict';
  const THREE = global.THREE;
  const R = global.RENDER;
  if (!THREE || !R) return;

  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
  const QS = new URLSearchParams(location.search);
  const CINE_ON = QS.get('cine') !== '0';
  const STILL = QS.get('still') === '1';
  const DBG = parseFloat(QS.get('dbg') || '0') || 0;
  if (!CINE_ON) return;

  const Q = {
    ss: isMobile ? 0.9 : 1.12,       // 超采样倍数
    ao: true,
    bloom: true,
    grain: true,
    ca: true,
    fogBank: !isMobile && QS.get('fogbank') !== '0',
    dust: !isMobile && QS.get('dust') !== '0'
  };
  if (QS.get('q') === 'low') { Q.ss = 1.0; Q.bloom = false; Q.grain = false; Q.ca = false; Q.fogBank = false; Q.dust = false; }
  if (QS.get('q') === 'high') { Q.ss = 1.5; }

  // 现场调参：?exp=1.1&fog=0.0016&bloom=0.5&ao=0.8&sat=1.06&vig=0.86&grain=0.03&cloud=0.7
  const TUNE = {
    exp: 1.28,
    fog: 0.00040,
    bloom: 0.32,
    ao: 0.64,
    sat: 1.26,
    vig: 0.90,
    grain: 0.024,
    cloud: 0.75,
    env: 0.56,
    letterbox: QS.get('lb') !== '0',
    sun: (function () {
      const s = QS.get('sun');
      if (!s) return null;
      const a = s.split(',').map(parseFloat);
      return (a.length === 3 && a.every(function (v) { return !isNaN(v); })) ? a : null;
    })(),
    sunonly: QS.get('sunonly') === '1',
    mood: (function () {
      const s = QS.get('mood');
      // 默认用夕照(2)：低角度暖光最能立住形体；?mood=0 晨雾 / 1 晴昼 / 3 烟雨
      if (s === null) return 2;
      if (s === '') return null;
      const n = parseInt(s, 10);
      return isNaN(n) ? null : n;
    })()
  };
  ['exp', 'fog', 'bloom', 'ao', 'sat', 'vig', 'grain', 'cloud', 'env'].forEach(function (k) {
    const v = parseFloat(QS.get(k));
    if (!isNaN(v)) TUNE[k] = v;
  });

  let renderer, scene, camera, sun = null;
  let ready = false;
  let W = 1, H = 1, BW = 1, BH = 1;      // buffer size (CSS * dpr)
  let SW = 1, SH = 1;                     // supersampled scene size
  let rtScene = null, rtAO = null, rtAO2 = null, rtBloomA = null, rtBloomB = null;
  let rtRefl = null, mirrorCam = null, waterMatRef = null, waterY = -0.30;
  let quadScene = null, quadCam = null, quadMesh = null;
  let aoMat = null, brightMat = null, blurMat = null, compMat = null;
  let stage = null;
  const clock = new THREE.Clock();
  let t = 0, frameNo = 0;
  let perfAcc = 0, perfN = 0, lastFps = 0;
  let fadeIn = 0, t0 = (typeof performance !== 'undefined' ? performance.now() : 0);
  let adaptAcc = 0, adaptN = 0, adaptChecked = 0;
  let sunDirView = new THREE.Vector3();
  const V2 = new THREE.Vector2();

  const sky = {
    mesh: null, mat: null,
    uTop: new THREE.Color(0x9fbfc9),
    uBot: new THREE.Color(0xe8eee6),
    uSun: new THREE.Color(0xffe9c2),
    uFog: new THREE.Color(0xd3dfdc),
    uSunDir: new THREE.Vector3(-0.5, 0.7, 0.4).normalize()
  };

  /* ---------------------------------------------------------------- utils */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function mkRT(w, h, opts) {
    const o = Object.assign({
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: THREE.HalfFloatType,
      depthBuffer: false,
      stencilBuffer: false
    }, opts || {});
    const rt = new THREE.WebGLRenderTarget(Math.max(1, w | 0), Math.max(1, h | 0), o);
    rt.texture.generateMipmaps = false;
    return rt;
  }

  function disposeRT(rt) {
    if (!rt) return;
    if (rt.depthTexture) rt.depthTexture.dispose();
    rt.dispose();
  }

  const QUAD_VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

  /* ------------------------------------------------------------- sky dome */
  const SKY_FRAG = [
    'uniform vec3 uTop, uBot, uSun, uFog;',
    'uniform vec3 uSunDir;',
    'uniform float uTime, uCloud;',
    'varying vec2 vUv;',
    'varying vec3 vDir;',
    'float hash(vec2 p){ p = fract(p * vec2(0.1031, 0.1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }',
    'float noise(vec2 p){',
    '  vec2 i = floor(p), f = fract(p);',
    '  vec2 u = f*f*(3.0-2.0*f);',
    '  return mix(mix(hash(i), hash(i+vec2(1.0,0.0)), u.x), mix(hash(i+vec2(0.0,1.0)), hash(i+vec2(1.0,1.0)), u.x), u.y);',
    '}',
    'float fbm(vec2 p){',
    '  float v = 0.0, a = 0.5;',
    '  for (int i = 0; i < 5; i++){ v += a * noise(p); p *= 2.03; a *= 0.5; }',
    '  return v;',
    '}',
    'void main(){',
    '  vec3 d = normalize(vDir);',
    '  float h = clamp(d.y * 1.15 + 0.06, 0.0, 1.0);',
    '  // 天顶更沉、地平线更暖，避免整片天空糊成同一块灰绿',
    '  vec3 col = mix(uBot * 0.80, uTop, pow(h, 0.52));',
    '  float hz = exp(-abs(d.y) * 9.0);',
    '  col = mix(col, uFog * 1.10 + vec3(0.035, 0.020, 0.004), hz * 0.55);',
    '  // 太阳光斑',
    '  float sd = max(dot(d, uSunDir), 0.0);',
    '  col += uSun * pow(sd, 8.0) * 0.42;',
    '  col += uSun * pow(sd, 220.0) * 2.2;',
    '  // 云层：在天顶方向做 fbm 域扭曲',
    '  if (d.y > 0.02) {',
    '    vec2 cp = d.xz / max(d.y + 0.18, 0.06);',
    '    cp *= 0.55;',
    '    cp.x += uTime * 0.006;',
    '    float n = fbm(cp * 1.7 + vec2(uTime * 0.004, 0.0));',
    '    float n2 = fbm(cp * 3.3 - vec2(uTime * 0.003, 0.0));',
    '    float c = smoothstep(0.42, 0.80, n * 0.72 + n2 * 0.36);',
    '    c *= smoothstep(0.02, 0.30, d.y);',
    '    vec3 cloudCol = mix(uFog * 1.12, uSun * 1.05 + 0.20, pow(sd, 3.0));',
    '    col = mix(col, cloudCol, c * uCloud * 0.95);',
    '  }',
    '  // 地平线处加一层雾',
    '  float haze = smoothstep(0.16, -0.06, d.y);',
    '  col = mix(col, uFog, haze * 0.52);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  const SKY_FRAG_LO = [
    'uniform vec3 uTop, uBot, uSun, uFog;',
    'uniform vec3 uSunDir;',
    'uniform float uTime, uCloud;',
    'varying vec2 vUv;',
    'varying vec3 vDir;',
    'void main(){',
    '  vec3 d = normalize(vDir);',
    '  float h = clamp(d.y * 1.15 + 0.06, 0.0, 1.0);',
    '  vec3 col = mix(uBot, uTop, pow(h, 0.72));',
    '  float sd = max(dot(d, uSunDir), 0.0);',
    '  col += uSun * pow(sd, 8.0) * 0.42 + uSun * pow(sd, 220.0) * 2.0;',
    '  col = mix(col, uFog, smoothstep(0.16, -0.06, d.y) * 0.72);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');

  function buildSky() {
    if (!scene) return;
    let found = null;
    scene.traverse(function (o) {
      if (o.isMesh && o.geometry && o.geometry.type === 'SphereGeometry' && !found) {
        const p = o.geometry.parameters || {};
        if (p.radius >= 300) found = o;
      }
    });
    if (!found) return;
    const src = found.material;
    sky.orig = src;
    if (src && src.uniforms) {
      if (src.uniforms.top) sky.uTop.copy(src.uniforms.top.value);
      if (src.uniforms.bot) sky.uBot.copy(src.uniforms.bot.value);
      // 注意：原天光材质的 sun 是「方向向量」，不是颜色
      if (src.uniforms.sun && src.uniforms.sun.value && src.uniforms.sun.value.isVector3) {
        sky.uSunDir.copy(src.uniforms.sun.value);
      }
    }
    if (sun) sky.uSun.copy(sun.color).convertSRGBToLinear();
    if (scene.fog && scene.fog.color) sky.uFog.copy(scene.fog.color).convertSRGBToLinear();
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTop: { value: sky.uTop },
        uBot: { value: sky.uBot },
        uSun: { value: sky.uSun },
        uFog: { value: sky.uFog },
        uSunDir: { value: sky.uSunDir },
        uTime: { value: 0 },
        uCloud: { value: TUNE.cloud }
      },
      vertexShader: [
        'varying vec2 vUv;',
        'varying vec3 vDir;',
        'void main(){',
        '  vUv = uv;',
        '  vDir = (modelMatrix * vec4(position, 1.0)).xyz - cameraPosition;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: Q.ss > 1.0 ? SKY_FRAG : SKY_FRAG_LO
    });
    sky.mesh = found;
    sky.mat = mat;
    found.material = mat;
    // 天穹扩大，让远水面一直走到雾尽的真正地平线
    try {
      found.scale.setScalar(7.0);
      found.frustumCulled = false;
    } catch (e) { }
  }

  function syncSky() {
    if (!sky.mat) return;
    const u = sky.mat.uniforms;
    // 从 RENDER 的天光 uniform 里同步（setMood 会更新原材质，这里做兜底）
    const orig = sky.orig;
    if (orig && orig.uniforms) {
      if (orig.uniforms.top) u.uTop.value.copy(orig.uniforms.top.value);
      if (orig.uniforms.bot) u.uBot.value.copy(orig.uniforms.bot.value);
      // 原材质 sun 是方向向量（Vector3），不是颜色
      if (orig.uniforms.sun && orig.uniforms.sun.value && orig.uniforms.sun.value.isVector3) {
        sky.uSunDir.copy(orig.uniforms.sun.value);
      }
    }
    if (sun) {
      if (sun.position.lengthSq() > 1e-6) sky.uSunDir.copy(sun.position).normalize();
      sky.uSun.copy(sun.color).convertSRGBToLinear();
    }
    if (scene && scene.fog && scene.fog.color) sky.uFog.copy(scene.fog.color).convertSRGBToLinear();
    u.uTime.value = t;
  }

  /* -------------------------------------------------------------- lights */
  function fixLights() {
    if (!scene) return;
    const sharers = [];
    scene.traverse(function (o) { if (o.isDirectionalLight && o.castShadow) sharers.push(o); });
    sun = sharers[0] || null;
    if (!sun) return;

    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const sc = sun.shadow.camera;
    sc.left = -240; sc.right = 240; sc.top = 240; sc.bottom = -240;
    sc.near = 1; sc.far = 900;
    sc.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.11;
    if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    // target 必须在场景里，否则光线朝向可能不更新
    if (sun.target && sun.target.parent !== scene) scene.add(sun.target);
    sun.target.position.set(0, 2, 0);
    sun.target.updateMatrixWorld();

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.shadowMap.needsUpdate = true;
    renderer.shadowMap.autoUpdate = true;

    // 让所有网格参与投射/接收，并强制重编译（原场景里投影完全没生效）
    let n = 0;
    scene.traverse(function (o) {
      if (!o.isMesh) return;
      const m = o.material;
      const isShader = m && m.isShaderMaterial;
      if (o.material && o.material.transparent && o.material.opacity < 0.9) { o.castShadow = false; return; }
      if (isShader) return;
      o.castShadow = true;
      o.receiveShadow = true;
      if (Array.isArray(m)) m.forEach(function (mm) { if (!mm.isShaderMaterial) { mm.needsUpdate = true; n++; } });
      else if (m && !m.isShaderMaterial) { m.needsUpdate = true; n++; }
    });

    // 合并网格是唯一的村庄载体，显式兜底一次
    const merged = scene.getObjectByName('village-merged');
    if (merged) {
      merged.castShadow = true;
      merged.receiveShadow = true;
      const mm = Array.isArray(merged.material) ? merged.material : [merged.material];
      mm.forEach(function (x) { if (x) x.needsUpdate = true; });
      n += 1000;
    }

    // ?sunonly=1：把环境/补光压到极低，用于肉眼确认太阳投影是否真的在跑
    if (TUNE.sunonly) {
      scene.traverse(function (o) {
        if (o.isHemisphereLight) o.intensity = 0.04;
        else if (o.isDirectionalLight && o !== sun) o.intensity = 0.02;
      });
      sun.intensity = 3.2;
    }

    // ?boxprobe=1：在场景里放一块全新材质的地板 + 立方体，检验"接收方"是否真的吃阴影
    if (QS.get('boxprobe') === '1') {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(90, 90),
        new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: 0.95, metalness: 0.0 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.set(0, 14, 0);
      floor.receiveShadow = true;
      scene.add(floor);
      const bx = new THREE.Mesh(
        new THREE.BoxGeometry(10, 10, 10),
        new THREE.MeshStandardMaterial({ color: 0xff8a2b, roughness: 0.7 })
      );
      bx.position.set(0, 22, 0);
      bx.castShadow = true;
      scene.add(bx);
      renderer.shadowMap.needsUpdate = true;
    }

    // ?shadowtest=1：新建一盏干净方向光（大视锥、强制重建阴影图），二分「灯坏」还是「材质坏」
    if (QS.get('shadowtest') === '1') {
      scene.traverse(function (o) { if (o.isLight) o.intensity = o.isHemisphereLight ? 0.06 : 0.0; });
      const key = new THREE.DirectionalLight(0xfff2dc, 3.0);
      key.position.set(-70, 120, 60);
      key.target.position.set(0, 0, 0);
      scene.add(key); scene.add(key.target);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      const kc = key.shadow.camera;
      kc.left = -240; kc.right = 240; kc.top = 240; kc.bottom = -240;
      kc.near = 1; kc.far = 700;
      kc.updateProjectionMatrix();
      key.shadow.bias = -0.0006;
      key.shadow.normalBias = 0.06;
      renderer.shadowMap.needsUpdate = true;
    }
    applySunPos();
    return n;
  }

  /* 光照配比：IBL 太强会把太阳投影完全冲淡（这是"看不见阴影"的真正原因） */
  function applyLightMix() {
    if (!scene) return;
    scene.traverse(function (o) {
      if (o.isHemisphereLight) {
        if (o.__base === undefined) o.__base = o.intensity;
        o.intensity = o.__base * (TUNE.sunonly ? 0.10 : 0.58);
      } else if (o.isDirectionalLight) {
        if (o.__base === undefined) o.__base = o.intensity;
        o.intensity = o.__base * (o === sun ? 1.30 : 0.50);
      }
    });
    scene.traverse(function (o) {
      if (!o.isMesh) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(function (m) {
        if (!m || !m.isMeshStandardMaterial) return;
        // 树叶/草是 alphaTest 双面片，压暗 IBL 会变成死黑块，保持通透
        const leafy = m.alphaTest > 0 || m.transparent || m.side === THREE.DoubleSide;
        m.envMapIntensity = leafy ? 1.05 : TUNE.env;
        if (m.needsUpdate !== true) m.needsUpdate = true;
      });
    });
  }

  function hookMood() {
    if (hookMood.done || typeof R.setMood !== 'function') return;
    hookMood.done = true;
    const orig = R.setMood;
    R.setMood = function (i) {
      const r = orig.apply(this, arguments);
      try {
        scene.traverse(function (o) { if (o.isLight) o.__base = undefined; });
        applyLightMix();
      } catch (e) { }
      return r;
    };
  }

  /* --------------------------------------------------------------- setup */
  function init() {
    renderer = R.renderer;
    scene = R.scene;
    camera = R.camera;
    stage = document.getElementById('stage') || document.body;

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    quadScene = new THREE.Scene();
    quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
    quadMesh.frustumCulled = false;
    quadScene.add(quadMesh);

    buildSky();

    aoMat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: {
        tDepth: { value: null },
        uInvProj: { value: new THREE.Matrix4() },
        uProj: { value: new THREE.Matrix4() },
        uRes: { value: new THREE.Vector2(1, 1) },
        uTanHalf: { value: Math.tan(camera.fov * Math.PI / 360) },
        uAspect: { value: camera.aspect },
        uNear: { value: camera.near },
        uFar: { value: camera.far },
        uRadius: { value: 1.35 },
        uStrength: { value: 1.0 },
        uTime: { value: 0 },
        uNoise: { value: makeNoiseTex() }
      },
      vertexShader: QUAD_VERT,
      fragmentShader: AO_FRAG
    });

    brightMat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: {
        tColor: { value: null },
        uThreshold: { value: 1.32 },
        uKnee: { value: 0.42 }
      },
      vertexShader: QUAD_VERT,
      fragmentShader: [
        'uniform sampler2D tColor; uniform float uThreshold, uKnee; varying vec2 vUv;',
        'void main(){',
        '  vec3 c = texture2D(tColor, vUv).rgb;',
        '  float l = max(c.r, max(c.g, c.b));',
        '  float soft = clamp((l - uThreshold + uKnee) / (2.0 * uKnee), 0.0, 1.0);',
        '  soft = soft * soft * uKnee;',
        '  float w = max(l - uThreshold, soft) / max(l, 1e-4);',
        '  gl_FragColor = vec4(c * w, 1.0);',
        '}'
      ].join('\n')
    });

    blurMat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: {
        tColor: { value: null },
        uDir: { value: new THREE.Vector2(1, 0) },
        uTexel: { value: new THREE.Vector2(1, 1) }
      },
      vertexShader: QUAD_VERT,
      fragmentShader: [
        'uniform sampler2D tColor; uniform vec2 uDir, uTexel; varying vec2 vUv;',
        'void main(){',
        '  vec2 o = uDir * uTexel;',
        '  vec3 c = texture2D(tColor, vUv).rgb * 0.227027;',
        '  c += texture2D(tColor, vUv + o * 1.3846).rgb * 0.316216;',
        '  c += texture2D(tColor, vUv - o * 1.3846).rgb * 0.316216;',
        '  c += texture2D(tColor, vUv + o * 3.2308).rgb * 0.070270;',
        '  c += texture2D(tColor, vUv - o * 3.2308).rgb * 0.070270;',
        '  gl_FragColor = vec4(c, 1.0);',
        '}'
      ].join('\n')
    });

    compMat = new THREE.ShaderMaterial({
      depthTest: false, depthWrite: false,
      uniforms: {
        tColor: { value: null },
        tAO: { value: null },
        tBloom: { value: null },
        tDepth: { value: null },
        uRes: { value: new THREE.Vector2(1, 1) },
        uInvProj: { value: new THREE.Matrix4() },
        uCamWorld: { value: new THREE.Matrix4() },
        uCamPos: { value: new THREE.Vector3() },
        uSunDir: { value: new THREE.Vector3(-0.5, 0.7, 0.4) },
        uSunColor: { value: new THREE.Color(0xffe9c2) },
        uFogColor: { value: new THREE.Color(0xd3dfdc) },
        uExposure: { value: TUNE.exp },
        uAO: { value: TUNE.ao },
        uBloom: { value: TUNE.bloom },
        uTime: { value: 0 },
        uFade: { value: 0 },
        uGrain: { value: TUNE.grain },
        uVignette: { value: TUNE.vig },
        uCA: { value: 0.0016 },
        uFogDensity: { value: TUNE.fog },
        uFogHeight: { value: 0.10 },
        uSat: { value: TUNE.sat },
        tShadow: { value: null },
        tRefl: { value: null },
        uShadowOn: { value: 0 },
        uDbg: { value: DBG }
      },
      vertexShader: QUAD_VERT,
      fragmentShader: COMP_FRAG
    });

    resize();
    window.addEventListener('resize', resize);
    ready = true;
    try { fixLights(); } catch (e) { }
    try { applyLightMix(); } catch (e) { }
    hookMood();

    // 钩住天光切换，让自建天穹跟随 mood
    if (R.setMood) {
      const origMood = R.setMood;
      R.setMood = function (i) {
        origMood.apply(this, arguments);
        try { onMood(i); } catch (e) { }
      };
    }

    // ?mood=N 指定天光（0 晨雾 / 1 晴昼 / 2 夕照 / 3 烟雨）
    if (TUNE.mood !== null && R.setMood) {
      try { R.setMood(TUNE.mood); } catch (e) { }
    }
  }

  function makeNoiseTex() {
    const n = 8, data = new Uint8Array(n * n * 2);
    for (let i = 0; i < n * n; i++) {
      const a = Math.random() * Math.PI * 2;
      data[i * 2] = (Math.cos(a) * 0.5 + 0.5) * 255;
      data[i * 2 + 1] = (Math.sin(a) * 0.5 + 0.5) * 255;
    }
    const tex = new THREE.DataTexture(data, n, n, THREE.RGFormat, THREE.UnsignedByteType);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.needsUpdate = true;
    return tex;
  }

  function resize() {
    if (!renderer) return;
    renderer.getDrawingBufferSize(V2);
    BW = Math.max(2, V2.x | 0);
    BH = Math.max(2, V2.y | 0);
    W = BW; H = BH;
    SW = Math.max(2, Math.round(BW * Q.ss));
    SH = Math.max(2, Math.round(BH * Q.ss));

    disposeRT(rtScene); disposeRT(rtAO); disposeRT(rtAO2); disposeRT(rtBloomA); disposeRT(rtBloomB);
    rtScene = mkRT(SW, SH, { depthBuffer: true });
    const dt = new THREE.DepthTexture(SW, SH);
    dt.type = THREE.UnsignedIntType;
    dt.minFilter = THREE.NearestFilter;
    dt.magFilter = THREE.NearestFilter;
    rtScene.depthTexture = dt;

    rtAO = mkRT(Math.max(2, SW >> 1), Math.max(2, SH >> 1), { type: THREE.UnsignedByteType });
    rtAO2 = mkRT(Math.max(2, SW >> 1), Math.max(2, SH >> 1), { type: THREE.UnsignedByteType });
    rtBloomA = mkRT(Math.max(2, SW >> 2), Math.max(2, SH >> 2));
    rtBloomB = mkRT(Math.max(2, SW >> 2), Math.max(2, SH >> 2));

    // 倒影缓冲：半分辨率足够（水面本来是软的）
    disposeRT(rtRefl);
    rtRefl = mkRT(Math.max(2, Math.round(BW * 0.52)), Math.max(2, Math.round(BH * 0.52)), { depthBuffer: true });
    if (waterMatRef && waterMatRef.uniforms.uRefl) {
      waterMatRef.uniforms.uRefl.value = rtRefl.texture;
      waterMatRef.uniforms.uHasRefl.value = 1;
      waterMatRef.uniforms.uRes.value.set(BW, BH);
    }

    aoMat.uniforms.uRes.value.set(SW, SH);
    compMat.uniforms.uRes.value.set(BW, BH);
  }

  function onMood(i) {
    syncSky();
    applySunPos();
    // setMood 会把各灯强度写回原始值，__base 已失效；先清再重算，
    // 否则天光一换环境光就弹回 0.9，阴影又被冲淡（原先就是这里把画面拉平的）
    if (scene) {
      scene.traverse(function (o) {
        if (o.isHemisphereLight || o.isDirectionalLight) o.__base = undefined;
      });
    }
    applyLightMix();
  }

  /* ---------------------------------------------------------- camera mood */
  function applySunPos() {
    if (!sun || !TUNE.sun) return;
    sun.position.set(TUNE.sun[0], TUNE.sun[1], TUNE.sun[2]);
    sun.updateMatrixWorld();
  }

  const handheld = { x: 0, y: 0, tx: 0, ty: 0, next: 0 };
  function updateMotion(dt) {
    const cam = R.cam;
    if (!cam) return;
    // 缓慢环绕
    if (cam.auto) cam._theta = (cam._theta + dt * 0.013);
    // 入场缓推：前 9 秒从 1.28 倍推近到 1.0
    const intro = Math.min(1, t / 9);
    const ease = 1 - Math.pow(1 - intro, 3);
    cam._introScale = 1.0 + 0.30 * (1 - ease);
    // 呼吸式手持
    handheld.next -= dt;
    if (handheld.next <= 0) {
      handheld.next = 2.2 + Math.random() * 2.4;
      handheld.tx = (Math.random() - 0.5) * 0.9;
      handheld.ty = (Math.random() - 0.5) * 0.55;
    }
    handheld.x += (handheld.tx - handheld.x) * Math.min(1, dt * 0.55);
    handheld.y += (handheld.ty - handheld.y) * Math.min(1, dt * 0.55);
  }

  function applyMotion() {
    const cam = R.cam;
    if (!cam) return;
    const sway = Math.sin(t * 0.37) * 0.6 + handheld.x;
    const bob = Math.cos(t * 0.29) * 0.45 + handheld.y;
    const dist = cam.dist * (cam._introScale || 1);
    const theta = cam.theta + sway * 0.0014;
    const phi = clamp(cam.phi + bob * 0.0014, cam.minPhi, cam.maxPhi);
    const sp = Math.sin(phi), cp = Math.cos(phi);
    camera.position.set(
      cam.target.x + dist * sp * Math.sin(theta),
      cam.target.y + dist * cp,
      cam.target.z + dist * sp * Math.cos(theta)
    );
    if (camera.position.y < cam.target.y + 1.2) camera.position.y = cam.target.y + 1.2;
    camera.lookAt(cam.target.x, cam.target.y + bob * 0.05, cam.target.z);
    camera.updateMatrixWorld();
  }

  /* ------------------------------------------------------------- decor */
  let deco = null, decorated = false;

  function spriteTex(kind) {
    const s = 128, c = document.createElement('canvas');
    c.width = c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    if (kind === 'dust') {
      grd.addColorStop(0.0, 'rgba(255,248,228,1)');
      grd.addColorStop(0.35, 'rgba(255,246,220,0.55)');
      grd.addColorStop(1.0, 'rgba(255,244,214,0)');
    } else if (kind === 'mist') {
      grd.addColorStop(0.0, 'rgba(236,242,240,0.85)');
      grd.addColorStop(0.45, 'rgba(228,236,236,0.42)');
      grd.addColorStop(1.0, 'rgba(222,232,232,0)');
    } else {
      grd.addColorStop(0.0, 'rgba(30,34,36,1)');
      grd.addColorStop(0.6, 'rgba(30,34,36,0.75)');
      grd.addColorStop(1.0, 'rgba(30,34,36,0)');
    }
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function birdTex() {
    const w = 128, h = 64, c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.clearRect(0, 0, w, h);
    g.strokeStyle = 'rgba(26,30,32,0.95)';
    g.lineWidth = 6; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath();
    g.moveTo(12, 40); g.quadraticCurveTo(40, 12, 64, 34);
    g.quadraticCurveTo(88, 12, 116, 40);
    g.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  let hudEl = null;
  function makeHud() {
    if (QS.get('hud') !== '1') return null;
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;right:10px;top:10px;z-index:99;padding:4px 8px;border-radius:4px;background:rgba(0,0,0,.55);color:#9fe;font:12px/1.4 ui-monospace,Consolas,monospace;pointer-events:none;';
    d.textContent = '-';
    document.body.appendChild(d);
    return d;
  }

  function makeLetterbox() {
    const m = 2.39;
    const mk = function (edge) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:0;right:0;height:0;background:#07090a;z-index:2;pointer-events:none;';
      d.style[edge] = '0';
      document.body.appendChild(d);
      return d;
    };
    const top = mk('top'), bot = mk('bottom');
    const fit = function () {
      const h = Math.max(0, (window.innerHeight - window.innerWidth / m) / 2);
      top.style.height = h.toFixed(1) + 'px';
      bot.style.height = h.toFixed(1) + 'px';
    };
    fit();
    window.addEventListener('resize', fit);
    return { top: top, bot: bot, fit: fit };
  }

  function tuneWater() {
    if (!scene) return;
    scene.traverse(function (o) {
      const m = o.material;
      if (m && m.uniforms && m.uniforms.uDeep && m.uniforms.uShallow) {
        try {
          m.uniforms.uDeep.value.setHex(0x1d3036).convertSRGBToLinear();
          m.uniforms.uShallow.value.setHex(0x4d6c6a).convertSRGBToLinear();
          if (m.uniforms.uHasCube) m.uniforms.uHasCube.value = (m.uniforms.uCube && m.uniforms.uCube.value) ? 1.0 : 0.0;
        } catch (e) { }
        deco.water = o;
      }
    });
  }

  function decorate() {    if (decorated || !scene) return;
    decorated = true;
    const grp = new THREE.Group();
    grp.name = 'cine-deco';
    scene.add(grp);
    deco = { group: grp, dust: null, mist: [], birds: [] };

    try { hudEl = hudEl || makeHud(); } catch (e) { }
    if (TUNE.letterbox) { try { deco.lb = makeLetterbox(); } catch (e) { } }

    // 远景：把村庄坐进一片开阔水面，一路化进雾里（不再是黑虚空）
    try {
      const fc = (scene.fog && scene.fog.color) ? scene.fog.color : new THREE.Color(0xcfd8ce);
      const gs = 512, gc = document.createElement('canvas');
      gc.width = gc.height = gs;
      const gg = gc.getContext('2d');
      const deep = new THREE.Color(0x24393c);
      const rg = gg.createRadialGradient(gs / 2, gs / 2, gs * 0.02, gs / 2, gs / 2, gs * 0.5);
      const near = new THREE.Color().copy(deep).lerp(fc, 0.10);
      const mid = new THREE.Color().copy(deep).lerp(fc, 0.40);
      rg.addColorStop(0.0, '#' + near.getHexString());
      rg.addColorStop(0.075, '#' + mid.getHexString());
      rg.addColorStop(0.175, '#' + new THREE.Color().copy(deep).lerp(fc, 0.74).getHexString());
      rg.addColorStop(0.30, '#' + fc.getHexString());
      gg.fillStyle = rg; gg.fillRect(0, 0, gs, gs);
      // 水面细纹：横向短笔触，远看是起伏而不是噪点
      for (let i = 0; i < 1100; i++) {
        const a = Math.random() * 6.283, r = Math.pow(Math.random(), 0.62) * gs * 0.15;
        const x = gs / 2 + Math.cos(a) * r, y = gs / 2 + Math.sin(a) * r;
        const t2 = 1 - r / (gs * 0.16);
        const len = 3 + Math.random() * 20 * t2;
        gg.strokeStyle = 'rgba(' + (150 + Math.random() * 60 | 0) + ',' + (176 + Math.random() * 50 | 0) + ',' + (176 + Math.random() * 46 | 0) + ',' + (0.055 + 0.20 * t2).toFixed(3) + ')';
        gg.lineWidth = 0.8 + Math.random() * 1.6;
        gg.beginPath(); gg.moveTo(x - len, y); gg.lineTo(x + len, y + (Math.random() - 0.5) * 1.4); gg.stroke();
      }
      // 大尺度风纹：几十块柔和明暗斑，远看成片的水色起伏
      for (let i = 0; i < 70; i++) {
        const a = Math.random() * 6.283, r = Math.pow(Math.random(), 0.6) * gs * 0.20;
        const x = gs / 2 + Math.cos(a) * r, y = gs / 2 + Math.sin(a) * r;
        const rad = 26 + Math.random() * 96;
        const g2 = gg.createRadialGradient(x, y, 0, x, y, rad);
        const up = Math.random() > 0.42;
        const al = (0.018 + Math.random() * 0.055).toFixed(3);
        const col = up ? '214,228,224' : '28,48,50';
        g2.addColorStop(0, 'rgba(' + col + ',' + al + ')');
        g2.addColorStop(1, 'rgba(' + col + ',0)');
        gg.fillStyle = g2;
        gg.beginPath(); gg.arc(x, y, rad, 0, 6.283); gg.fill();
      }
      const gtex = new THREE.CanvasTexture(gc);
      gtex.encoding = THREE.sRGBEncoding;
      const gmat = new THREE.MeshBasicMaterial({ map: gtex, fog: true });
      const gp = new THREE.Mesh(new THREE.CircleGeometry(1600, 72), gmat);
      gp.rotation.x = -Math.PI / 2;
      gp.position.y = -0.62;
      gp.renderOrder = -1;
      gp.name = 'cine-ground';
      grp.add(gp);
      deco.ground = gp;

      // 远山：几道压在雾里的低丘，给地平线一点江南层次
      const hillMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x2a403f).lerp(fc, 0.34), fog: true });
      for (let b = 0; b < 3; b++) {
        const rad = 520 + b * 92;
        const cnt = 9 + b * 3;
        for (let i = 0; i < cnt; i++) {
          const a = (i / cnt) * 6.283 + (b * 0.7) + Math.random() * 0.5;
          const rr = rad * (0.86 + Math.random() * 0.28);
          const hh = 16 + Math.random() * 30 + b * 8;
          const ww = 60 + Math.random() * 90;
          const cm = new THREE.Mesh(new THREE.ConeGeometry(ww, hh, 5, 1), hillMat);
          cm.position.set(Math.cos(a) * rr, hh * 0.34 - 1.0, Math.sin(a) * rr);
          cm.scale.z = 0.5 + Math.random() * 0.4;
          cm.rotation.y = Math.random() * 3.14;
          grp.add(cm);
        }
      }
      tuneWater();
    } catch (e) { }

    // 空气中的浮尘（逆光里的小亮点）
    if (Q.dust) {
      const N = Q.ss > 1.0 ? 420 : 220, pos = new Float32Array(N * 3);
      for (let i = 0; i < N; i++) {
        pos[i * 3] = (Math.random() - 0.5) * 420;
        pos[i * 3 + 1] = 2 + Math.random() * 90;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 420;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        size: 1.15, map: spriteTex('dust'), transparent: true, opacity: 0.42,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
        color: 0xfff4d8
      });
      const pts = new THREE.Points(geo, mat);
      pts.frustumCulled = false;
      grp.add(pts);
      deco.dust = pts;
    }

    // 水岸薄雾：几片贴地大平面
    if (Q.fogBank) {
      const tex = spriteTex('mist');
      for (let i = 0; i < 5; i++) {
        const s = 190 + Math.random() * 90;
        const mat = new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0.022 + Math.random() * 0.018,
          depthWrite: false, side: THREE.DoubleSide, color: 0xdfe9e6
        });
        const pl = new THREE.Mesh(new THREE.PlaneGeometry(s, s), mat);
        pl.rotation.x = -Math.PI / 2;
        pl.position.set((Math.random() - 0.5) * 240, 1.4 + i * 2.4, (Math.random() - 0.5) * 240);
        pl.renderOrder = 2;
        pl.userData.spin = (Math.random() - 0.5) * 0.012;
        pl.userData.drift = Math.random() * 6.28;
        grp.add(pl);
        deco.mist.push(pl);
      }
      // 岸线低雾环：把岛与水的硬边化开（江南晨雾）
      for (let i = 0; i < 20; i++) {
        const a = (i / 20) * 6.283 + 0.17;
        const rr2 = 63 + Math.random() * 14;
        const s2 = 58 + Math.random() * 46;
        const mat2 = new THREE.MeshBasicMaterial({
          map: tex, transparent: true, opacity: 0.022 + Math.random() * 0.026,
          depthWrite: false, side: THREE.DoubleSide, color: 0xe6eeea
        });
        const pl2 = new THREE.Mesh(new THREE.PlaneGeometry(s2, s2), mat2);
        pl2.rotation.x = -Math.PI / 2;
        pl2.position.set(Math.cos(a) * rr2, 0.55 + Math.random() * 0.9, Math.sin(a) * rr2);
        pl2.renderOrder = 2;
        pl2.userData.spin = (Math.random() - 0.5) * 0.006;
        pl2.userData.drift = Math.random() * 6.28;
        grp.add(pl2);
        deco.mist.push(pl2);
      }
    }

    // 远处飞鸟：几组小剪影绕着塔慢慢盘旋
    const bt = birdTex();
    for (let i = 0; i < 9; i++) {
      const w = 6 + Math.random() * 3;
      const mat = new THREE.MeshBasicMaterial({
        map: bt, transparent: true, opacity: 0.72, depthWrite: false,
        side: THREE.DoubleSide, color: 0x2a3033
      });
      const b = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.5), mat);
      b.userData = {
        r: 46 + Math.random() * 70, a: Math.random() * 6.28,
        y: 46 + Math.random() * 26, sp: 0.055 + Math.random() * 0.05,
        ph: Math.random() * 6.28
      };
      grp.add(b);
      deco.birds.push(b);
    }

    // 水面反射（原 captureReflection 只在内部轮询，这里强制请求一次）
    try {
      const R = global.RENDER;
      if (R && R.requestReflection) R.requestReflection();
      else if (renderer && renderer.requestReflection) renderer.requestReflection();
    } catch (e) { }
  }

  function animDecor(dt) {
    if (!deco) return;
    if (deco.dust) deco.dust.rotation.y += dt * 0.006;
    for (let i = 0; i < deco.mist.length; i++) {
      const m = deco.mist[i];
      m.rotation.z += m.userData.spin * dt;
      m.position.x += Math.sin(t * 0.07 + m.userData.drift) * dt * 0.5;
      m.position.z += Math.cos(t * 0.05 + m.userData.drift) * dt * 0.5;
    }
    for (let i = 0; i < deco.birds.length; i++) {
      const b = deco.birds[i], d = b.userData;
      d.a += dt * d.sp;
      b.position.set(Math.cos(d.a) * d.r, d.y + Math.sin(t * 0.5 + d.ph) * 1.6, Math.sin(d.a) * d.r);
      b.rotation.y = -d.a + Math.PI / 2;
      b.rotation.z = Math.sin(t * 1.7 + d.ph) * 0.30;
    }
  }

  /* ---------------------------------------------------------------- frame */
  let lastMerged = null, sceneCheck = 0;

  // 默认取景：比原 wide 更近、更低，村庄占满赛璐璐画框
  function frameCamera() {
    const R = global.RENDER;
    if (!R || !R.cam) return;
    const c = R.cam;
    // cinema 自己当摄影指导：不管 ?view 给的是哪一档，都按电影构图重新取景
    const FR = {
      wide:  [0.64, 146],
      over:  [0.17, 300],
      water: [1.02, 104],
      close: [1.02, 24]
    };
    const v = QS.get('view') || 'wide';
    const f = FR[v] || FR.wide;
    c._phi = f[0]; c._dist = f[1];
    c.phi = f[0]; c.dist = f[1];
    c.minPhi = Math.min(c.minPhi, 0.12);
  }

  /* ============ 生命层：村民与家禽牲畜逐帧驱动 ============
     world.js 把每只个体单独合并成 holder（不进静态合并网格），
     这里只做「格子级游走」：沿可通行格选下一个中心点，朝它走，
     到点再选。不做寻路，因为路网是正交格，随机游走已经足够自然。 */
  const LIFE_OFF = QS.get('life') === '0';
  const LIFE_SPD = { villager: 0.62, dog: 0.90, duck: 0.22, buffalo: 0.10, chicken: 0.12, egret: 0.0 };
  const LIFE_RANGE = { villager: 26, dog: 30, duck: 7, buffalo: 2, chicken: 2, egret: 1 };
  let lifeT = 0;

  function lifePass(L, t, x, z) {
    const N = L.N;
    if (x < 1 || z < 1 || x >= N - 1 || z >= N - 1) return false;
    const k = L.kind[z * N + x];
    if (t === 'duck') return k === 1;
    if (t === 'buffalo') return k === 4;
    if (t === 'chicken') return k === 0 || k === 2 || k === 4;
    if (t === 'egret') return k === 0 || k === 4;
    return k === 2 || k === 8;                 // 村民 / 狗：路与桥
  }

  function lifePick(a, L) {
    const N = L.N;
    const cx = Math.round(a.x + N / 2 - 0.5), cz = Math.round(a.z + N / 2 - 0.5);
    const D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const opts = [];
    for (let k = 0; k < 4; k++) {
      const nx = cx + D[k][0], nz = cz + D[k][1];
      if (!lifePass(L, a.t, nx, nz)) continue;
      if (Math.abs(nx - a.hx) + Math.abs(nz - a.hz) > a.range) continue;
      let w = 1;
      if (a.dx === -D[k][0] && a.dz === -D[k][1]) w = 0.16;   // 别立刻折返
      opts.push([nx, nz, w, D[k][0], D[k][1]]);
    }
    if (!opts.length) { a.wait = 1.2 + Math.random() * 2.4; a.spdT = 0; return; }
    let tot = 0; for (const o of opts) tot += o[2];
    let r = Math.random() * tot, q = opts[0];
    for (const o of opts) { r -= o[2]; if (r <= 0) { q = o; break; } }
    a.tx = q[0] - N / 2 + 0.5;
    a.tz = q[1] - N / 2 + 0.5;
    a.dx = q[3]; a.dz = q[4];
  }

  function updateLife(dt) {
    const L = global.LIFE;
    if (LIFE_OFF || !L || !L.actors || !L.actors.length) return;
    lifeT += dt;
    for (let i = 0; i < L.actors.length; i++) {
      const a = L.actors[i];
      if (a.range === undefined) {
        a.range = LIFE_RANGE[a.t] || 10;
        a.dx = 0; a.dz = 0; a.spdT = 0; a.wait = a.wait || 0;
        a.tx = a.x; a.tz = a.z;
      }
      const h = a.h;
      const vmax = a.mode === 'idle' ? 0 : (LIFE_SPD[a.t] || 0.3);

      if (a.mode === 'idle') {
        a.idleT = (a.idleT || 0) + dt;
        if (a.idleT > 3.5 + (a.phase % 4)) { a.idleT = 0; lifePick(a, L); }
      }
      if (a.wait > 0) {
        a.wait -= dt;
        a.spdT += (0 - a.spdT) * Math.min(1, dt * 6);
        if (a.wait <= 0) lifePick(a, L);
      } else {
        const ddx = a.tx - a.x, ddz = a.tz - a.z;
        const d = Math.hypot(ddx, ddz);
        if (d < 0.08) {
          a.wait = a.mode === 'idle' ? 2.5 + Math.random() * 4 : (a.t === 'villager' ? 0.3 + Math.random() * 1.8
            : a.t === 'duck' ? 0.2 + Math.random() * 1.4
              : a.t === 'buffalo' ? 2 + Math.random() * 5
                : 0.4 + Math.random() * 2.0);
          lifePick(a, L);
        } else {
          const want = Math.atan2(ddx, ddz);
          let diff = want - a.dir;
          while (diff > Math.PI) diff -= 6.28318;
          while (diff < -Math.PI) diff += 6.28318;
          a.dir += diff * Math.min(1, dt * 3.2);
          a.spdT += (vmax - a.spdT) * Math.min(1, dt * 4);
          const step = a.spdT * dt;
          a.x += Math.sin(want) * step;
          a.z += Math.cos(want) * step;
        }
      }

      h.rotation.y = a.dir;
      const sp = a.spdT;
      if (a.t === 'villager') {
        h.position.set(a.x, a.y + Math.abs(Math.sin(lifeT * 7.4 + a.phase)) * 0.030 * (sp > 0.06 ? 1 : 0.15), a.z);
        h.rotation.z = Math.sin(lifeT * 7.4 + a.phase) * 0.035 * (sp > 0.06 ? 1 : 0);
      } else if (a.t === 'duck') {
        h.position.set(a.x, a.y + Math.sin(lifeT * 1.7 + a.phase) * 0.035, a.z);
        h.rotation.z = Math.sin(lifeT * 1.1 + a.phase) * 0.05;
      } else if (a.t === 'chicken') {
        const peck = Math.max(0, Math.sin(lifeT * 2.3 + a.phase));
        h.position.set(a.x, a.y + Math.abs(Math.sin(lifeT * 6.0 + a.phase)) * 0.014 * (sp > 0.02 ? 1 : 0), a.z);
        h.rotation.x = peck * peck * peck * 0.42;
      } else if (a.t === 'buffalo') {
        h.position.set(a.x, a.y + Math.sin(lifeT * 0.9 + a.phase) * 0.012, a.z);
        h.rotation.x = Math.max(0, Math.sin(lifeT * 0.42 + a.phase)) * 0.16;
      } else if (a.t === 'egret') {
        h.position.set(a.x, a.y + Math.sin(lifeT * 1.2 + a.phase) * 0.010, a.z);
        h.rotation.x = Math.max(0, Math.sin(lifeT * 0.7 + a.phase)) * 0.10;
      } else if (a.t === 'dog') {
        h.position.set(a.x, a.y + Math.abs(Math.sin(lifeT * 10.0 + a.phase)) * 0.028 * (sp > 0.06 ? 1 : 0), a.z);
      } else {
        h.position.set(a.x, a.y, a.z);
      }
    }
  }

  /* 找到水面材质（带 uDeep/uShallow 的 ShaderMaterial），拿到水位 */
  function findWater() {
    if (waterMatRef && waterMatRef.uniforms && waterMatRef.uniforms.uDeep) return waterMatRef;
    if (!scene) return null;
    let found = null;
    scene.traverse(function (o) {
      if (found || !o.isMesh || !o.material) return;
      const m = o.material;
      if (m.uniforms && m.uniforms.uDeep && m.uniforms.uShallow) { found = m; waterY = o.position.y; }
    });
    waterMatRef = found;
    return found;
  }

  const _biasM = new THREE.Matrix4().set(
    0.5, 0, 0, 0.5,
    0, 0.5, 0, 0.5,
    0, 0, 0.5, 0.5,
    0, 0, 0, 1);
  const _dirV = new THREE.Vector3(), _posV = new THREE.Vector3(), _tgtV = new THREE.Vector3();
  const _lookM = new THREE.Matrix4();
  const _reflClip = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.3);

  /* 平面倒影：镜像相机 + 一次场景渲染，写入 rtRefl */
  function renderReflection() {
    const wm = findWater();
    if (!wm || !rtRefl || !renderer || !camera) return;
    if (!mirrorCam) mirrorCam = new THREE.PerspectiveCamera();

    mirrorCam.fov = camera.fov;
    mirrorCam.aspect = camera.aspect;
    mirrorCam.near = camera.near;
    mirrorCam.far = camera.far;
    mirrorCam.updateProjectionMatrix();

    camera.updateMatrixWorld();
    camera.getWorldDirection(_dirV);
    _posV.copy(camera.position);
    _tgtV.copy(_posV).add(_dirV);

    mirrorCam.position.set(_posV.x, 2 * waterY - _posV.y, _posV.z);
    mirrorCam.up.set(0, -1, 0);
    _tgtV.set(_tgtV.x, 2 * waterY - _tgtV.y, _tgtV.z);
    // Object3D.lookAt 用的是 matrixWorld 里的位置（未刷新会算错方向），这里直接构造朝向矩阵
    _lookM.lookAt(mirrorCam.position, _tgtV, mirrorCam.up);
    mirrorCam.quaternion.setFromRotationMatrix(_lookM);
    mirrorCam.updateMatrixWorld(true);
    if (QS.get("dbg") === "14") {
      window.__reflDbg = { waterY: waterY, mc: [mirrorCam.position.x, mirrorCam.position.y, mirrorCam.position.z], tg: [_tgtV.x, _tgtV.y, _tgtV.z] };
      document.body.setAttribute("data-refl", waterY + " | mc " + mirrorCam.position.toArray().map(function(v){return v.toFixed(1);}).join(",") + " | tg " + _tgtV.toArray().map(function(v){return v.toFixed(1);}).join(",") + " | cam " + camera.position.toArray().map(function(v){return v.toFixed(1);}).join(","));
    }

    if (wm.uniforms.uReflMatrix) {
      wm.uniforms.uReflMatrix.value
        .copy(_biasM)
        .multiply(mirrorCam.projectionMatrix)
        .multiply(mirrorCam.matrixWorldInverse);
    }
    if (wm.uniforms.uRefl) {
      wm.uniforms.uRefl.value = rtRefl.texture;
      wm.uniforms.uHasRefl.value = 1;
      if (wm.uniforms.uRes) wm.uniforms.uRes.value.set(BW, BH);
    }

    // 水面本身不参与倒影渲染
    const wmesh = waterMeshRef();
    const prevVis = wmesh ? wmesh.visible : false;
    if (wmesh) wmesh.visible = false;
    // 镜像相机在水面以下，必须裁掉水面以下的几何（岛底、河床、裙边），否则只看到岛底
    _reflClip.constant = -(waterY - 0.02);
    renderer.clippingPlanes = [_reflClip];
    const prevShadow = renderer.shadowMap.autoUpdate;
    renderer.shadowMap.autoUpdate = false;

    renderer.setRenderTarget(rtRefl);
    renderer.setClearColor(0x000000, 1);
    renderer.clear(true, true, false);
    renderer.render(scene, (QS.get('reflcam') === '1' ? camera : mirrorCam));

    renderer.shadowMap.autoUpdate = prevShadow;
    renderer.clippingPlanes = [];
    if (wmesh) wmesh.visible = prevVis;
    renderer.setRenderTarget(null);
  }

  let _waterMesh = null;
  function waterMeshRef() {
    if (_waterMesh && _waterMesh.parent) return _waterMesh;
    _waterMesh = null;
    if (!scene) return null;
    scene.traverse(function (o) {
      if (_waterMesh || !o.isMesh || !o.material) return;
      if (o.material.uniforms && o.material.uniforms.uDeep) _waterMesh = o;
    });
    return _waterMesh;
  }

  function frame() {
    if (!ready) { try { init(); } catch (e) { console.error('[CINE] init failed', e); ready = false; return fallback(); } }
    const dt = Math.min(clock.getDelta(), 0.05);
    t += dt;
    if (STILL) { t = 4.0; fadeIn = 1; } else { fadeIn = Math.min(1, Math.max(fadeIn + dt * 0.55, (performance.now() - t0) / 1500)); }
    frameNo++;
    perfAcc += dt; perfN++;
    if (perfN >= 30) { lastFps = Math.round(perfN / Math.max(perfAcc, 1e-4)); perfAcc = 0; perfN = 0; if (hudEl) hudEl.textContent = lastFps + ' fps · ' + SW + 'x' + SH; }

    // 缓冲尺寸跟随窗口（无头/首帧时 init 拿到的尺寸可能还不是最终值）
    if ((frameNo % 4) === 1) {
      renderer.getDrawingBufferSize(V2);
      if ((V2.x | 0) !== BW || (V2.y | 0) !== BH) resize();
    }

    // 村庄合并网格每次重建后，重新挂投影（原实现整场景没开投影）
    // 注意：每次生成都可能在 init 之后才建好，所以要「找到前每帧都查」
    // 只在合并网格真的重建（对象被替换）时才重挂一遍；绝不能周期性重跑，
    // 否则每 30 帧就把全场景材质 needsUpdate 一次 → 卡到没法拖拽。
    if (scene) {
      const v = scene.getObjectByName('village-merged');
      if (v && v !== lastMerged) {
        lastMerged = v;
        try { fixLights(); } catch (e) { }
        try { decorate(); } catch (e) { }
        try { frameCamera(); } catch (e) { }
      }
    }

    updateMotion(dt);
    applyMotion();
    animDecor(dt);
    try { updateLife(dt); } catch (e) { }
    syncSky();
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();

    const invProj = new THREE.Matrix4().copy(camera.projectionMatrix).invert();
    aoMat.uniforms.uInvProj.value.copy(invProj);
    aoMat.uniforms.uProj.value.copy(camera.projectionMatrix);
    aoMat.uniforms.uTanHalf.value = Math.tan(camera.fov * Math.PI / 360);
    aoMat.uniforms.uAspect.value = camera.aspect;
    aoMat.uniforms.uNear.value = camera.near;
    aoMat.uniforms.uFar.value = camera.far;
    aoMat.uniforms.uTime.value = t;

    // 1) 场景 → 超采样缓冲
    if (DBG === 9) {  // 绕过后期，直接出图（判定 RT 还是管线）
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x000000, 1);
      renderer.clear(true, true, false);
      renderer.render(scene, camera);
      return;
    }
    // 0) 镜面倒影：把水面当镜子，用镜像相机单独渲一张，供水面着色器投影取样
    // 倒影隔帧更新：视觉上几乎看不出，省一半场景渲染开销
    if ((frameNo & 1) === 0 || !rtRefl) renderReflection();

    renderer.setRenderTarget(rtScene);
    renderer.setClearColor(0x000000, 1);
    renderer.clear(true, true, false);
    renderer.render(scene, camera);

    // 2) SSAO（两遍：计算 + 可分离模糊去噪，否则半分辨率噪声会变成屏幕上的斜纹）
    let aoTex = null;
    if (Q.ao) {
      aoMat.uniforms.tDepth.value = rtScene.depthTexture;
      quadMesh.material = aoMat;
      renderer.setRenderTarget(rtAO);
      renderer.clear();
      renderer.render(quadScene, quadCam);

      blurMat.uniforms.uTexel.value.set(2 / rtAO.width, 2 / rtAO.height);
      blurMat.uniforms.tColor.value = rtAO.texture;
      blurMat.uniforms.uDir.value.set(1, 0);
      quadMesh.material = blurMat;
      renderer.setRenderTarget(rtAO2);
      renderer.clear();
      renderer.render(quadScene, quadCam);

      blurMat.uniforms.tColor.value = rtAO2.texture;
      blurMat.uniforms.uDir.value.set(0, 1);
      quadMesh.material = blurMat;
      renderer.setRenderTarget(rtAO);
      renderer.clear();
      renderer.render(quadScene, quadCam);

      aoTex = rtAO.texture;
    }

    // 3) bloom
    let bloomTex = null;
    if (Q.bloom) {
      brightMat.uniforms.tColor.value = rtScene.texture;
      quadMesh.material = brightMat;
      renderer.setRenderTarget(rtBloomA);
      renderer.clear();
      renderer.render(quadScene, quadCam);

      blurMat.uniforms.uTexel.value.set(1 / rtBloomA.width, 1 / rtBloomA.height);
      for (let i = 0; i < 2; i++) {
        blurMat.uniforms.tColor.value = rtBloomA.texture;
        blurMat.uniforms.uDir.value.set(1, 0);
        quadMesh.material = blurMat;
        renderer.setRenderTarget(rtBloomB);
        renderer.clear();
        renderer.render(quadScene, quadCam);

        blurMat.uniforms.tColor.value = rtBloomB.texture;
        blurMat.uniforms.uDir.value.set(0, 1);
        quadMesh.material = blurMat;
        renderer.setRenderTarget(rtBloomA);
        renderer.clear();
        renderer.render(quadScene, quadCam);
      }
      bloomTex = rtBloomA.texture;
    }

    // 4) 合成
    const u = compMat.uniforms;
    u.tColor.value = rtScene.texture;
    u.tAO.value = aoTex;
    u.tBloom.value = bloomTex;
    u.tDepth.value = rtScene.depthTexture;
    if (u.tRefl) u.tRefl.value = rtRefl ? rtRefl.texture : null;
    u.uInvProj.value.copy(invProj);
    u.uCamWorld.value.copy(camera.matrixWorld);
    u.uCamPos.value.copy(camera.position);
    if (sun) u.uSunDir.value.copy(sun.position).normalize();
    u.uSunColor.value.copy(sky.uSun);
    u.uFogColor.value.copy(sky.uFog);
    u.uTime.value = t;
    u.uFade.value = fadeIn;
    // 现场调参统一在此生效
    u.uExposure.value = TUNE.exp;
    u.uFogDensity.value = TUNE.fog;
    u.uSat.value = TUNE.sat;
    u.uVignette.value = TUNE.vig;
    u.uGrain.value = Q.grain ? TUNE.grain : 0.0;
    u.uCA.value = Q.ca ? 0.0016 : 0.0;
    u.uAO.value = Q.ao ? TUNE.ao : 0.0;
    u.uBloom.value = Q.bloom ? TUNE.bloom : 0.0;

    const smap = (sun && sun.shadow && sun.shadow.map) ? sun.shadow.map.texture : null;
    u.tShadow.value = smap;
    u.uShadowOn.value = smap ? 1.0 : 0.0;

    quadMesh.material = compMat;
    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(quadScene, quadCam);

    adapt(dt);
  }

  function fallback() {
    // 初始化失败时保留原渲染路径
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  function adapt(dt) {
    // 动态画质：前 2 秒内若平均帧时间过长，降低超采样
    if (adaptChecked) return;
    adaptAcc += dt; adaptN++;
    if (adaptN >= 90) {
      adaptChecked = 1;
      const avg = adaptAcc / adaptN;
      if (avg > 0.028 && Q.ss > 1.0) {
        Q.ss = 1.0;
        resize();
      }
    }
  }

  /* ---------------------------------------------------------- shaders */
  const AO_FRAG = [
    'uniform sampler2D tDepth;',
    'uniform sampler2D uNoise;',
    'uniform mat4 uInvProj, uProj;',
    'uniform vec2 uRes;',
    'uniform float uTanHalf, uAspect, uNear, uFar, uRadius, uStrength, uTime;',
    'varying vec2 vUv;',
    'vec3 viewPos(vec2 uv){',
    '  float d = texture2D(tDepth, uv).x;',
    '  vec4 c = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);',
    '  vec4 v = uInvProj * c;',
    '  return v.xyz / v.w;',
    '}',
    'void main(){',
    '  float d = texture2D(tDepth, vUv).x;',
    '  if (d >= 0.99999) { gl_FragColor = vec4(1.0, 1.0, 0.0, 1.0); return; }',
    '  vec2 texel = 1.0 / uRes;',
    '  vec3 p = viewPos(vUv);',
    '  vec3 pr = viewPos(vUv + vec2(texel.x, 0.0));',
    '  vec3 pu = viewPos(vUv + vec2(0.0, texel.y));',
    '  vec3 n = normalize(cross(pr - p, pu - p));',
    '  if (dot(n, -p) < 0.0) n = -n;',
    '  vec2 rnd = texture2D(uNoise, vUv * uRes / 8.0).xy * 2.0 - 1.0;',
    '  float ao = 0.0, sun = 0.0;',
    '  const int N = 12;',
    '  for (int i = 0; i < N; i++) {',
    '    float fi = float(i);',
    '    float ang = (fi + rnd.x) * 2.39996;',
    '    vec3 dir = vec3(cos(ang), sin(ang), 0.0);',
    '    dir.z = 0.6 + 0.4 * fract(fi * 0.618 + rnd.y);',
    '    dir = normalize(dir);',
    '    if (dot(dir, n) < 0.0) dir = -dir;',
    '    vec3 sd = normalize(dir + n * 0.55);',
    '    vec3 sp = p + sd * uRadius * (0.35 + 0.65 * fract(fi * 0.371));',
    '    vec4 cp = uProj * vec4(sp, 1.0);',
    '    vec2 suv = cp.xy / cp.w * 0.5 + 0.5;',
    '    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) continue;',
    '    vec3 op = viewPos(suv);',
    '    float dz = sp.z - op.z;',
    '    if (dz > 0.05 && dz < 1.6) ao += 1.0 - smoothstep(0.9, 1.6, dz);',
    '  }',
    '  ao = 1.0 - (ao / float(N)) * uStrength;',
    '  ao = clamp(ao, 0.15, 1.0);',
    '  gl_FragColor = vec4(ao, 1.0, 0.0, 1.0);',
    '}'
  ].join('\n');

  const COMP_FRAG = [
    'uniform sampler2D tColor, tAO, tBloom, tDepth, tShadow, tRefl;',
    'uniform mat4 uInvProj, uCamWorld;',
    'uniform vec3 uCamPos, uSunDir, uSunColor, uFogColor;',
    'uniform vec2 uRes;',
    'uniform float uExposure, uAO, uBloom, uTime, uFade, uGrain, uVignette, uCA, uFogDensity, uFogHeight, uSat, uDbg, uShadowOn;',
    'varying vec2 vUv;',
    'float hash(vec2 p){ p = fract(p * vec2(0.1031, 0.1030)); p += dot(p, p.yx + 33.33); return fract((p.x + p.y) * p.x); }',
    'vec3 aces(vec3 x){',
    '  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;',
    '  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);',
    '}',
    'vec3 viewPos(vec2 uv){',
    '  float d = texture2D(tDepth, uv).x;',
    '  vec4 c = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);',
    '  vec4 v = uInvProj * c;',
    '  return v.xyz / v.w;',
    '}',
    'void main(){',
    '  vec2 uv = vUv;',
    '  if (uDbg == 1.0) { gl_FragColor = vec4(pow(max(texture2D(tColor, uv).rgb, 0.0), vec3(1.0/2.2)), 1.0); return; }',
    '  if (uDbg == 2.0) { float a = texture2D(tAO, uv).r; gl_FragColor = vec4(vec3(a), 1.0); return; }',
    '  if (uDbg == 3.0) { gl_FragColor = vec4(pow(max(texture2D(tBloom, uv).rgb, 0.0), vec3(1.0/2.2)), 1.0); return; }',
    '  if (uDbg == 4.0) { float d = texture2D(tDepth, uv).x; gl_FragColor = vec4(vec3(fract(d * 40.0)), 1.0); return; }',
    '  if (uDbg == 12.0) { if (uShadowOn < 0.5) { gl_FragColor = vec4(0.6, 0.0, 0.0, 1.0); return; } vec3 s = texture2D(tShadow, uv).rgb; gl_FragColor = vec4(pow(max(s, 0.0), vec3(1.0 / 2.2)), 1.0); return; }',
    '  if (uDbg == 13.0) { gl_FragColor = vec4(vec3(uShadowOn), 1.0); return; }',
    '  if (uDbg == 14.0) { vec3 r = texture2D(tRefl, uv).rgb; gl_FragColor = vec4(pow(max(r, 0.0), vec3(1.0/2.2)), 1.0); return; }',
    '  // --- 色散（边缘）',
    '  vec2 dc = uv - 0.5;',
    '  float ca = dot(dc, dc) * uCA;',
    '  vec3 c;',
    '  c.r = texture2D(tColor, uv - dc * ca).r;',
    '  c.g = texture2D(tColor, uv).g;',
    '  c.b = texture2D(tColor, uv + dc * ca).b;',
    '  // --- AO',
    '  if (uAO > 0.0 && uDbg != 6.0) {',
    '    vec2 t = 1.0 / uRes;',
    '    float a = texture2D(tAO, uv).r * 0.40',
    '            + texture2D(tAO, uv + vec2(t.x, 0.0)).r * 0.15',
    '            + texture2D(tAO, uv - vec2(t.x, 0.0)).r * 0.15',
    '            + texture2D(tAO, uv + vec2(0.0, t.y)).r * 0.15',
    '            + texture2D(tAO, uv - vec2(0.0, t.y)).r * 0.15;',
    '    c *= mix(1.0, a, uAO);',
    '  }',
    '  // --- 高度雾 / 大气透视',
    '  vec3 vp = viewPos(uv);',
    '  vec3 wp = (uCamWorld * vec4(vp, 1.0)).xyz;',
    '  float dist = length(wp - uCamPos);',
    '  float hf = exp(-max(wp.y, 0.0) * uFogHeight);',
    '  float fog = 1.0 - exp(-dist * uFogDensity * (0.35 + 0.65 * hf));',
    '  if (uDbg == 5.0) { gl_FragColor = vec4(vec3(fog), 1.0); return; }',
    '  if (uDbg == 7.0) { gl_FragColor = vec4(vec3(clamp(dist/600.0,0.0,1.0)), 1.0); return; }',
    '  vec3 vd = normalize(wp - uCamPos);',
    '  vec3 sdir = normalize(uSunDir + vec3(1e-4, 1e-4, 1e-4));',
    '  float sunAmt = pow(max(dot(vd, sdir), 0.0), 7.0);',
    '  vec3 fogC = uFogColor * (1.0 + sunAmt * 0.55) + uSunColor * sunAmt * 0.22;',
    '  if (uDbg == 8.0) { gl_FragColor = vec4(fogC, 1.0); return; }',
    '  if (uDbg == 10.0) { gl_FragColor = vec4(mix(c, fogC, clamp(fog, 0.0, 0.55)), 1.0); return; }',
    '  c = mix(c, fogC, clamp(fog, 0.0, 0.55));',
    '  // --- bloom',
    '  if (uBloom > 0.0) {',
    '    vec3 b = texture2D(tBloom, uv).rgb;',
    '    vec3 warm = vec3(1.06, 1.0, 0.92);',
    '    c += b * warm * uBloom;',
    '  }',
    '  // --- 曝光 + 胶片曲线',
    '  c *= uExposure;',
    '  c = aces(c);',
    '  // lift / gamma / gain 三段调色',
    '  c = pow(max(c, 0.0), vec3(0.96, 1.0, 1.04));',
    '  c = c * 0.97 + 0.008;',
    '  // S 形对比：把中灰推开，暗部沉下去，白墙才立得起来',
    '  c = mix(c, c * c * (3.0 - 2.0 * c), 0.22);',
    '  // 分色：暗部偏青，亮部偏暖',
    '  float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));',
    '  vec3 shadowTint = vec3(0.86, 0.99, 1.15);',
    '  vec3 highTint = vec3(1.05, 1.01, 0.95);',
    '  c *= mix(shadowTint, highTint, smoothstep(0.10, 0.85, lum));',
    '  // 饱和度',
    '  c = mix(vec3(lum), c, uSat);',
    '  // --- 暗角',
    '  float v = length((uv - 0.5) * vec2(1.05, 1.0));',
    '  c *= mix(1.0, uVignette, smoothstep(0.34, 0.95, v));',
    '  // --- 伽马 + 淡入',
    '  c = pow(max(c, 0.0), vec3(1.0 / 2.2));',
    '  // --- 颗粒：必须在伽马之后加。放在线性空间时 pow() 会把暗部的微小扰动放大成一片麻点',
    '  if (uGrain > 0.0) {',
    '    float g = hash(uv * uRes + fract(uTime) * 91.7) - 0.5;',
    '    c += g * uGrain;',
    '  }',
    '  c *= uFade;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n');

  /* ------------------------------------------------------- boot sequence */
  const LOGD = QS.get('debug') === '1';
  const errLog = [];
  if (LOGD) {
    window.addEventListener('error', function (e) { errLog.push('E:' + e.message); });
    const ce = console.error.bind(console);
    console.error = function () {
      const s = Array.prototype.slice.call(arguments).map(function (a) {
        return (a && a.message) ? a.message : String(a);
      }).join(' ');
      if (errLog.length < 6) errLog.push(s.slice(0, 300));
      ce.apply(null, arguments);
    };
    window.__cineErr = errLog;
    setInterval(function () {
      document.title = 'CINE ready=' + ready + ' t=' + t.toFixed(1) + ' fps=' + lastFps + ' fade=' + fadeIn.toFixed(2) +
        ' SW=' + SW + 'x' + SH + ' err=' + (errLog.length ? errLog.length + ' errs' : 'none') +
        ' sky=' + (sky.mat ? 'Y' : 'N') + '/' + (sky.uSun ? sky.uSun.getHexString() : '-') +
        '/' + (sky.uFog ? sky.uFog.getHexString() : '-') +
        ' u=' + (compMat ? compMat.uniforms.uSunColor.value.getHexString() + ',' + compMat.uniforms.uFogColor.value.getHexString() : '-');
      try { document.body.setAttribute('data-cine', errLog.join(' ~~~ ')); } catch (e) { }
    }, 900);
  }

  global.CINE = {
    step: updateLife,
    frame: function () {
      try { frame(); } catch (e) {
        console.error('[CINE] frame error', e);
        if (!global.__cineBroken) { global.__cineBroken = 1; renderedFallback = true; }
        fallbackOriginal();
      }
    },
    fixLights: function () { try { return fixLights(); } catch (e) { return -1; } },
    quality: Q,
    get ready() { return ready; }
  };

  let renderedFallback = false;
  let origRenderFrame = null;
  function fallbackOriginal() {
    renderer.setRenderTarget(null);
    renderer.render(scene, camera);
  }

  window.addEventListener('load', function () {
    setTimeout(function () {
      try {
        init();
        fixLights();
      } catch (e) { console.error('[CINE] setup failed', e); }
    }, 60);
  });
})(window);

</script>
</body>
</html>
