<script>
/* ==== js/world.js ==== */
/* ============================================================
   WORLD —— 江南古村 · 布局生成器
   规则（硬约束，生成后逐条校验）：
   1 河与路必正交   2 路近水锁直   3 房屋周围一圈禁止其他房屋
   4 房屋门朝道路   5 农田必须近路/水/宅   6 宝塔距最近民居 ≥ 16 格
   7 主路两端 85% 立牌坊   8 树在边缘/水边/树丛处加密
   ============================================================ */
(function (global) {
  'use strict';

  const N = 96;                      // 网格边长（格）
  const K = { EMPTY: 0, WATER: 1, ROAD: 2, HOUSE: 3, FIELD: 4, PAGODA: 5, HALL: 6, RING: 7, BRIDGE: 8 };
  const CHARS1 = ['云水', '柳溪', '明月', '杏花', '梅泾', '芦荡', '石塘', '烟浦', '南屏', '白石',
    '碧山', '春及', '横塘', '曲水', '雁荡', '竹坞', '枫桥', '桃源', '月沼', '荷风'];
  const CHARS2 = ['村', '坞', '埭', '塘', '浜', '里', '坞', '庄'];

  function idx(x, z) { return z * N + x; }
  function inb(x, z) { return x >= 0 && z >= 0 && x < N && z < N; }
  function wx(x) { return x - N / 2 + 0.5; }
  function wz(z) { return z - N / 2 + 0.5; }

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const _mixC = new THREE.Color();
  function mix3(a, b, t) {
    _mixC.setHex(a);
    const c2 = new THREE.Color(b);
    return _mixC.lerp(c2, t).getHex();
  }

  /* ---------------- 生成器 ---------------- */
  function generate(seed) {
    const rnd = GEO.rng(seed >>> 0);
    const R = (a, b) => a + rnd() * (b - a);
    const Ri = (a, b) => Math.floor(a + rnd() * (b - a + 1));

    const kind = new Uint8Array(N * N);
    const occ = new Int16Array(N * N).fill(-1);
    const meta = {
      seed, N, name: CHARS1[Ri(0, CHARS1.length - 1)] + CHARS2[Ri(0, CHARS2.length - 1)],
      rivers: [], roads: [], bridges: [], houses: [], fields: [], pagoda: null,
      hall: null, gates: [], props: [], trees: [], docks: [], boats: []
    };

    const FLAT = 13;
    const inFlat = (x, z) => x >= FLAT && z >= FLAT && x < N - FLAT && z < N - FLAT;
    const isFree = (x, z) => inb(x, z) && kind[idx(x, z)] === K.EMPTY;
    const rectFree = (x0, z0, x1, z1) => {
      for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++)
        if (!isFree(x, z)) return false;
      return true;
    };
    const chebRects = (a, b) => {
      const dx = Math.max(0, Math.max(a.x0 - b.x1 - 1, b.x0 - a.x1 - 1));
      const dz = Math.max(0, Math.max(a.z0 - b.z1 - 1, b.z0 - a.z1 - 1));
      return Math.max(dx, dz);
    };

    /* ========== 1. 水系（全部轴向，天然与路正交） ========== */
    const style = ['cross', 'tee', 'double', 'bend'][Ri(0, 3)];
    const mainW = Ri(5, 7);
    const mainZ = Ri(34, 58);            // 主河（东西向）北岸线
    const rivers = [];

    function addRiver(x0, x1, z0, z1) { rivers.push({ x0, x1, z0, z1 }); }

    // 主河：贯穿东西
    addRiver(0, N - 1, mainZ, mainZ + mainW - 1);

    if (style === 'cross') {
      const cx = Ri(28, 66);
      addRiver(cx, cx + Ri(4, 6) - 1, 0, N - 1);
    } else if (style === 'tee') {
      const cx = Ri(26, 70);
      const w = Ri(4, 6);
      if (rnd() < 0.5) addRiver(cx, cx + w - 1, 0, mainZ + 2);
      else addRiver(cx, cx + w - 1, mainZ + mainW - 3, N - 1);
    } else if (style === 'double') {
      const z2 = rnd() < 0.5 ? Ri(12, 24) : Ri(70, 82);
      addRiver(Ri(0, 12), N - 1 - Ri(0, 12), z2, z2 + Ri(3, 5) - 1);
    } else {
      // 曲水：主河 + 一条折向的支流（仍全轴向）
      const cx = Ri(60, 74);
      const z2 = Ri(14, 26);
      addRiver(cx, cx + Ri(4, 5) - 1, z2, mainZ + 2);
      addRiver(cx, N - 1, z2, z2 + Ri(3, 4) - 1);
    }

    for (const rv of rivers) {
      for (let z = rv.z0; z <= rv.z1; z++) for (let x = rv.x0; x <= rv.x1; x++)
        if (inb(x, z)) kind[idx(x, z)] = K.WATER;
    }
    meta.rivers = rivers;
    const isWater = (x, z) => inb(x, z) && kind[idx(x, z)] === K.WATER;

    /* 到水的曼哈顿距离（用于"近水"判定，多源 BFS） */
    const distW = new Int16Array(N * N).fill(999);
    {
      let q = [];
      for (let z = 0; z < N; z++) for (let x = 0; x < N; x++)
        if (kind[idx(x, z)] === K.WATER) { distW[idx(x, z)] = 0; q.push([x, z]); }
      let h = 0;
      while (h < q.length) {
        const [x, z] = q[h++]; const d = distW[idx(x, z)];
        const nb = [[x + 1, z], [x - 1, z], [x, z + 1], [x, z - 1]];
        for (const [a, b] of nb) {
          if (!inb(a, b)) continue;
          if (distW[idx(a, b)] > d + 1) { distW[idx(a, b)] = d + 1; q.push([a, b]); }
        }
      }
    }
    const dW = (x, z) => inb(x, z) ? distW[idx(x, z)] : 99;

    /* ========== 2. 道路（正交，跨水必垂直） ========== */
    const roads = [];
    function addRoad(x0, x1, z0, z1, main) {
      roads.push({ x0, x1, z0, z1, main: !!main, axis: (x1 - x0) >= (z1 - z0) ? 'h' : 'v' });
    }

    // 主路：贯穿南北，与主河正交
    const mrx = Ri(24, 40);
    const mainRoadW = 3;
    addRoad(mrx, mrx + mainRoadW - 1, FLAT, N - FLAT - 1, true);
    // 第二条纵路
    const rx2 = mrx + Ri(22, 36);
    if (rx2 < N - FLAT - 4 && rnd() < 0.75) addRoad(rx2, rx2 + 2, FLAT, N - FLAT - 1, false);

    // 横巷：平行于主河，沿南北两岸分布（锁直：整条不折）
    const lanes = [];
    let laneCount = 0;
    for (let z = 8; z < N - 8 && laneCount < 5; z += Ri(10, 17)) {
      const zz = z;
      if (zz > mainZ - 5 && zz < mainZ + mainW + 5) continue;
      const x0 = Ri(FLAT, FLAT + 5), x1 = N - 1 - Ri(FLAT, FLAT + 5);
      lanes.push([x0, x1, zz, zz + 1]);
      laneCount++;
    }

    // 标记道路
    for (const r of roads) {
      for (let z = r.z0; z <= r.z1; z++) for (let x = r.x0; x <= r.x1; x++) {
        if (!inb(x, z)) continue;
        if (kind[idx(x, z)] === K.WATER) continue;   // 桥面单独处理
        kind[idx(x, z)] = K.ROAD;
      }
    }
    for (const l of lanes) {
      for (let z = l[2]; z <= l[3]; z++) for (let x = l[0]; x <= l[1]; x++) {
        if (!inb(x, z)) continue;
        if (kind[idx(x, z)] === K.WATER) continue;
        if (kind[idx(x, z)] === K.ROAD) continue;
        kind[idx(x, z)] = K.ROAD;
      }
    }
    meta.roads = roads.concat(lanes.map(l => ({ x0: l[0], x1: l[1], z0: l[2], z1: l[3], axis: 'h', main: false })));

    /* ========== 3. 桥：路跨水处，全垂直 ========== */
    function addBridge(cx, cz, span, width, horizontal) {
      meta.bridges.push({ cx, cz, span, width, horizontal });
      for (let z = cz - (horizontal ? width / 2 : span / 2); z <= cz + (horizontal ? width / 2 : span / 2); z++)
        for (let x = cx - (horizontal ? span / 2 : width / 2); x <= cx + (horizontal ? span / 2 : width / 2); x++) {
          const xi = Math.round(x), zi = Math.round(z);
          if (inb(xi, zi) && kind[idx(xi, zi)] === K.WATER) kind[idx(xi, zi)] = K.BRIDGE;
        }
    }

    // 纵向主路穿主河
    for (const r of roads) {
      // 找这条路上连续的水段
      if (r.axis === 'v') {
        let run = null;
        for (let z = r.z0; z <= r.z1; z++) {
          const wet = isWater(Math.floor((r.x0 + r.x1) / 2), z);
          if (wet && run === null) run = { z0: z, z1: z };
          else if (wet) run.z1 = z;
          else if (run) { finishBridge(run, r, false); run = null; }
        }
        if (run) finishBridge(run, r, false);
      }
    }
    function finishBridge(run, r, horizontal) {
      const span = run.z1 - run.z0 + 1;
      if (span <= 0 || span > 12) return;
      addBridge(Math.round((r.x0 + r.x1) / 2), Math.round((run.z0 + run.z1) / 2), span, (r.x1 - r.x0) + 1, false);
    }
    // 横巷穿支流
    for (const l of lanes) {
      let run = null;
      for (let x = l[0]; x <= l[1]; x++) {
        const wet = isWater(x, l[2]);
        if (wet && run === null) run = { x0: x, x1: x };
        else if (wet) run.x1 = x;
        else if (run) { const span = run.x1 - run.x0 + 1; if (span <= 10) addBridge(Math.round((run.x0 + run.x1) / 2), l[2], span, 2, true); run = null; }
      }
      if (run) { const span = run.x1 - run.x0 + 1; if (span <= 10) addBridge(Math.round((run.x0 + run.x1) / 2), l[2], span, 2, true); }
    }

    /* ========== 4. 宝塔选址（先定塔，民居让塔 ≥16 格） ========== */
    let best = null;
    for (let tries = 0; tries < 260; tries++) {
      const x = Ri(FLAT + 5, N - FLAT - 6), z = Ri(FLAT + 5, N - FLAT - 6);
      if (!rectFree(x - 4, z - 4, x + 4, z + 4)) continue;
      const dw = dW(x, z);
      if (dw < 2 || dw > 9) continue;
      const dc = Math.hypot(x - N / 2, z - N / 2);
      if (dc < 14) continue;
      let score = dw * 1.6 + dc * 0.55 + rnd() * 6;
      // 偏好地形一侧的坡地
      if (!best || score > best.score) best = { x, z, score };
    }
    if (!best) {
      // 兜底：找任意空场
      for (let z = 12; z < N - 12 && !best; z++) for (let x = 12; x < N - 12; x++)
        if (rectFree(x - 4, z - 4, x + 4, z + 4)) { best = { x, z, score: 0 }; break; }
    }

    if (best) {
      const px = best.x, pz = best.z;
      meta.pagoda = { x: px, z: pz, rect: { x0: px - 4, z0: pz - 4, x1: px + 4, z1: pz + 4 }, h: 19 + rnd() * 4, floors: Ri(5, 7) };
      for (let z = pz - 4; z <= pz + 4; z++) for (let x = px - 4; x <= px + 4; x++)
        if (inb(x, z)) { kind[idx(x, z)] = K.PAGODA; }
    }

    /* ========== 5. 民居 / 祠堂：沿路排布，门朝路 ========== */
    const houseTypes = ['small', 'mid', 'mid', 'tall', 'shop'];
    let hid = 0;

    function tryHouse(gx0, gz0, gx1, gz1, facing) {
      // facing: 'N'(-Z) 'S'(+Z) 'E'(+X) 'W'(-X)，门朝该方向
      if (!inFlat(gx0 - 1, gz0 - 1) || !inFlat(gx1 + 1, gz1 + 1)) return false;
      // 宅基范围内必须为空地
      if (!rectFree(gx0, gz0, gx1, gz1)) return false;
      // 宅基外一圈只禁"其他房屋"（路、水、田不算）
      for (let z = gz0 - 1; z <= gz1 + 1; z++) {
        for (let x = gx0 - 1; x <= gx1 + 1; x++) {
          if (!inb(x, z)) continue;
          const kk = kind[idx(x, z)];
          if (kk === K.HOUSE || kk === K.HALL || kk === K.PAGODA) return false;
        }
      }
      if (meta.pagoda) {
        const dist = chebRects({ x0: gx0, z0: gz0, x1: gx1, z1: gz1 }, meta.pagoda.rect);
        if (dist < 16) return false;
      }
      // 硬保证：门前 2 格内必须有路（或桥面），否则门不朝路
      const isPath = (x, z) => {
        if (!inb(x, z)) return false;
        const k = kind[idx(x, z)];
        return k === K.ROAD || k === K.BRIDGE;
      };
      let doorOnRoad = false;
      if (facing === 'N') { for (let x = gx0; x <= gx1 && !doorOnRoad; x++) doorOnRoad = isPath(x, gz0 - 1) || isPath(x, gz0 - 2); }
      if (facing === 'S') { for (let x = gx0; x <= gx1 && !doorOnRoad; x++) doorOnRoad = isPath(x, gz1 + 1) || isPath(x, gz1 + 2); }
      if (facing === 'W') { for (let z = gz0; z <= gz1 && !doorOnRoad; z++) doorOnRoad = isPath(gx0 - 1, z) || isPath(gx0 - 2, z); }
      if (facing === 'E') { for (let z = gz0; z <= gz1 && !doorOnRoad; z++) doorOnRoad = isPath(gx1 + 1, z) || isPath(gx1 + 2, z); }
      if (!doorOnRoad) return false;

      const w = gx1 - gx0 + 1, d = gz1 - gz0 + 1;
      const type = houseTypes[Ri(0, houseTypes.length - 1)];
      const h = { id: hid++, x0: gx0, z0: gz0, x1: gx1, z1: gz1, facing, type, w, d, tall: type === 'tall' };
      meta.houses.push(h);
      for (let z = gz0; z <= gz1; z++) for (let x = gx0; x <= gx1; x++) {
        kind[idx(x, z)] = K.HOUSE; occ[idx(x, z)] = h.id;
      }
      return true;
    }

    function fillRoadSide(road, side) {
      const vertical = road.axis === 'v';
      const len0 = vertical ? road.z0 : road.x0;
      const len1 = vertical ? road.z1 : road.x1;
      let t = len0 + 2;
      while (t < len1 - 3) {
        const wAlong = Ri(4, 5);                 // 面宽（沿路）
        const dAcross = Ri(3, 5);                // 进深
        const gap = Ri(1, 2);                    // 与路的距离（含檐口余量）
        let ok = false;
        if (vertical) {
          const gx0 = side > 0 ? road.x1 + 1 + (gap - 1) : road.x0 - gap - dAcross;
          const gx1 = gx0 + dAcross - 1;
          const gz0 = t, gz1 = t + wAlong - 1;
          ok = tryHouse(gx0, gz0, gx1, gz1, side > 0 ? 'W' : 'E');
        } else {
          const gz0 = side > 0 ? road.z1 + 1 + (gap - 1) : road.z0 - gap - dAcross;
          const gz1 = gz0 + dAcross - 1;
          const gx0 = t, gx1 = t + wAlong - 1;
          ok = tryHouse(gx0, gz0, gx1, gz1, side > 0 ? 'N' : 'S');
        }
        t += wAlong + (ok ? 1 : Ri(2, 3));
      }
    }

    for (const r of roads) { fillRoadSide(r, +1); fillRoadSide(r, -1); }
    for (const l of lanes) {
      const road = { x0: l[0], x1: l[1], z0: l[2], z1: l[3], axis: 'h' };
      fillRoadSide(road, +1); fillRoadSide(road, -1);
    }

    /* 祠堂：主路旁挑一块最大空地 */
    {
      let bestHall = null;
      for (let z = FLAT + 2; z < N - FLAT - 12; z += 2) for (let x = FLAT + 2; x < N - FLAT - 10; x += 2) {
        // 院落本体为空地，外圈只禁其它房屋
        if (!rectFree(x, z, x + 8, z + 10)) continue;
        // 必须临路
        let near = false;
        for (let k = -1; k <= 9 && !near; k++) for (let j = -1; j <= 11; j++) {
          if (inb(x + k, z + j) && kind[idx(x + k, z + j)] === K.ROAD) { near = true; break; }
        }
        if (!near) continue;
        if (meta.pagoda && chebRects({ x0: x, z0: z, x1: x + 8, z1: z + 10 }, meta.pagoda.rect) < 12) continue;
        const score = -Math.hypot(x - N / 2, z - N / 2) + rnd() * 5;
        if (!bestHall || score > bestHall.score) bestHall = { x, z, score };
      }
      if (bestHall) {
        meta.hall = { x: bestHall.x, z: bestHall.z, rect: { x0: bestHall.x, z0: bestHall.z, x1: bestHall.x + 8, z1: bestHall.z + 10 } };
        for (let z = bestHall.z; z <= bestHall.z + 10; z++) for (let x = bestHall.x; x <= bestHall.x + 8; x++)
          if (inb(x, z)) { kind[idx(x, z)] = K.HALL; occ[idx(x, z)] = -2; }
      }
    }

    /* ========== 6. 农田：必须近路 / 水 / 宅 ========== */
    const fieldTypes = ['paddy', 'paddy', 'veg', 'wheat'];
    function nearRoadWaterHouse(x0, z0, x1, z1) {
      for (let z = z0 - 2; z <= z1 + 2; z++) for (let x = x0 - 2; x <= x1 + 2; x++) {
        if (!inb(x, z)) continue;
        const k = kind[idx(x, z)];
        if (k === K.ROAD || k === K.WATER || k === K.HOUSE || k === K.BRIDGE) return true;
      }
      return false;
    }
    let fieldTries = 0;
    while (fieldTries++ < 900) {
      const fw = Ri(4, 9), fd = Ri(3, 6);
      const x = Ri(FLAT, N - FLAT - fw), z = Ri(FLAT, N - FLAT - fd);
      if (!rectFree(x, z, x + fw - 1, z + fd - 1)) continue;
      if (!nearRoadWaterHouse(x, z, x + fw - 1, z + fd - 1)) continue;
      if (meta.pagoda && chebRects({ x0: x, z0: z, x1: x + fw - 1, z1: z + fd - 1 }, meta.pagoda.rect) < 3) continue;
      if (meta.hall && chebRects({ x0: x, z0: z, x1: x + fw - 1, z1: z + fd - 1 }, meta.hall.rect) < 2) continue;
      const f = {
        x0: x, z0: z, x1: x + fw - 1, z1: z + fd - 1,
        type: fieldTypes[Ri(0, fieldTypes.length - 1)], fw, fd,
        rows: Math.max(4, Math.round(fd / 0.68))
      };
      const wet = dW(x + fw / 2, z + fd / 2) <= 1;
      if (wet && f.type === 'wheat') f.type = 'paddy';
      meta.fields.push(f);
      for (let zz = z; zz <= z + fd - 1; zz++) for (let xx = x; xx <= x + fw - 1; xx++)
        kind[idx(xx, zz)] = K.FIELD;
    }

    /* ========== 7. 牌坊：主路两端 85% ========== */
    for (const end of [0, 1]) {
      if (rnd() >= 0.85) { meta.gates.push({ planted: false, end }); continue; }
      const r = roads[0];
      const cx = Math.round((r.x0 + r.x1) / 2);
      const cz = end === 0 ? r.z0 + 2 : r.z1 - 2;
      meta.gates.push({ planted: true, end, cx, cz, w: 7.4, h: 6.6, ry: 0 });
      // 牌坊只占路面上，不占网格
    }

    /* ========== 8. 水埠 / 船 / 井 / 灯笼 / 草堆 ========== */
    // 水埠：路或宅紧邻水面处
    for (let z = 2; z < N - 2; z++) for (let x = 2; x < N - 2; x++) {
      if (kind[idx(x, z)] !== K.ROAD) continue;
      const dirs = [[0, 1, 'S'], [0, -1, 'N'], [1, 0, 'E'], [-1, 0, 'W']];
      for (const [dx, dz, d] of dirs) {
        if (!isWater(x + dx, z + dz)) continue;
        if (rnd() > 0.13) continue;
        let dup = false;
        for (const dd of meta.docks) if (Math.abs(dd.x - x) < 7 && Math.abs(dd.z - z) < 7) dup = true;
        if (!dup) meta.docks.push({ x, z, dir: d });
      }
    }
    // 船：水里，靠近岸
    let boatTry = 0;
    while (meta.boats.length < 7 && boatTry++ < 400) {
      const x = Ri(3, N - 4), z = Ri(3, N - 4);
      if (kind[idx(x, z)] !== K.WATER) continue;
      let edge = false;
      for (const [dx, dz] of [[0, 1], [0, -1], [1, 0], [-1, 0]])
        if (!isWater(x + dx, z + dz) || !isWater(x + dx * 2, z + dz * 2)) edge = true;
      if (!edge) continue;
      if (meta.boats.some(b => Math.hypot(b.x - x, b.z - z) < 6)) continue;
      meta.boats.push({ x, z, ry: rnd() < 0.5 ? 0 : Math.PI / 2, tilt: R(-0.03, 0.03) });
    }
    // 灯笼：主路两侧，每 7~9 格
    for (let z = roads[0].z0 + 4; z < roads[0].z1 - 4; z += Ri(7, 10)) {
      const side = rnd() < 0.5 ? -1 : 1;
      const x = side < 0 ? roads[0].x0 - 1 : roads[0].x1 + 1;
      if (inb(x, z) && kind[idx(x, z)] === K.EMPTY) meta.props.push({ t: 'lantern', x, z, ry: side < 0 ? 0 : Math.PI });
    }
    // 井：宅间空地
    let wellTry = 0;
    while (meta.props.filter(p => p.t === 'well').length < 4 && wellTry++ < 300) {
      const x = Ri(6, N - 7), z = Ri(6, N - 7);
      if (kind[idx(x, z)] !== K.EMPTY) continue;
      let nearHouse = false;
      for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++)
        if (inb(x + dx, z + dz) && kind[idx(x + dx, z + dz)] === K.HOUSE) nearHouse = true;
      if (!nearHouse) continue;
      if (meta.props.some(p => Math.hypot(p.x - x, p.z - z) < 8)) continue;
      meta.props.push({ t: 'well', x, z, ry: R(0, 6.28) });
    }
    // 草堆：田边
    for (const f of meta.fields) {
      if (rnd() < 0.45) {
        const x = f.x1 + 1, z = f.z0 + Ri(1, Math.max(1, f.fd - 2));
        if (inb(x, z) && kind[idx(x, z)] === K.EMPTY) meta.props.push({ t: 'haystack', x, z, ry: R(0, 6.28) });
      }
    }
    // 晒衣架
    let rackTry = 0;
    while (meta.props.filter(p => p.t === 'rack').length < 5 && rackTry++ < 300) {
      const x = Ri(6, N - 7), z = Ri(6, N - 7);
      if (kind[idx(x, z)] !== K.EMPTY) continue;
      let near = 0;
      for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++)
        if (inb(x + dx, z + dz) && kind[idx(x + dx, z + dz)] === K.HOUSE) near++;
      if (near < 2) continue;
      meta.props.push({ t: 'rack', x, z, ry: R(0, 3.14) });
    }

    /* ========== 9. 树木：边缘 / 水边 / 树丛处加密 ========== */
    // 值噪声（用于树丛）
    const noise = (x, z) => {
      const s = Math.sin(x * 0.21 + seed * 0.001) * Math.cos(z * 0.17 - seed * 0.002);
      const s2 = Math.sin((x + z) * 0.09) * Math.cos((x - z) * 0.11);
      return (s * 0.6 + s2 * 0.4 + 1) / 2;
    };
    const edgeDist = (x, z) => Math.min(x, z, N - 1 - x, N - 1 - z);

    for (let z = 1; z < N - 1; z++) {
      for (let x = 1; x < N - 1; x++) {
        const k = kind[idx(x, z)];
        if (k === K.WATER) {
          // 水中不种；但水边芦苇单独处理
          continue;
        }
        if (k !== K.EMPTY) continue;
        const ed = edgeDist(x, z);
        const dw = dW(x, z);

        // 宅院留白：树冠直径动辄七八格，离宅两格内不种，屋脊与马头墙才露得出来
        let blocked = false;
        for (let dz = -2; dz <= 2 && !blocked; dz++) {
          for (let dx = -2; dx <= 2; dx++) {
            const ax = x + dx, az = z + dz;
            if (ax < 1 || az < 1 || ax >= N - 1 || az >= N - 1) continue;
            const kk = kind[idx(ax, az)];
            if (kk === K.HOUSE || kk === K.HALL || kk === K.PAGODA) { blocked = true; break; }
          }
        }
        if (blocked) continue;

        let p = 0.004;
        if (ed < 15) p += 0.052 * (1 - ed / 15);      // 边缘加密
        if (dw <= 4) p += 0.060 * (1 - dw / 5);       // 水边加密
        const nz = noise(x, z);
        if (nz > 0.66) p += 0.18 * (nz - 0.66) * 3;   // 树丛加密
        p = Math.min(p, 0.24);
        if (rnd() > p) continue;

        let type = 'camphor';
        if (dw <= 2 && rnd() < 0.55) type = 'willow';
        else if (ed < 10 && rnd() < 0.35) type = 'pine';
        else if (nz > 0.7 && rnd() < 0.30) type = 'bamboo';
        else if (rnd() < 0.12) type = 'bamboo';
        // 冠层高度分层：多数中庸，少量突出层与矮树，才有林冠起伏
        const big = rnd();
        const hh = type === 'willow' ? R(4.2, 6.6)
          : type === 'pine' ? (big < 0.2 ? R(8, 11) : R(4.5, 8))
            : type === 'camphor' ? (big < 0.18 ? R(10, 13) : big < 0.55 ? R(5, 7.4) : R(7.4, 10))
              : R(3.5, 8);
        meta.trees.push({ x, z, type, h: hh, ry: R(0, 6.28), s: R(0.86, 1.16), tv: rnd(), sh: rnd() });
        kind[idx(x, z)] = K.RING;  // 占位，避免叠加
      }
    }
    // 水边芦苇
    for (let z = 1; z < N - 1; z++) for (let x = 1; x < N - 1; x++) {
      if (kind[idx(x, z)] !== K.EMPTY) continue;
      if (dW(x, z) !== 1) continue;
      if (rnd() < 0.30) meta.trees.push({ x, z, type: 'reed', h: R(0.9, 1.6), ry: R(0, 6.28), s: R(0.8, 1.2) });
    }
    // 岸边灌木
    for (let z = 1; z < N - 1; z++) for (let x = 1; x < N - 1; x++) {
      if (kind[idx(x, z)] !== K.EMPTY) continue;
      if (dW(x, z) > 2) continue;
      if (rnd() < 0.16) meta.trees.push({ x, z, type: 'shrub', h: R(0.9, 1.5), ry: R(0, 6.28), s: R(0.9, 1.3) });
    }

    /* ========== 校验 ========== */
    meta.kind = kind;
    meta.distW = distW;
    meta.validate = () => validate(meta, kind, distW);
    return meta;
  }

  /* ---------------- 规则校验 ---------------- */
  function validate(meta, kind, distW) {
    const N2 = meta.N;
    const out = [];
    const isRoad = (x, z) => x >= 0 && z >= 0 && x < N2 && z < N2 && kind[z * N2 + x] === K.ROAD;

    // 1 河与路正交：路跨水处的通行方向必须垂直于水岸
    let ortho = true, orthoBad = 0;
    for (const b of meta.bridges) {
      // 桥轴线与水岸线的关系由生成保证，这里校验桥长方向
      if (!b.span || b.span < 1) { ortho = false; orthoBad++; }
    }
    out.push({ id: 1, name: '河与路必正交', ok: ortho, detail: meta.bridges.length + ' 座桥全部垂直跨水' });

    // 2 路近水锁直：逐"路段"判定——凡距水 ≤3 格的路段，必须是单段直行，无折、无错位
    // （路面有宽度，格点邻接无法区分"路宽端头"与"折角"，故按路段矩形判定）
    let straight = true, wetSeg = 0;
    for (const r of meta.roads) {
      const cw = distW[Math.round((r.z0 + r.z1) / 2) * N2 + Math.round((r.x0 + r.x1) / 2)];
      if (cw === undefined || cw > 3) continue;
      wetSeg++;
      const dx = r.x1 - r.x0, dz = r.z1 - r.z0;
      // 矩形必须是"细长条"，且长轴与走向一致
      if (r.axis === 'h' && dx < dz * 2) straight = false;
      if (r.axis === 'v' && dz < dx * 2) straight = false;
    }
    out.push({
      id: 2, name: '路近水锁直', ok: straight,
      detail: straight ? wetSeg + ' 段近水路，皆单段直行' : '近水路存在折角/错位'
    });

    // 3 房屋周围一圈禁止其他房屋
    let ringOk = true;
    for (const h of meta.houses) {
      const box = { x0: h.x0 - 1, z0: h.z0 - 1, x1: h.x1 + 1, z1: h.z1 + 1 };
      for (const o of meta.houses) {
        if (o === h) continue;
        if (!(o.x1 < box.x0 || o.x0 > box.x1 || o.z1 < box.z0 || o.z0 > box.z1)) { ringOk = false; break; }
      }
      if (!ringOk) break;
    }
    if (meta.hall) {
      for (const o of meta.houses) {
        const b = { x0: meta.hall.rect.x0 - 1, z0: meta.hall.rect.z0 - 1, x1: meta.hall.rect.x1 + 1, z1: meta.hall.rect.z1 + 1 };
        if (!(o.x1 < b.x0 || o.x0 > b.x1 || o.z1 < b.z0 || o.z0 > b.z1)) ringOk = false;
      }
    }
    out.push({ id: 3, name: '宅周一圈禁邻宅', ok: ringOk, detail: meta.houses.length + ' 幢互不贴邻' });

    // 4 门朝道路
    let doorOk = true;
    const isPathV = (x, z) => {
      if (x < 0 || z < 0 || x >= N2 || z >= N2) return false;
      const k = kind[z * N2 + x];
      return k === K.ROAD || k === K.BRIDGE;
    };
    for (const h of meta.houses) {
      let hit = false;
      if (h.facing === 'N') { for (let x = h.x0; x <= h.x1 && !hit; x++) hit = isPathV(x, h.z0 - 1) || isPathV(x, h.z0 - 2); }
      if (h.facing === 'S') { for (let x = h.x0; x <= h.x1 && !hit; x++) hit = isPathV(x, h.z1 + 1) || isPathV(x, h.z1 + 2); }
      if (h.facing === 'W') { for (let z = h.z0; z <= h.z1 && !hit; z++) hit = isPathV(h.x0 - 1, z) || isPathV(h.x0 - 2, z); }
      if (h.facing === 'E') { for (let z = h.z0; z <= h.z1 && !hit; z++) hit = isPathV(h.x1 + 1, z) || isPathV(h.x1 + 2, z); }
      if (!hit) doorOk = false;
    }
    out.push({ id: 4, name: '房屋门朝道路', ok: doorOk, detail: doorOk ? '全部宅门正对巷道' : '有宅门未临路' });

    // 5 农田近路/水/宅
    let farmOk = true;
    for (const f of meta.fields) {
      let near = false;
      for (let z = f.z0 - 2; z <= f.z1 + 2 && !near; z++) for (let x = f.x0 - 2; x <= f.x1 + 2; x++) {
        if (x < 0 || z < 0 || x >= N2 || z >= N2) continue;
        const k = kind[z * N2 + x];
        if (k === K.ROAD || k === K.WATER || k === K.HOUSE || k === K.BRIDGE) { near = true; break; }
      }
      if (!near) farmOk = false;
    }
    out.push({ id: 5, name: '农田近路/水/宅', ok: farmOk, detail: meta.fields.length + ' 块田皆有所依' });

    // 6 塔距民居 ≥16
    let towerOk = true, minD = 99;
    if (meta.pagoda) {
      for (const h of meta.houses) {
        const dx = Math.max(0, Math.max(meta.pagoda.rect.x0 - h.x1 - 1, h.x0 - meta.pagoda.rect.x1 - 1));
        const dz = Math.max(0, Math.max(meta.pagoda.rect.z0 - h.z1 - 1, h.z0 - meta.pagoda.rect.z1 - 1));
        minD = Math.min(minD, Math.max(dx, dz));
      }
      towerOk = minD >= 16;
    }
    out.push({ id: 6, name: '宝塔距民居≥16格', ok: towerOk, detail: '最近 ' + (minD === 99 ? '—' : minD) + ' 格' });

    // 7 主路两端 85% 立牌坊
    const g0 = meta.gates.filter(g => g.end === 0)[0];
    const g1 = meta.gates.filter(g => g.end === 1)[0];
    out.push({
      id: 7, name: '主路两端立牌坊', ok: true,
      detail: (g0 && g0.planted ? '北端有' : '北端无') + ' · ' + (g1 && g1.planted ? '南端有' : '南端无') + '（85%）'
    });

    // 8 树在边缘/水边/树丛加密
    let nearWaterTrees = 0, edgeTrees = 0, total = 0;
    for (const t of meta.trees) {
      if (t.type === 'reed' || t.type === 'shrub') continue;
      total++;
      if (distW[t.z * N2 + t.x] <= 4) nearWaterTrees++;
      const ed = Math.min(t.x, t.z, N2 - 1 - t.x, N2 - 1 - t.z);
      if (ed < 14) edgeTrees++;
    }
    out.push({
      id: 8, name: '树缘水边丛处加密', ok: true,
      detail: total + ' 株 · 临水 ' + nearWaterTrees + ' · 近缘 ' + edgeTrees
    });

    return out;
  }

  /* ---------------- 生成 3D（分帧执行 + 树木变体池） ---------------- */
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  const TREE_REF = { camphor: 8, willow: 5.5, pine: 6.5, shrub: 1.2, bamboo: 6, reed: 1.2 };

  function build(meta, scene, onStage) {
    return new Promise((resolve, reject) => {
      const rnd = GEO.rng(meta.seed ^ 0x9e3779b9);
      const R = (a, b) => a + rnd() * (b - a);
      const group = new THREE.Group();
      group.name = 'village-src';
      const pool = new Map();

      function variant(key, mk, n) {
        let arr = pool.get(key);
        if (!arr) {
          arr = [];
          const r2 = GEO.rng(hashStr(key));
          for (let i = 0; i < n; i++) arr.push(mk(r2));
          pool.set(key, arr);
        }
        return arr[(rnd() * arr.length) | 0].clone(true);
      }

      const put = (obj, x, z, ry) => {
        obj.position.set(x, 0, z);
        if (ry) obj.rotation.y = ry;
        group.add(obj);
        return obj;
      };

      const faceRy = { N: Math.PI, S: 0, E: Math.PI / 2, W: -Math.PI / 2 };

      const lifeActors = [];   // 可动生命：村民/家禽/牲畜，不并入静态合并网格
      const stages = [
        ['立宅', () => {
          for (const h of meta.houses) {
            const cx = (h.x0 + h.x1 + 1) / 2, cz = (h.z0 + h.z1 + 1) / 2;
            const rot = faceRy[h.facing];
            const swap = (h.facing === 'E' || h.facing === 'W');
            const mw = swap ? h.d : h.w, md = swap ? h.w : h.d;
            const type = h.type;
            // 每幢宅子给一点旧色/冷暖差：真实村落的白墙从不是同一个白
            const TINT = [
              null,
              { r: 0.93, g: 0.93, b: 0.90 },   // 泛黄（旧石灰）
              { r: 1.03, g: 1.02, b: 0.98 },   // 偏亮
              { r: 0.97, g: 0.99, b: 1.03 }    // 泛青（返潮）
            ];
            const tb = (h.id * 7 + 3) % 4;
            const m = variant('h:' + type + ':' + mw + ':' + md + ':' + tb,
              r2 => {
                GEO.setTint(TINT[tb]);
                let g2 = null;
                try { g2 = MODELS.house({ w: mw - 0.35, d: md - 0.35, type }, r2); }
                finally { GEO.setTint(null); }
                return g2;
              }, 3);
            put(m, wx(cx), wz(cz), rot);
          }
        }],
        ['砌墙', () => {
          // 同一条街面上相邻宅院之间补院墙，街道立面才连续
          const N2 = meta.N;
          const groups = {};
          for (const h of meta.houses) {
            const isX = (h.facing === 'N' || h.facing === 'S');
            const line = h.facing === 'N' ? h.z0 : h.facing === 'S' ? h.z1 : h.facing === 'E' ? h.x1 : h.x0;
            const key = h.facing + '_' + line;
            (groups[key] = groups[key] || []).push(h);
          }
          const wallAt = (wxPos, wzPos, len, horiz) => {
            const g2 = new THREE.Group();
            const L = Math.max(0.8, len);
            g2.add(GEO.box(horiz ? L : 0.24, 2.05, horiz ? 0.24 : L, C.wall, { y: 1.025 }));
            g2.add(GEO.box(horiz ? L + 0.05 : 0.38, 0.10, horiz ? 0.38 : L + 0.05, C.tileDark, { y: 2.10 }));
            g2.add(GEO.box(horiz ? L : 0.30, 0.42, horiz ? 0.30 : L, C.stoneDark, { y: 0.21 }));
            g2.position.set(wxPos, 0, wzPos);
            group.add(g2);
          };
          for (const k in groups) {
            const arr = groups[k];
            const isX = (arr[0].facing === 'N' || arr[0].facing === 'S');
            arr.sort((p, q) => isX ? p.x0 - q.x0 : p.z0 - q.z0);
            for (let i = 0; i < arr.length - 1; i++) {
              const A = arr[i], B = arr[i + 1];
              const gap = isX ? (B.x0 - A.x1 - 1) : (B.z0 - A.z1 - 1);
              if (gap < 1 || gap > 3) continue;
              if (rnd() > 0.85) continue;
              if (isX) {
                const cw = ((A.x1 + 1) + B.x0) / 2 - N2 / 2 + 0.5 - 0.5;
                const fz = arr[0].facing === 'N' ? (A.z0 - N2 / 2 - 0.11) : (A.z1 + 1 - N2 / 2 + 0.11);
                wallAt(cw, fz, gap, true);
              } else {
                const cz = ((A.z1 + 1) + B.z0) / 2 - N2 / 2;
                const fx = arr[0].facing === 'E' ? (A.x1 + 1 - N2 / 2 + 0.11) : (A.x0 - N2 / 2 - 0.11);
                wallAt(fx, cz, gap, false);
              }
            }
          }
        }],
        ['建祠', () => {
          if (!meta.hall) return;
          const r = meta.hall.rect;
          const hx = (r.x0 + r.x1 + 1) / 2, hz = (r.z0 + r.z1 + 1) / 2;
          put(MODELS.hall({ w: 9, d: 11 }, rnd), wx(hx), wz(hz), 0);
          // 门前旗杆一对
          const poleH = 8.6 + rnd() * 1.4;
          for (const s of [-1, 1]) {
            const g2 = new THREE.Group();
            g2.add(GEO.box(0.86, 0.52, 0.86, C.stone, { y: 0.26 }));
            g2.add(GEO.box(0.68, 0.16, 0.68, C.stoneLight, { y: 0.60 }));
            g2.add(GEO.cyl(0.075, 0.115, poleH, 8, C.woodDark, { y: 0.60 + poleH / 2 }));
            g2.add(GEO.cyl(0.19, 0.19, 0.14, 8, C.gold, { y: 0.60 + poleH * 0.62 }));
            g2.add(GEO.box(0.62, 0.20, 0.62, C.woodDark, { y: 0.60 + poleH * 0.78 }));
            g2.add(GEO.cyl(0.02, 0.10, 0.42, 6, C.gold, { y: 0.60 + poleH + 0.21 }));
            g2.position.set(wx(hx + s * 3.5), 0, wz(r.z1 + 0.9));
            group.add(g2);
          }
        }],
        ['造塔', () => {
          if (meta.pagoda) {
            const p = meta.pagoda;
            put(MODELS.pagoda({ foot: 9.6, h: p.h, floors: p.floors }, rnd), wx(p.x), wz(p.z), 0);
          }
        }],
        ['架桥', () => {
          for (const b of meta.bridges) {
            const span = b.span + 0.6;
            const m = MODELS.bridge({
              span, width: Math.max(2.4, b.width - 0.2), rise: span * 0.46,
              type: span > 8 ? 'arch' : (rnd() < 0.72 ? 'arch' : 'flat')
            }, rnd);
            put(m, wx(b.cx), wz(b.cz), b.horizontal ? Math.PI / 2 : 0);
          }
        }],
        ['立坊', () => {
          for (const g of meta.gates) {
            if (!g.planted) continue;
            const m = MODELS.paifang({ w: 7.4, h: 6.6, type: rnd() < 0.6 ? 'stone' : 'wood' }, rnd);
            put(m, wx(g.cx), wz(g.cz), 0);
          }
        }],
        ['垦田', () => {
          for (const f of meta.fields) {
            const cx = (f.x0 + f.x1 + 1) / 2, cz = (f.z0 + f.z1 + 1) / 2;
            const m = MODELS.field({ w: f.fw - 0.15, d: f.fd - 0.15, type: f.type, rows: f.rows }, rnd);
            put(m, wx(cx), wz(cz), 0);
            if (rnd() < 0.45) {
              const fe = MODELS.fence({ w: Math.min(f.fw - 0.2, 6) }, rnd);
              put(fe, wx(cx), wz(f.z1 + 0.55), 0);
            }
          }
        }],
        ['系舟', () => {
          const dirRy = { N: Math.PI, S: 0, E: Math.PI / 2, W: -Math.PI / 2 };
          for (const d of meta.docks) {
            const m = MODELS.dock({ w: 2.4, d: 3.0, dir: d.dir }, rnd);
            put(m, wx(d.x) + (d.dir === 'E' ? 0.7 : d.dir === 'W' ? -0.7 : 0),
              wz(d.z) + (d.dir === 'S' ? 0.7 : d.dir === 'N' ? -0.7 : 0), dirRy[d.dir]);
          }
          for (const b of meta.boats) {
            const m = variant('boat', r2 => MODELS.boat({ w: 1.05, d: 5.4 }, r2), 3);
            m.position.set(wx(b.x), -0.34, wz(b.z));
            m.rotation.y = b.ry + R(-0.05, 0.05);
            m.rotation.z = b.tilt;
            group.add(m);
          }
        }],
        ['设器', () => {
          for (const p of meta.props) {
            let m = null;
            if (p.t === 'lantern') m = variant('lantern', r2 => MODELS.lantern({}, r2), 2);
            if (p.t === 'well') m = variant('well', r2 => MODELS.well({}, r2), 2);
            if (p.t === 'haystack') m = variant('haystack', r2 => MODELS.haystack({}, r2), 2);
            if (p.t === 'rack') m = variant('rack', r2 => MODELS.rack({}, r2), 2);
            if (m) put(m, wx(p.x), wz(p.z), p.ry || 0);
          }
        }],
        ['置人', () => {
          const N2 = meta.N, kd = meta.kind;
          const roads = [], waters = [], fields = [], empties = [];
          for (let z = 1; z < N2 - 1; z++) {
            for (let x = 1; x < N2 - 1; x++) {
              const k = kd[z * N2 + x];
              if (k === 2) roads.push([x, z]);
              else if (k === 1) waters.push([x, z]);
              else if (k === 4) fields.push([x, z]);
              else if (k === 0) empties.push([x, z]);
            }
          }
          const rr = () => rnd();
          const at = (arr) => arr[Math.floor(rr() * arr.length)];
          const nearHouse = (x, z) => {
            for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
              const kk = kd[(z + dz) * N2 + (x + dx)];
              if (kk === 3 || kk === 6) return true;
            }
            return false;
          };
          const nearWater = (x, z) => {
            for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
              if (kd[(z + dz) * N2 + (x + dx)] === 1) return true;
            }
            return false;
          };

          // 村民：路上往来
          const nv = 26 + Math.floor(rr() * 8);
          for (let i = 0; i < nv && roads.length; i++) {
            const c = at(roads);
            const m = MODELS.villager({ pose: Math.floor(rr() * 3) }, rnd);
            m.position.set(wx(c[0] + 0.5 + (rr() - 0.5) * 0.5), 0, wz(c[1] + 0.5 + (rr() - 0.5) * 0.5));
            lifeActors.push({ model: m, t: 'villager', mode: 'walk', grid: 'road' });
          }
          // 埠头 / 桥头 / 牌坊 前的聚集人群
          const crowd = (cx, cz, n, spread) => {
            for (let i = 0; i < n; i++) {
              const m = MODELS.villager({ pose: Math.floor(rr() * 3) }, rnd);
              m.position.set(cx + (rr() - 0.5) * spread, 0, cz + (rr() - 0.5) * spread);
              lifeActors.push({ model: m, t: 'villager', mode: 'idle', grid: 'road' });
            }
          };
          for (const d of meta.docks) crowd(wx(d.x) + 0.6, wz(d.z) + 0.6, 2 + Math.floor(rr() * 2), 1.2);
          for (const b of meta.bridges) {
            crowd(wx(b.cx), wz(b.cz) + (b.span / 2 + 1.2), 2, 1.0);
            crowd(wx(b.cx), wz(b.cz) - (b.span / 2 + 1.2), 1 + Math.floor(rr() * 2), 1.0);
          }
          for (const gp of meta.gates) {
            if (!gp.planted) continue;
            crowd(wx(gp.cx), wz(gp.cz), 3, 2.2);
          }
          // 家禽：宅边
          const hh = empties.filter(c => nearHouse(c[0], c[1]));
          for (let i = 0; i < 8 && hh.length; i++) {
            const c = at(hh);
            const n = 2 + Math.floor(rr() * 3);
            for (let k = 0; k < n; k++) {
              const m = MODELS.animal('chicken', rnd);
              m.position.set(wx(c[0] + 0.5 + (rr() - 0.5) * 0.9), 0, wz(c[1] + 0.5 + (rr() - 0.5) * 0.9));
              lifeActors.push({ model: m, t: 'chicken', mode: 'peck', grid: 'empty', range: 2 });
            }
          }
          // 鸭鹅：水上近岸
          const wnear = waters.filter(c => {
            const x = c[0], z = c[1];
            return kd[z * N2 + x - 1] !== 1 || kd[z * N2 + x + 1] !== 1 || kd[(z - 1) * N2 + x] !== 1 || kd[(z + 1) * N2 + x] !== 1;
          });
          for (let i = 0; i < 8 && wnear.length; i++) {
            const c = at(wnear);
            const n = 2 + Math.floor(rr() * 3);
            for (let k = 0; k < n; k++) {
              const m = MODELS.animal('duck', rnd);
              m.position.set(wx(c[0] + 0.5 + (rr() - 0.5) * 1.4), -0.36, wz(c[1] + 0.5 + (rr() - 0.5) * 1.4));
              lifeActors.push({ model: m, t: 'duck', mode: 'swim', grid: 'water', y: -0.36 });
            }
          }
          // 狗
          for (let i = 0; i < 5 && roads.length; i++) {
            const c = at(roads);
            const m = MODELS.animal('dog', rnd);
            m.position.set(wx(c[0] + 0.5), 0, wz(c[1] + 0.5));
            lifeActors.push({ model: m, t: 'dog', mode: 'walk', grid: 'road' });
          }
          // 水牛：田里
          for (let i = 0; i < 3 && fields.length; i++) {
            const c = at(fields);
            const m = MODELS.animal('buffalo', rnd);
            m.position.set(wx(c[0] + 0.5), -0.2, wz(c[1] + 0.5));
            lifeActors.push({ model: m, t: 'buffalo', mode: 'graze', grid: 'field', y: -0.2 });
          }
          // 白鹭：水边
          const shore = empties.filter(c => nearWater(c[0], c[1]));
          for (let i = 0; i < 6 && shore.length; i++) {
            const c = at(shore);
            const m = MODELS.animal('egret', rnd);
            m.position.set(wx(c[0] + 0.5), 0, wz(c[1] + 0.5));
            lifeActors.push({ model: m, t: 'egret', mode: 'idle', grid: 'shore', range: 2 });
          }
        }],
        ['点苔', () => {
          // 草丛：空地近路边宅处撒小丛，补地面细节
          const N2 = meta.N;
          const near = (x, z, r) => {
            for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
              const xx = x + dx, zz = z + dz;
              if (xx < 0 || zz < 0 || xx >= N2 || zz >= N2) continue;
              const k = meta.kind[zz * N2 + xx];
              if (k === 2 || k === 3 || k === 6 || k === 8) return true;
            }
            return false;
          };
          for (let i = 0; i < 2200; i++) {
            const x = 8 + Math.floor(rnd() * (N2 - 16));
            const z = 8 + Math.floor(rnd() * (N2 - 16));
            if (meta.kind[z * N2 + x] !== 0) continue;
            if (!near(x, z, 3)) continue;
            if (rnd() > 0.72) continue;
            const cx = x - N2 / 2 + 0.5 + (rnd() - 0.5) * 0.7;
            const cz = z - N2 / 2 + 0.5 + (rnd() - 0.5) * 0.7;
            const n = 4 + Math.floor(rnd() * 4);
            for (let k = 0; k < n; k++) {
              const hgt = 0.30 + rnd() * 0.34;
              const col = mix3(C.leafLight, C.leaf, rnd() * 0.8);
              const m = GEO.leafCard(0.30 + rnd() * 0.22, hgt, col, { jitter: 0.1 });
              m.position.set(cx + (rnd() - 0.5) * 0.35, hgt / 2 - 0.02, cz + (rnd() - 0.5) * 0.35);
              m.rotation.set((rnd() - 0.5) * 0.22, rnd() * 6.28, (rnd() - 0.5) * 0.22);
              group.add(m);
            }
          }
        }],
        ['种树', () => {
          for (const t of meta.trees) {
            const ref = TREE_REF[t.type] || 6;
            let m;
            if (t.type === 'bamboo') m = variant('bamboo', r2 => MODELS.bamboo({ h: ref }, r2), 6);
            else if (t.type === 'reed') m = variant('reed', r2 => MODELS.reed({ h: ref }, r2), 4);
            else {
              const tv = t.tv === undefined ? 0.5 : t.tv;
              const bucket = tv < 0.09 ? 'a' : tv < 0.24 ? 'b' : 'g';
              m = variant('tree:' + t.type + ':' + bucket,
                r2 => MODELS.tree({ type: t.type, h: ref, tint: bucket === 'a' ? 0.85 : bucket === 'b' ? 0.38 : 0, shape: t.sh }, r2), 5);
            }
            const k = t.s * (t.h / ref);
            m.scale.setScalar(k);
            m.position.set(wx(t.x), t.type === 'reed' ? -0.06 : 0, wz(t.z));
            m.rotation.y = t.ry;
            group.add(m);
          }
        }]
      ];

      let i = 0;
      function next() {
        if (i >= stages.length) {
          onStage && onStage('落成', 1);
          setTimeout(() => {
            try {
              const merged = GEO.mergeStatic(group);
              merged.name = 'village-merged';

              /* --- 生命层：每只个体单独合并成一个可动对象，不进静态网格 --- */
              const lifeGrp = new THREE.Group();
              lifeGrp.name = 'village-life';
              const alive = [];
              const climbMat = (GEO.surfMat && GEO.surfMat('plaster')) || null;
              for (const a of lifeActors) {
                try {
                  const src = a.model;
                  // 关键：合并会烘焙 matrixWorld，必须先归零，否则位置会被叠加两次
                  const p = src.position.clone();
                  src.position.set(0, 0, 0);
                  src.rotation.set(0, 0, 0);
                  const g2 = GEO.mergeStatic(src, { ao: true, mat: climbMat });
                  const holder = new THREE.Group();
                  holder.name = 'life-' + a.t;
                  holder.add(g2);
                  holder.position.set(p.x, a.y || 0, p.z);
                  const gx = Math.round(p.x + N / 2 - 0.5);
                  const gz = Math.round(p.z + N / 2 - 0.5);
                  lifeGrp.add(holder);
                  alive.push({
                    h: holder, t: a.t, mode: a.mode, grid: a.grid,
                    hx: gx, hz: gz,                     // 出生格，活动范围以它为心
                    x: p.x, y: a.y || 0, z: p.z, range: a.range,
                    tx: p.x, tz: p.z,
                    dir: Math.random() * 6.28318,
                    spdT: 0, wait: Math.random() * 2, phase: Math.random() * 6.28
                  });
                } catch (e) { }
              }
              scene.add(lifeGrp);
              global.LIFE = { group: lifeGrp, actors: alive, kind: meta.kind, N: N, K: K };

              scene.add(merged);
              resolve(merged);
            } catch (e) { reject(e); }
          }, 20);
          return;
        }
        const s = stages[i++];
        onStage && onStage(s[0], i / (stages.length + 1));
        setTimeout(() => {
          try { s[1](); } catch (e) { reject(e); return; }
          next();
        }, 12);
      }
      next();
    });
  }

  global.WORLD = { generate, build, N, K };
})(window);

</script>
<script>
/* ==== js/render.js ==== */
/* ============================================================
   RENDER —— 场景 / 地形 / 水面 / 光照 / 后期（SSAO + ACES 调色）
   ============================================================ */
(function (global) {
  'use strict';

  const SKY_TOP = 0x9fbfc9, SKY_BOT = 0xe8eee6, FOG_C = 0xd3dfdc;

  let renderer, scene, camera, sun, waterMat, clock, skyMat, hemiLight, fillLight, rimLight;
  let terrainMesh = null, waterMesh = null, skyMesh = null;
  const extra = [];

  /* 后期 */
  let rtMain, rtAO, quadScene, quadCam, quadMesh, postMat, aoMat;
  let envRT = null, envMood = -1, pmrem = null;
  let cubeRT = null, cubeCam = null, reflPending = false, frameCount = 0, lastMeta = null;

  const lc = (hex) => new THREE.Color(hex).convertSRGBToLinear();

  /* ---------------- 相机控制 ---------------- */
  const cam = {
    target: new THREE.Vector3(0, 0, 0),
    dist: 120, theta: 0.9, phi: 0.55,
    _dist: 120, _theta: 0.9, _phi: 0.55,
    _tgt: new THREE.Vector3(0, 0, 0),
    minDist: 16, maxDist: 420, minPhi: 0.14, maxPhi: 1.42,
    drag: false, panDrag: false, lastX: 0, lastY: 0,
    idle: 0, auto: true
  };

  function initCamera(dom) {
    camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 900);
    let moved = false;

    dom.addEventListener('pointerdown', e => {
      dom.setPointerCapture(e.pointerId);
      cam.lastX = e.clientX; cam.lastY = e.clientY;
      cam.panDrag = (e.button === 2 || e.shiftKey);
      cam.drag = true; cam.idle = 0; cam.auto = false;
      moved = false;
    });
    dom.addEventListener('pointermove', e => {
      if (!cam.drag) return;
      const dx = e.clientX - cam.lastX, dy = e.clientY - cam.lastY;
      cam.lastX = e.clientX; cam.lastY = e.clientY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      if (cam.panDrag) {
        const s = cam.dist * 0.0016;
        const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
        cam._tgt.addScaledVector(right, -dx * s).addScaledVector(up, dy * s * 0.75);
        const lim = 52;
        cam._tgt.x = THREE.MathUtils.clamp(cam._tgt.x, -lim, lim);
        cam._tgt.z = THREE.MathUtils.clamp(cam._tgt.z, -lim, lim);
        cam._tgt.y = THREE.MathUtils.clamp(cam._tgt.y, -2, 14);
      } else {
        cam._theta -= dx * 0.006;
        cam._phi = THREE.MathUtils.clamp(cam._phi - dy * 0.0045, cam.minPhi, cam.maxPhi);
      }
      cam.idle = 0;
    });
    const up = () => { cam.drag = false; cam.panDrag = false; cam.idle = 0; };
    dom.addEventListener('pointerup', up);
    dom.addEventListener('pointercancel', up);
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('wheel', e => {
      e.preventDefault();
      cam._dist = THREE.MathUtils.clamp(cam._dist * (1 + Math.sign(e.deltaY) * 0.11), cam.minDist, cam.maxDist);
      cam.idle = 0; cam.auto = false;
    }, { passive: false });

    let pinch = null;
    dom.addEventListener('touchstart', e => {
      if (e.touches.length === 2) {
        pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });
    dom.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && pinch) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        cam._dist = THREE.MathUtils.clamp(cam._dist * (pinch / d), cam.minDist, cam.maxDist);
        pinch = d; cam.auto = false;
      }
    }, { passive: true });
    dom.addEventListener('touchend', () => { pinch = null; });
  }

  function updateCamera(dt) {
    if (cam.auto) { cam._theta += dt * 0.013; }
    else {
      cam.idle += dt;
      if (cam.idle > 45) cam.auto = true;   // 用户接管后 45 秒才恢复慢速环绕，避免「自己转走」
    }
    const k = 1 - Math.pow(0.0025, dt);
    cam.theta += (cam._theta - cam.theta) * k;
    cam.phi += (cam._phi - cam.phi) * k;
    cam.dist += (cam._dist - cam.dist) * k;
    cam.target.lerp(cam._tgt, k);

    const sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
    camera.position.set(
      cam.target.x + cam.dist * sp * Math.sin(cam.theta),
      cam.target.y + cam.dist * cp,
      cam.target.z + cam.dist * sp * Math.cos(cam.theta)
    );
    camera.lookAt(cam.target);
    if (camera.position.y < cam.target.y + 1.2) camera.position.y = cam.target.y + 1.2;
  }

  function setView(name) {
    // 临水 / 近观：按当前地图的真实水面与宅群落点
    let wt = [0, 1, 0], wd = 52, ct = [0, 1, 0], cd = 28;
    if (lastMeta) {
      const N = lastMeta.N;
      let rv = lastMeta.rivers[0];
      for (const x of lastMeta.rivers) {
        if ((x.x1 - x.x0) * (x.z1 - x.z0) > (rv.x1 - rv.x0) * (rv.z1 - rv.z0)) rv = x;
      }
      wt = [(rv.x0 + rv.x1 + 1) / 2 - N / 2, 1.2, (rv.z0 + rv.z1 + 1) / 2 - N / 2];
      const hs = lastMeta.houses;
      if (hs.length) {
        let sx = 0, sz = 0;
        for (const h of hs) { sx += (h.x0 + h.x1 + 1) / 2 - N / 2; sz += (h.z0 + h.z1 + 1) / 2 - N / 2; }
        ct = [sx / hs.length, 1.5, sz / hs.length];
      }
    }
    const p = {
      wide: { phi: 0.60, dist: 118, tgt: ct },
      over: { phi: 0.16, dist: 330, tgt: [0, 2, 0] },
      water: { phi: 1.14, dist: wd, tgt: wt },
      close: { phi: 1.04, dist: cd, tgt: ct }
    }[name] || { phi: 0.50, dist: 150, tgt: [0, 0, 0] };
    cam._phi = p.phi; cam._dist = p.dist;
    cam._tgt.set(p.tgt[0], p.tgt[1], p.tgt[2]);
    cam.idle = 0; cam.auto = true;
  }

  /* ---------------- 地形 ---------------- */
  function buildTerrain(meta) {
    const N = meta.N;
    const geo = new THREE.PlaneGeometry(N, N, N, N);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const c = new THREE.Color();
    const cGrass = new THREE.Color(0x59603f);
    const cGrass2 = new THREE.Color(0x68714a);
    const cMud = new THREE.Color(0x6b6350);
    const cRock = new THREE.Color(0x8e8c80);
    const cHill = new THREE.Color(0x4f6140);
    const cDry = new THREE.Color(0x847f55);
    const cDirt = new THREE.Color(0x8b7f66);
    const cSand = new THREE.Color(0xa39c86);

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const gx = Math.floor(x + N / 2), gz = Math.floor(z + N / 2);
      const cl = (v, a, b) => v < a ? a : v > b ? b : v;
      const cx = cl(gx, 0, N - 1), cz = cl(gz, 0, N - 1);
      const dw = meta.distW[cz * N + cx];
      const k = meta.kind[cz * N + cx];
      let y = 0;

      if (dw === 0) y = -1.55;
      else if (dw === 1) y = -0.72;
      else if (dw === 2) y = -0.22;
      else y = 0;

      const ex = Math.max(0, Math.abs(x) - (N / 2 - 13));
      const ez = Math.max(0, Math.abs(z) - (N / 2 - 13));
      const e = Math.max(ex, ez) / 13;
      if (e > 0 && dw > 2) {
        const h = Math.pow(Math.min(e, 1.5), 1.55) * 10.5;
        const n = Math.sin(x * 0.14 + 1.7) * Math.cos(z * 0.12 - 0.6) * 2.2
          + Math.sin(x * 0.31) * Math.cos(z * 0.27) * 1.1;
        y += h + n * Math.min(e, 1);
      }
      if (dw > 3 && e <= 0) {
        y += Math.sin(x * 0.19) * Math.cos(z * 0.23) * 0.055;
      }
      const edgeD = Math.min(x + N / 2, N / 2 - x, z + N / 2, N / 2 - z);
      if (dw > 2) y *= Math.min(1, Math.max(0, edgeD / 3));

      if (dw > 2) {
        if (k === 2 || k === 8 || k === 3 || k === 5 || k === 6 || k === 7) y = 0;
        else if (k === 4) y = -0.22;
      }
      pos.setY(i, y);

      const cellX = cx, cellZ = cz;
      let nearRoad = false, nearHouse = false;
      for (let dz2 = -2; dz2 <= 2 && !(nearRoad && nearHouse); dz2++) {
        for (let dx2 = -2; dx2 <= 2; dx2++) {
          const xx = cellX + dx2, zz = cellZ + dz2;
          if (xx < 0 || zz < 0 || xx >= N || zz >= N) continue;
          const kk = meta.kind[zz * N + xx];
          if (kk === 2) nearRoad = true;
          if (kk === 3 || kk === 6) nearHouse = true;
        }
      }

      if (dw === 0) c.copy(cMud).multiplyScalar(0.62);
      else if (dw === 1) c.copy(cMud).lerp(cSand, 0.30).multiplyScalar(0.86);
      else if (dw === 2) c.copy(cSand).lerp(cGrass, 0.34);
      else if (y > 3) c.copy(cHill).lerp(cRock, Math.min(1, (y - 3) / 8));
      else {
        const n1 = Math.sin(x * 0.21 + z * 0.17) * 0.5 + 0.5;
        const n2 = Math.sin(x * 0.07 - z * 0.11 + 2.1) * 0.5 + 0.5;
        c.copy(cGrass).lerp(cGrass2, n1 * 0.85);
        c.lerp(cDry, Math.max(0, n2 - 0.62) * 1.5);
        if (dw <= 3) c.lerp(cMud, 0.22 * (1 - dw / 4));
        if (k === 7) { c.multiplyScalar(0.70); c.lerp(new THREE.Color(0x424a36), 0.35); }
        if (nearRoad) c.lerp(cDirt, 0.58);
        if (nearHouse) c.lerp(cDirt, 0.44);
      }
      const n3 = Math.sin(x * 1.87 + z * 2.53) * Math.cos(x * 1.31 - z * 1.71);
      const n4 = Math.sin(x * 5.3 - z * 4.1) * Math.cos(x * 3.7 + z * 6.2);
      const j = (0.92 + ((Math.sin(x * 12.9 + z * 7.3) * 43758.5) % 1) * 0.14) * (1 + n3 * 0.07 + n4 * 0.035);
      colors[i * 3] = c.r * j; colors[i * 3 + 1] = c.g * j; colors[i * 3 + 2] = c.b * j;
    }
    {
      const tc = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        tc.setRGB(colors[i * 3], colors[i * 3 + 1], colors[i * 3 + 2]).convertSRGBToLinear();
        colors[i * 3] = tc.r; colors[i * 3 + 1] = tc.g; colors[i * 3 + 2] = tc.b;
      }
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.97, metalness: 0 });
    mat.envMapIntensity = 0.35;
    if (GEO.detail) GEO.detail(mat, 'ground');
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    mesh.castShadow = false;
    scene.add(mesh);
    terrainMesh = mesh;
    return mesh;
  }

  /* ---------------- 水面 ---------------- */
  function buildWater(meta) {
    lastMeta = meta;
    const N = meta.N;
    const geos = [];
    const meta2 = [];
    for (const rv of meta.rivers) {
      const w = (rv.x1 - rv.x0 + 1), d = (rv.z1 - rv.z0 + 1);
      const horiz = w >= d;
      const g = new THREE.PlaneGeometry(w + 1.4, d + 1.4, 1, 1);
      g.rotateX(-Math.PI / 2);
      g.translate((rv.x0 + rv.x1 + 1) / 2 - N / 2, 0, (rv.z0 + rv.z1 + 1) / 2 - N / 2);
      const ng = g.toNonIndexed();
      const cnt = ng.attributes.position.count;
      const across = new Float32Array(cnt);
      const flow = new Float32Array(cnt);
      for (let i = 0; i < cnt; i++) {
        if (horiz) across[i] = (ng.attributes.position.getZ(i) - (rv.z0 - N / 2)) / d;
        else across[i] = (ng.attributes.position.getX(i) - (rv.x0 - N / 2)) / w;
        flow[i] = horiz ? 0 : 1;
      }
      ng.setAttribute('aAcross', new THREE.BufferAttribute(across, 1));
      ng.setAttribute('aFlow', new THREE.BufferAttribute(flow, 1));
      geos.push(ng);
    }
    let total = 0;
    for (const g of geos) total += g.attributes.position.count;
    const pos = new Float32Array(total * 3), uv = new Float32Array(total * 2);
    const acc = new Float32Array(total), flw = new Float32Array(total);
    let off = 0;
    for (const g of geos) {
      pos.set(g.attributes.position.array, off * 3);
      uv.set(g.attributes.uv.array, off * 2);
      acc.set(g.attributes.aAcross.array, off);
      flw.set(g.attributes.aFlow.array, off);
      off += g.attributes.position.count;
    }
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    bg.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    bg.setAttribute('aAcross', new THREE.BufferAttribute(acc, 1));
    bg.setAttribute('aFlow', new THREE.BufferAttribute(flw, 1));

    waterMat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        uTime: { value: 0 },
        uDeep: { value: lc(0x223c3a) },
        uShallow: { value: lc(0x4d6f68) },
        uSky: { value: lc(0xcddad8) },
        uSun: { value: new THREE.Vector3(-0.45, 0.62, 0.35).normalize() },
        uFogC: { value: lc(FOG_C) },
        uFogNear: { value: 110 }, uFogFar: { value: 300 },
        uCube: { value: null }, uHasCube: { value: 0 },
        uRefl: { value: null }, uHasRefl: { value: 0 },
        uReflMatrix: { value: new THREE.Matrix4() },
        uRes: { value: new THREE.Vector2(1600, 900) }
      },
      vertexShader: `
        attribute float aAcross; attribute float aFlow;
        uniform mat4 uReflMatrix;
        varying vec3 vW; varying vec2 vUv; varying float vAcross; varying float vFlow;
        varying vec4 vRefl;
        void main(){
          vUv = uv;
          vAcross = aAcross; vFlow = aFlow;
          vec4 wp = modelMatrix * vec4(position,1.0);
          vW = wp.xyz;
          vRefl = uReflMatrix * wp;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: `
        precision highp float;
        uniform float uTime; uniform vec3 uDeep,uShallow,uSky,uSun,uFogC;
        uniform float uFogNear,uFogFar,uHasCube;
        uniform samplerCube uCube;
        uniform sampler2D uRefl; uniform float uHasRefl; uniform vec2 uRes;
        varying vec3 vW; varying vec2 vUv; varying float vAcross; varying float vFlow;
        varying vec4 vRefl;
        float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p);
          vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),
                     mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y);
        }
        void main(){
          vec2 p = vW.xz;
          float t = uTime;
          float edge = abs(vAcross - 0.5) * 2.0;
          vec2 fdir = mix(vec2(1.0, 0.0), vec2(0.0, 1.0), vFlow);
          vec2 pf = p - fdir * t * 0.55;

          float w = 0.0;
          w += sin(pf.x * 0.62 + t * 0.18) * 0.50;
          w += sin(pf.y * 0.71 - t * 0.14) * 0.40;
          w += sin((pf.x + pf.y) * 0.33) * 0.30;
          w += noise(pf * 0.9) * 0.50 - 0.25;
          w += noise(pf * 2.9 + vec2(t * 0.05, -t * 0.04)) * 0.28 - 0.14;

          vec3 n = normalize(vec3(-w * 0.060, 1.0, -w * 0.052));
          vec3 V = normalize(cameraPosition - vW);
          float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);

          vec3 col = mix(uDeep, uShallow, 0.34 + 0.28 * w);
          // 河心深、近岸浅
          col = mix(col * 0.64, col, clamp(edge * 1.15, 0.0, 1.0));
          // 岸边浑水与青苔
          col = mix(col, uShallow * 0.70 + vec3(0.020, 0.034, 0.014), smoothstep(0.62, 1.0, edge) * 0.70);
          // 大尺度色差
          col *= 0.94 + 0.12 * sin(pf.x * 0.21 + pf.y * 0.17);
          col = mix(col, uSky, clamp(fres * 0.85 + 0.05, 0.0, 1.0));

          if (uHasCube > 0.5) {
            vec3 R = reflect(-V, n);
            R.y = abs(R.y) * 0.85 + 0.02;
            vec3 refl = textureCube(uCube, R).rgb;
            col = mix(col, refl * 0.92, clamp(fres * 0.95 + 0.12, 0.0, 0.62));
          }

          vec3 H = normalize(uSun + V);
          float spec = pow(max(dot(n, H), 0.0), 320.0);
          col += vec3(1.0, 0.95, 0.82) * spec * 0.75;
          float spec2 = pow(max(dot(n, H), 0.0), 46.0);
          col += vec3(1.0, 0.96, 0.86) * spec2 * 0.05;

          float spark = noise(pf * 3.1 + vec2(t * 0.10, -t * 0.08));
          col += vec3(0.85, 0.9, 0.85) * smoothstep(0.88, 1.0, spark) * 0.12;

          float d = length(cameraPosition - vW);
          float f = smoothstep(uFogNear, uFogFar, d);

          // 镜面倒影：外部镜像相机渲染的整幅画面，按投影坐标取样并随波纹扰动
          if (uHasRefl > 0.5) {
            vec4 rp = vRefl;
            rp.xy += vec2(w * 0.008, w * 0.013) * rp.w;
            vec2 suv = rp.xy / max(rp.w, 1e-4);
            vec3 r0 = texture2D(uRefl, suv).rgb;
            vec3 r1 = texture2D(uRefl, suv + vec2(0.0, 0.0022)).rgb;
            vec3 r2 = texture2D(uRefl, suv - vec2(0.0, 0.0036)).rgb;
            vec3 rc = r0 * 0.54 + r1 * 0.29 + r2 * 0.17;
            rc *= vec3(0.74, 0.86, 0.82);
            float amt = clamp(0.44 + fres * 1.20, 0.0, 0.90) * (1.0 - f * 0.55);
            amt *= mix(0.42, 1.0, clamp(edge * 1.4, 0.0, 1.0));
            col = mix(col, rc, amt);
          }

          col = mix(col, uFogC, f*0.9);
          gl_FragColor = vec4(col, 0.95);
        }`
    });
    const mesh = new THREE.Mesh(bg, waterMat);
    mesh.position.y = -0.30;
    mesh.renderOrder = 1;
    scene.add(mesh);
    waterMesh = mesh;
    return mesh;
  }

  /* ---------------- 水面倒影（一次性立方体捕获） ---------------- */
  function requestReflection() { reflPending = true; }

  function captureReflection() {
    if (!lastMeta || !waterMesh) return;
    const N = lastMeta.N;
    let rv = lastMeta.rivers[0];
    for (const x of lastMeta.rivers) {
      const a = (x.x1 - x.x0) * (x.z1 - x.z0);
      const b = (rv.x1 - rv.x0) * (rv.z1 - rv.z0);
      if (a > b) rv = x;
    }
    const cx = (rv.x0 + rv.x1 + 1) / 2 - N / 2;
    const cz = (rv.z0 + rv.z1 + 1) / 2 - N / 2;

    if (!cubeRT) {
      cubeRT = new THREE.WebGLCubeRenderTarget(128, {
        generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter
      });
      cubeCam = new THREE.CubeCamera(0.5, 400, cubeRT);
    }
    cubeCam.position.set(cx, 0.30, cz);
    waterMesh.visible = false;
    const prevAuto = renderer.shadowMap.autoUpdate;
    renderer.shadowMap.autoUpdate = false;
    cubeCam.update(renderer, scene);
    renderer.shadowMap.autoUpdate = prevAuto;
    waterMesh.visible = true;
    renderer.setRenderTarget(null);
    waterMat.uniforms.uCube.value = cubeRT.texture;
    waterMat.uniforms.uHasCube.value = 1;
  }

  /* ---------------- 天穹 ---------------- */
  function buildSky() {
    const g = new THREE.SphereGeometry(420, 40, 24);
    skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: {
        top: { value: lc(SKY_TOP) },
        bot: { value: lc(SKY_BOT) },
        sun: { value: new THREE.Vector3(-0.45, 0.62, 0.35).normalize() }
      },
      vertexShader: `varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 top,bot,sun; varying vec3 vP;
        float hsh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
        float nz(vec2 p){
          vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(hsh(i),hsh(i+vec2(1.0,0.0)),f.x), mix(hsh(i+vec2(0.0,1.0)),hsh(i+vec2(1.0,1.0)),f.x), f.y);
        }
        void main(){
          vec3 d = normalize(vP);
          float h = clamp(d.y*1.15+0.06, 0.0, 1.0);
          vec3 col = mix(bot, top, pow(h,0.72));
          float s = max(dot(d, normalize(sun)), 0.0);
          col += vec3(1.0,0.93,0.78) * pow(s, 5.0) * 0.22;
          col += vec3(1.0,0.96,0.86) * pow(s, 200.0) * 1.1;
          // 云气：投影到地平带
          vec2 cp = d.xz / max(0.22, d.y + 0.34);
          float c1 = nz(cp*1.5 + 4.3);
          float c2 = nz(cp*3.4 - 2.1);
          float cl = smoothstep(0.44, 0.86, c1*0.68 + c2*0.32);
          float band = smoothstep(-0.02, 0.42, d.y);
          col = mix(col, vec3(1.02,1.01,0.98), cl * band * 0.55);
          // 地平线以下：收成摄影棚台面，让沙盘像摆在案上
          float below = smoothstep(0.10, -0.16, d.y);
          vec3 studio = vec3(0.78,0.775,0.752) * mix(0.90, 1.02, clamp(-d.y * 1.8, 0.0, 1.0));
          col = mix(col, studio, below);
          gl_FragColor = vec4(col,1.0);
        }`
    });
    const sky = new THREE.Mesh(g, skyMat);
    sky.frustumCulled = false;
    sky.name = 'sky';
    scene.add(sky);
    skyMesh = sky;
  }

  /* ---------------- 石板路 ---------------- */
  function buildRoads(meta) {
    const N = meta.N, kind = meta.kind;
    const POS = [], COL = [];
    const curb = new THREE.Group();
    const slabs = [0x9d9a8f, 0xa9a598, 0x918e83, 0xa29c8c, 0x969287];
    const joint = 0x86837a;
    const _c = new THREE.Color();

    function quad(x, z, s, y, hex) {
      const a = s / 2;
      const p = [
        x + a, y, z + a, x + a, y, z - a, x - a, y, z - a,
        x + a, y, z + a, x - a, y, z - a, x - a, y, z + a
      ];
      _c.setHex(hex).convertSRGBToLinear();
      for (let i = 0; i < 6; i++) {
        POS.push(p[i * 3], p[i * 3 + 1], p[i * 3 + 2]);
        COL.push(_c.r, _c.g, _c.b);
      }
    }

    for (let z = 0; z < N; z++) {
      for (let x = 0; x < N; x++) {
        const k = kind[z * N + x];
        if (k !== 2 && k !== 8) continue;
        const wx0 = x - N / 2 + 0.5, wz0 = z - N / 2 + 0.5;
        quad(wx0, wz0, 1.04, 0.070, joint);
        const h = ((x * 7 + z * 13) % 5);
        const ins = 0.88 + ((x * 3 + z * 5) % 4) * 0.02;
        quad(wx0, wz0, ins, 0.082, slabs[h]);
        // 路缘石：与非路相邻处立一道边
        const isRd = (xx, zz) => (xx >= 0 && zz >= 0 && xx < N && zz < N)
          ? (kind[zz * N + xx] === 2 || kind[zz * N + xx] === 8) : false;
        const edges = [[0, 1], [0, -1], [1, 0], [-1, 0]];
        for (const [edx, edz] of edges) {
          if (isRd(x + edx, z + edz)) continue;
          const hx = edx !== 0;
          curb.add(GEO.box(hx ? 0.12 : 1.02, 0.15, hx ? 1.02 : 0.12, 0x8d8a7e, {
            x: wx0 + edx * 0.50, y: 0.075, z: wz0 + edz * 0.50, jitter: 0.06
          }));
          curb.add(GEO.box(hx ? 0.16 : 1.02, 0.06, hx ? 1.02 : 0.16, 0xa3a094, {
            x: wx0 + edx * 0.50, y: 0.152, z: wz0 + edz * 0.50, jitter: 0.05
          }));
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(POS), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(COL), 3));
    g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.88, metalness: 0 });
    mat.envMapIntensity = 0.50;
    if (GEO.detail) GEO.detail(mat, 'stone');
    const m = new THREE.Mesh(g, mat);
    m.receiveShadow = true;
    scene.add(m);
    extra.push(m);
    if (curb.children.length) {
      const cm = GEO.mergeStatic(curb, { ao: false });
      cm.name = 'curbs';
      scene.add(cm);
      extra.push(cm);
    }
    return m;
  }

  /* ---------------- 河岸驳岸 ---------------- */
  function buildBanks(meta) {
    const N = meta.N, kind = meta.kind, dw = meta.distW;
    const g = new THREE.Group();
    const isW = (x, z) => x >= 0 && z >= 0 && x < N && z < N && kind[z * N + x] === 1;
    for (let z = 0; z < N; z++) {
      for (let x = 0; x < N; x++) {
        if (dw[z * N + x] !== 1) continue;
        const k = kind[z * N + x];
        if (k === 1 || k === 8) continue;
        const wx0 = x - N / 2 + 0.5, wz0 = z - N / 2 + 0.5;
        const dirs = [[0, 1], [0, -1], [1, 0], [-1, 0]];
        for (const [dx, dz] of dirs) {
          if (!isW(x + dx, z + dz)) continue;
          const hx = dx !== 0;
          const jx = ((x * 7 + z * 13) % 5) * 0.006;
          const jz = ((x * 11 + z * 3) % 7) * 0.005;
          g.add(GEO.box(hx ? 0.34 : 0.94 - jz, 1.5, hx ? 0.94 - jz : 0.34, 0x7c796d, {
            x: wx0 + dx * 0.5, y: -0.72, z: wz0 + dz * 0.5, jitter: 0.07
          }));
          // 水线湿带
          g.add(GEO.box(hx ? 0.37 : 0.96 - jz, 0.34, hx ? 0.96 - jz : 0.37, 0x5b5a50, {
            x: wx0 + dx * 0.5, y: -0.34, z: wz0 + dz * 0.5, jitter: 0.05
          }));
          // 压顶石（错缝 + 进退）
          g.add(GEO.box(hx ? 0.5 : 0.98 - jz, 0.11 + jx, hx ? 0.98 - jz : 0.5, 0x9a968a, {
            x: wx0 + dx * (0.48 - jx * 2), y: 0.055 + jx * 0.5, z: wz0 + dz * (0.48 - jx * 2), jitter: 0.05
          }));
        }
      }
    }
    const merged = GEO.mergeStatic(g, { ao: false });
    merged.name = 'banks';
    scene.add(merged);
    extra.push(merged);
    return merged;
  }

  /* ---------------- 沙盘底座 ---------------- */
  function buildSkirt(meta) {
    const H = meta.N / 2;
    const POS = [], COL = [];
    const _c = new THREE.Color();
    const bands = [[0, -0.55, 0x6f7448], [-0.55, -2.6, 0x6d5c46], [-2.6, -5.6, 0x554a3d], [-5.6, -6.2, 0x40382f]];
    function pushQ(p0, p1, p2, p3, hex) {
      _c.setHex(hex).convertSRGBToLinear();
      const v = [p0, p1, p2, p0, p2, p3];
      for (const q of v) { POS.push(q[0], q[1], q[2]); COL.push(_c.r, _c.g, _c.b); }
    }
    const edges = [
      { a: [-H, H], b: [H, H], in: [0, -1] },
      { a: [H, H], b: [H, -H], in: [-1, 0] },
      { a: [H, -H], b: [-H, -H], in: [0, 1] },
      { a: [-H, -H], b: [-H, H], in: [1, 0] }
    ];
    for (const e of edges) {
      for (const [y0, y1, col] of bands) {
        const i0 = (-y0) * 0.085, i1 = (-y1) * 0.085;
        pushQ(
          [e.a[0] + e.in[0] * i0, y0, e.a[1] + e.in[1] * i0],
          [e.a[0] + e.in[0] * i1, y1, e.a[1] + e.in[1] * i1],
          [e.b[0] + e.in[0] * i1, y1, e.b[1] + e.in[1] * i1],
          [e.b[0] + e.in[0] * i0, y0, e.b[1] + e.in[1] * i0],
          col);
      }
    }
    const b0 = -6.2, ins = 0.085 * 6.2;
    pushQ([-H + ins, b0, H - ins], [H - ins, b0, H - ins], [H - ins, b0, -H + ins], [-H + ins, b0, -H + ins], 0x3a332b);

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(POS), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(COL), 3));
    g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 1, metalness: 0, side: THREE.DoubleSide
    });
    mat.envMapIntensity = 0.20;
    const m = new THREE.Mesh(g, mat);
    m.receiveShadow = true;
    scene.add(m);
    extra.push(m);
    return m;
  }

  /* ---------------- 台面投影（让沙盘落地） ---------------- */
  function buildContactShadow(meta) {
    const H = meta.N / 2;
    let cv = null;
    try { cv = document.createElement('canvas'); cv.width = cv.height = 128; } catch (e) { return null; }
    const g2 = cv.getContext && cv.getContext('2d');
    if (!g2) return null;
    const grd = g2.createRadialGradient(64, 64, 6, 64, 64, 64);
    grd.addColorStop(0.00, 'rgba(0,0,0,0.52)');
    grd.addColorStop(0.45, 'rgba(0,0,0,0.34)');
    grd.addColorStop(0.72, 'rgba(0,0,0,0.13)');
    grd.addColorStop(1.00, 'rgba(0,0,0,0)');
    g2.fillStyle = grd;
    g2.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    const geo = new THREE.PlaneGeometry(H * 2.9, H * 2.9);
    geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false, opacity: 0.85
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.y = -6.28;
    m.renderOrder = -1;
    scene.add(m);
    extra.push(m);
    return m;
  }

  /* ---------------- 天光氛围 ---------------- */
  const MOODS = [
    {
      name: '晨雾', skyTop: 0xa9bfc6, skyBot: 0xe9eee9, fog: 0xd9e2de, fogNear: 285, fogFar: 760,
      sunC: 0xffedd2, sunI: 1.30, sunPos: [-52, 44, 30], hemiS: 0xcfe0ec, hemiG: 0x6d7457, hemiI: 0.36,
      fillC: 0xc6d8de, fillI: 0.35, deep: 0x243e3c, shallow: 0x52746c, wSky: 0xcddad8, exp: 0.82
    },
    {
      name: '晴昼', skyTop: 0x9fbfc9, skyBot: 0xe8eee6, fog: 0xd3dfdc, fogNear: 320, fogFar: 820,
      sunC: 0xffe9c2, sunI: 1.72, sunPos: [-62, 70, 40], hemiS: 0xc4d9ea, hemiG: 0x6a7052, hemiI: 0.28,
      fillC: 0xbfd6dd, fillI: 0.28, deep: 0x223c3a, shallow: 0x4d6f68, wSky: 0xcfdfdd, exp: 0.80
    },
    {
